<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>圆几何交互式学习平台 - 圆周角定理匹配赛</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 复用 index.html 的基础样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", Arial, Helvetica, sans-serif;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background-image: url("image/bg.jpg");
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
        }
        a {
            text-decoration: none;
            color: #333;
            transition: all 0.3s ease;
        }

        :root {
            --main-color: #2563eb;
            --hover-color: #1d4ed8;
            --bg-color: #ffffff;
            --text-color: #333333;
            --light-bg: #f8fafc;
            --border-color: #e2e8f0;
            --shadow: 0 2px 10px rgba(0,0,0,0.08);
            --font-size: 16px;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: var(--font-size);
            line-height: 1.5;
            transition: all 0.3s ease-in-out;
        }

        /* 头部样式：与 index.html 完全一致 */
        .header-container {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
            width: 100%;
            height: 80px;
            padding: 0 2vw;
            background-color: var(--light-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: clamp(calc(18px / 16 * var(--font-size)), 2vw, calc(22px / 16 * var(--font-size)));
            font-weight: 700;
            color: var(--main-color);
        }
        .nav-main {
            position: relative;
            top: 5px;
            display: flex;
            gap: clamp(15px, 3vw, 30px);
        }
        .nav-link {
            font-size: clamp(calc(16px / 16 * var(--font-size)), 1.8vw, calc(18px / 16 * var(--font-size)));
            color: var(--text-color);
            font-weight: 500;
        }
        .nav-link.active {
            color: var(--main-color);
            font-weight: 700;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: clamp(10px, 2vw, 20px);
        }
        .lang-switch {
            font-size: clamp(calc(12px / 16 * var(--font-size)), 1.2vw, calc(14px / 16 * var(--font-size)));
            color: #64748b;
        }

        /* 主体容器 */
        .main-container {
            width: 100%;
            padding: calc(80px + 30px) 2vw 50px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            min-height: 100vh;
        }

        .breadcrumb {
            width: 100%;
            max-width: 800px;
            font-size: clamp(calc(12px / 16 * var(--font-size)), 1.2vw, calc(14px / 16 * var(--font-size)));
            color: #64748b;
        }
        .breadcrumb a { color: var(--main-color); }

        .game-container {
            width: 100%;
            max-width: 800px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: var(--shadow);
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }
        .game-info-item {
            font-size: clamp(calc(16px / 16 * var(--font-size)), 2vw, calc(18px / 16 * var(--font-size)));
            font-weight: 500;
        }
        .game-info-item span {
            color: var(--main-color);
            font-size: 20px;
        }

        .circle-display {
            width: 200px;
            height: 200px;
            border: 3px solid var(--main-color);
            border-radius: 50%;
            margin: 0 auto 30px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--light-bg);
        }
        .central-angle {
            font-size: 32px;
            color: var(--text-color);
            font-weight: 700;
        }

        .option-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 30px 0;
        }
        .option-btn {
            padding: 15px 0;
            background: var(--light-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 18px;
            color: var(--text-color);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .option-btn:hover {
            border-color: var(--main-color);
            background-color: #f1f5f9;
        }
        .option-btn.correct {
            background: #dcfce7 !important;
            border-color: #22c55e !important;
            color: #166534 !important;
        }
        .option-btn.wrong {
            background: #fee2e2 !important;
            border-color: #ef4444 !important;
            color: #991b1b !important;
        }

        .game-control {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .game-control-btn {
            padding: 10px 25px;
            background-color: var(--main-color);
            color: #fff;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        .game-control-btn:hover {
            background-color: var(--hover-color);
            transform: translateY(-2px);
        }

        .game-over {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            z-index: 10000;
            display: none;
            text-align: center;
            min-width: 300px;
        }
        .game-over h3 {
            margin-bottom: 20px;
            color: var(--main-color);
            font-size: 24px;
        }
        .game-over p {
            margin-bottom: 15px;
            font-size: 18px;
        }
        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #94a3b8;
        }

        /* 模式切换样式 */
        body.eye-mode {
            --bg-color: #f0f9eb;
            --light-bg: #f7fbf2;
            --text-color: #166534;
            --border-color: #c7e3b4;
        }
        body.night-mode {
            --bg-color: #1e293b;
            --light-bg: #2d3748;
            --text-color: #f1f5f9;
            --border-color: #475569;
            --main-color: #60a5fa;
            --hover-color: #3b82f6;
        }

        @media (max-width: 480px) {
            .header-container { height: 70px; }
            .main-container { padding-top: 100px; }
            .option-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header class="header-container">
        <div class="logo" id="logoText">圆几何交互式学习平台</div>
        <nav class="nav-main">
            <a href="index.html" class="nav-link" id="navHome">首页</a>
            <a href="game.html" class="nav-link active" id="navGame">游戏</a>
            <a href="quiz.html" class="nav-link" id="navQuiz">测试</a>
        </nav>
        <div class="header-right">
            <div class="lang-switch">
                <span id="currentLangDisplay">简体中文</span>
            </div>
        </div>
    </header>

    <main class="main-container">
        <div class="breadcrumb" id="breadcrumb">
            <a href="index.html" id="breadHome">首页</a> › <a href="game.html" id="breadGame">游戏中心</a> › <span id="breadCurrent">圆周角定理匹配赛</span>
        </div>
        <div class="game-container">
            <h2 id="gameTitle" style="margin-bottom: 10px;">圆周角定理匹配赛</h2>
            <p id="gameTip" style="color: #64748b; margin-bottom: 20px;">圆周角是圆心角的一半！选择正确的圆周角度数。</p>
            
            <div class="game-info">
                <div class="game-info-item">
                    <span id="scoreLabel">分数:</span> <span id="score">0</span>
                </div>
                <div class="game-info-item">
                    <span id="timeLabel">时间:</span> <span id="time">10</span> <span id="timeUnit">秒</span>
                </div>
            </div>

            <div class="circle-display">
                <div>
                    <span class="central-angle" id="centralAngle">?</span>°<br>
                    <small id="centralAngleText">圆心角</small>
                </div>
            </div>

            <h3 id="chooseText" style="margin-bottom: 20px;">选择正确的圆周角度数（°）</h3>
            <div class="option-container" id="optionContainer"></div>

            <div class="game-control">
                <button class="game-control-btn" id="startBtn">开始游戏</button>
                <button class="game-control-btn" onclick="window.location.href='game.html'" id="backToGameCenter">返回游戏中心</button>
            </div>
        </div>
    </main>

    <div class="game-over" id="gameOverModal">
        <button class="close-btn" onclick="document.getElementById('gameOverModal').style.display='none'">×</button>
        <h3 id="gameOverTitle">游戏结束！</h3>
        <p><span id="finalScoreText">最终分数:</span> <span id="finalScore">0</span></p>
        <p id="questionCountText">总题目数: 0 / 10</p>
        <button class="game-control-btn" onclick="startGame()">重新开始</button>
        <button class="game-control-btn" onclick="window.location.href='index.html'" id="backToHomeBtn">返回首页</button>
    </div>

    <script>
        const langTexts = {
            'zh-CN': {
                logoText: '圆几何交互式学习平台',
                navHome: '首页',
                navGame: '游戏',
                navQuiz: '测试',
                breadHome: '首页',
                breadGame: '游戏中心',
                breadCurrent: '圆周角定理匹配赛',
                gameTitle: '圆周角定理匹配赛',
                gameTip: '圆周角是圆心角的一半！选择正确的圆周角度数。',
                scoreLabel: '分数:',
                timeLabel: '时间:',
                timeUnit: '秒',
                centralAngleText: '圆心角',
                chooseText: '选择正确的圆周角度数（°）',
                startBtn: '开始游戏',
                backToGameCenter: '返回游戏中心',
                gameOverTitle: '游戏结束！',
                finalScoreText: '最终分数:',
                backToHomeBtn: '返回首页',
                langDisplay: '简体中文'
            },
            'en': {
                logoText: 'Interactive Learning Platform for Circle Geometry',
                navHome: 'Home',
                navGame: 'Game',
                navQuiz: 'Quiz',
                breadHome: 'Home',
                breadGame: 'Game Center',
                breadCurrent: 'Inscribed Angle Match',
                gameTitle: 'Inscribed Angle Theorem Match',
                gameTip: 'The inscribed angle is half of the central angle! Choose the correct inscribed angle.',
                scoreLabel: 'Score:',
                timeLabel: 'Time:',
                timeUnit: 's',
                centralAngleText: 'Central Angle',
                chooseText: 'Choose the correct Inscribed Angle (°)',
                startBtn: 'Start Game',
                backToGameCenter: 'Back to Game Center',
                gameOverTitle: 'Game Over!',
                finalScoreText: 'Final Score:',
                backToHomeBtn: 'Back to Home',
                langDisplay: 'English'
            }
        };

        let score = 0;
        let timeLeft = 10;
        let timer = null;
        let isGameRunning = false;
        let currentQuestion = 0;
        const totalQuestions = 10;

        const scoreElement = document.getElementById('score');
        const timeElement = document.getElementById('time');
        const centralAngleElement = document.getElementById('centralAngle');
        const optionContainer = document.getElementById('optionContainer');
        const gameOverModal = document.getElementById('gameOverModal');
        const finalScoreElement = document.getElementById('finalScore');
        const questionCountText = document.getElementById('questionCountText');

        function applyState() {
            const lang = localStorage.getItem('appLang') || 'zh-CN';
            const theme = localStorage.getItem('appTheme') || 'default';
            const fontSize = localStorage.getItem('appFontSize') || '16';
            
            const texts = langTexts[lang];
            document.getElementById('logoText').textContent = texts.logoText;
            document.getElementById('navHome').textContent = texts.navHome;
            document.getElementById('navGame').textContent = texts.navGame;
            document.getElementById('navQuiz').textContent = texts.navQuiz;
            document.getElementById('breadHome').textContent = texts.breadHome;
            document.getElementById('breadGame').textContent = texts.breadGame;
            document.getElementById('breadCurrent').textContent = texts.breadCurrent;
            document.getElementById('gameTitle').textContent = texts.gameTitle;
            document.getElementById('gameTip').textContent = texts.gameTip;
            document.getElementById('scoreLabel').textContent = texts.scoreLabel;
            document.getElementById('timeLabel').textContent = texts.timeLabel;
            document.getElementById('timeUnit').textContent = texts.timeUnit;
            document.getElementById('centralAngleText').textContent = texts.centralAngleText;
            document.getElementById('chooseText').textContent = texts.chooseText;
            document.getElementById('startBtn').textContent = texts.startBtn;
            document.getElementById('backToGameCenter').textContent = texts.backToGameCenter;
            document.getElementById('gameOverTitle').textContent = texts.gameOverTitle;
            document.getElementById('finalScoreText').textContent = texts.finalScoreText;
            document.getElementById('backToHomeBtn').textContent = texts.backToHomeBtn;
            document.getElementById('currentLangDisplay').textContent = texts.langDisplay;
            document.documentElement.lang = lang;

            document.body.classList.remove('eye-mode', 'night-mode');
            if (theme === 'eye') document.body.classList.add('eye-mode');
            if (theme === 'night') document.body.classList.add('night-mode');
            document.documentElement.style.setProperty('--font-size', fontSize + 'px');
        }

        function startGame() {
            if (isGameRunning) return;
            score = 0;
            timeLeft = 10;
            currentQuestion = 0;
            isGameRunning = true;
            scoreElement.textContent = score;
            timeElement.textContent = timeLeft;
            gameOverModal.style.display = 'none';
            generateQuestion();
            startTimer();
        }

        function startTimer() {
            if (timer) clearInterval(timer);
            timer = setInterval(() => {
                timeLeft--;
                timeElement.textContent = timeLeft;
                if (timeLeft <= 0) endGame();
            }, 1000);
        }

        function generateQuestion() {
            if (currentQuestion >= totalQuestions) {
                endGame();
                return;
            }
            const centralAngle = Math.floor(Math.random() * 9) * 20 + 20;
            const correctAnswer = centralAngle / 2;
            centralAngleElement.textContent = centralAngle;

            const options = new Set([correctAnswer]);
            while (options.size < 4) {
                const fake = correctAnswer + (Math.floor(Math.random() * 60) - 30);
                if (fake > 0 && fake < 180) options.add(fake);
            }
            const optionsArr = Array.from(options).sort(() => Math.random() - 0.5);

            optionContainer.innerHTML = '';
            optionsArr.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt;
                btn.onclick = () => {
                    if (!isGameRunning) return;
                    if (parseInt(opt) === correctAnswer) {
                        btn.classList.add('correct');
                        score += 10;
                    } else {
                        btn.classList.add('wrong');
                        score = Math.max(0, score - 5);
                    }
                    scoreElement.textContent = score;
                    optionContainer.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
                    currentQuestion++;
                    setTimeout(() => {
                        generateQuestion();
                        timeLeft = 10;
                        timeElement.textContent = timeLeft;
                    }, 1000);
                };
                optionContainer.appendChild(btn);
            });
        }

        function endGame() {
            isGameRunning = false;
            clearInterval(timer);
            finalScoreElement.textContent = score;
            const lang = localStorage.getItem('appLang') || 'zh-CN';
            questionCountText.textContent = lang === 'zh-CN' 
                ? `总题目数: ${currentQuestion} / ${totalQuestions}` 
                : `Total Questions: ${currentQuestion} / ${totalQuestions}`;
            gameOverModal.style.display = 'block';
        }

        document.getElementById('startBtn').onclick = startGame;
        window.onload = applyState;
        window.addEventListener('storage', (e) => {
            if (['appLang', 'appTheme', 'appFontSize'].includes(e.key)) applyState();
        });
    </script>
</body>
</html>
