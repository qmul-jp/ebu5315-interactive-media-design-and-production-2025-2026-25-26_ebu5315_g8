<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>圆几何交互式学习平台 - 线圆关系匹配赛</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Trebuchet MS", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
        }

        :root {
            --primary: #2563eb;
            --primary-strong: #1d4ed8;
            --text: #1f2937;
            --muted: #64748b;
            --bg-color: #f8fafc;
            --surface: rgba(255, 255, 255, 0.85);
            --surface-strong: #ffffff;
            --border-color: #e2e8f0;
            --shadow-lg: 0 24px 60px rgba(31, 41, 55, 0.12);
            --shadow-md: 0 16px 32px rgba(31, 41, 55, 0.08);
            --radius-xl: 28px;
            --radius-lg: 22px;
            --radius-md: 16px;
            --font-size: 16px;
        }

        body {
            color: var(--text);
            font-size: var(--font-size);
            background: 
                radial-gradient(circle at 12% 10%, rgba(37, 99, 235, 0.1), transparent 22%),
                radial-gradient(circle at 86% 14%, rgba(37, 99, 235, 0.1), transparent 20%),
                linear-gradient(rgba(180, 154, 109, 0.12) 1px, transparent 1px),
                linear-gradient(90deg, rgba(180, 154, 109, 0.12) 1px, transparent 1px),
                linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
            background-size: auto, auto, 46px 46px, 46px 46px, auto;
            background-attachment: fixed;
            min-height: 100vh;
            overflow-x: hidden;
            transition: all 0.3s ease-in-out;
            line-height: 1.6;
        }

        /* 模式切换：护眼/夜晚，修改CSS变量 */
        body.eye-mode {
            --bg-color: #f0f9eb;
            --surface: rgba(247, 251, 242, 0.88);
            --text: #166534;
            --border-color: #c7e3b4;
            --primary: #438a4c;
            --primary-strong: #3f6234;
        }
        body.night-mode {
            --text: #f1f5f9;
            --muted: #94a3b8;
            --primary: #60a5fa;
            --primary-strong: #3b82f6;
            --surface: rgba(30, 41, 59, 0.88);
            --surface-strong: #1e293b;
            --border-color: #475569;
        }

        /* 头部样式 */
        .header-container {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
            width: 100%;
            height: 80px;
            padding: 0 4vw;
            background: var(--surface);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-md);
        }
        .logo {
            font-size: clamp(1.2rem, 2.5vw, 1.6rem);
            font-weight: 800;
            color: var(--primary);
        }
        .nav-main {
            display: flex;
            background: rgba(15, 23, 42, 0.04);
            padding: 6px;
            border-radius: 100px;
        }
        .nav-link {
            font-size: 0.95rem;
            color: var(--muted);
            font-weight: 600;
            padding: 8px 24px;
            border-radius: 100px;
        }
        .nav-link:hover {
            color: var(--primary);
            background: rgba(255, 255, 255, 0.8);
        }
        .nav-link.active {
            color: white;
            background: var(--primary);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        /* 主体容器 */
        .main-container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 120px 4vw 60px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            min-height: 100vh;
        }

        .breadcrumb {
            width: 100%;
            font-size: 0.9rem;
            color: var(--muted);
        }
        .breadcrumb a { color: var(--primary); font-weight: 600; }

        .game-container {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 40px;
            text-align: center;
            box-shadow: var(--shadow-lg);
        }

        .game-info {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: var(--bg-color);
            border-radius: var(--radius-md);
            border-bottom: 1px solid var(--border-color);
        }
        .game-info-item {
            font-size: 1.1rem;
            font-weight: 600;
        }
        .game-info-item span {
            color: var(--primary);
            font-size: 1.5rem;
            font-weight: 800;
        }

        .canvas-display {
            width: 280px;
            height: 280px;
            margin: 0 auto 30px;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-lg);
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--surface-strong);
            box-shadow: var(--shadow-md);
        }
        #gameCanvas {
            width: 250px;
            height: 250px;
        }

        .option-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 30px 0;
        }
        .option-btn {
            padding: 15px;
            background: var(--surface-strong);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }
        .option-btn:hover {
            border-color: var(--primary);
            background-color: var(--bg-color);
            transform: scale(1.02);
        }
        .option-btn.correct {
            background: #dcfce7 !important;
            border-color: #22c55e !important;
            color: #166534 !important;
        }
        .option-btn.wrong {
            background: #fee2e2 !important;
            border-color: #ef4444 !important;
            color: #991b1b !important;
        }

        .game-control {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        .game-control-btn {
            padding: 12px 30px;
            background-color: var(--primary);
            color: #fff;
            border-radius: 100px;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 700;
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }
        .game-control-btn:hover {
            background-color: var(--primary-strong);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.3);
        }

        .game-over {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--surface-strong);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 50px;
            box-shadow: var(--shadow-lg);
            z-index: 10000;
            display: none;
            text-align: center;
            min-width: 350px;
        }
        .game-over h3 {
            margin-bottom: 20px;
            color: var(--primary);
            font-size: 2rem;
            font-weight: 800;
        }
        .game-over p {
            margin-bottom: 15px;
            font-size: 1.2rem;
        }
        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            color: var(--muted);
            transition: color 0.3s;
        }
        .close-btn:hover { color: var(--primary); }

        @media (max-width: 768px) {
            .header-container { padding: 0 20px; height: 70px; }
            .main-container { padding-top: 100px; }
            .option-container { grid-template-columns: 1fr; }
            .canvas-display { width: 220px; height: 220px; }
        }
    </style>
</head>
<body>
    <header class="header-container">
        <div class="logo" id="logoText">圆几何交互式学习平台</div>
        <nav class="nav-main">
            <a href="game.html" class="nav-link active" id="navGameCenter">返回游戏中心</a>
        </nav>
        <div class="header-right">
            <div class="lang-switch">
                <span id="currentLangDisplay">简体中文</span>
            </div>
        </div>
    </header>

    <main class="main-container">
        <div class="breadcrumb" id="breadcrumb">
            <a href="index.html" id="breadHome">首页</a> › <a href="game.html" id="breadGame">游戏中心</a> › <span id="breadCurrent">切线判定闯关</span>
        </div>
        <div class="game-container">
            <h2 id="gameTitle" style="margin-bottom: 10px;">切线判定闯关</h2>
            <p id="gameTip" style="color: #64748b; margin-bottom: 20px;">判断直线与圆的位置关系！（相切/相交/相离）</p>
            
            <div class="game-info">
                <div class="game-info-item">
                    <span id="scoreLabel">分数:</span> <span id="score">0</span>
                </div>
                <div class="game-info-item">
                    <span id="timeLabel">时间:</span> <span id="time">10</span> <span id="timeUnit">秒</span>
                </div>
            </div>

            <div class="canvas-display">
                <canvas id="gameCanvas"></canvas>
            </div>

            <h3 id="chooseText" style="margin-bottom: 20px;">选择直线与圆的位置关系</h3>
            <div class="option-container" id="optionContainer"></div>

            <div class="game-control">
                <button class="game-control-btn" id="startBtn">开始游戏</button>
                <button class="game-control-btn" onclick="window.location.href='game.html'" id="backToGameCenter">返回游戏中心</button>
            </div>
        </div>
    </main>

    <div class="game-over" id="gameOverModal">
        <button class="close-btn" onclick="document.getElementById('gameOverModal').style.display='none'">×</button>
        <h3 id="gameOverTitle">游戏结束！</h3>
        <p><span id="finalScoreText">最终分数:</span> <span id="finalScore">0</span></p>
        <p id="questionCountText">总题目数: 0 / 10</p>
        <button class="game-control-btn" onclick="startGame()">重新开始</button>
        <button class="game-control-btn" onclick="window.location.href='index.html'" id="backToHomeBtn">返回首页</button>
    </div>

    <script>
        const langTexts = {
            'zh-CN': {
                logoText: '圆几何交互式学习平台',
                navHome: '首页',
                navGame: '游戏',
                navQuiz: '测试',
                breadHome: '首页',
                breadGame: '游戏中心',
                breadCurrent: '切线判定闯关',
                gameTitle: '切线判定闯关',
                gameTip: '判断直线与圆的位置关系！（相切/相交/相离）',
                scoreLabel: '分数:',
                timeLabel: '时间:',
                timeUnit: '秒',
                chooseText: '选择直线与圆的位置关系',
                startBtn: '开始游戏',
                backToGameCenter: '返回游戏中心',
                gameOverTitle: '游戏结束！',
                finalScoreText: '最终分数:',
                backToHomeBtn: '返回首页',
                langDisplay: '简体中文',
                navGameCenter: '返回游戏中心',
                tangent: '相切',
                intersecting: '相交',
                separate: '相离'
            },
            'en': {
                logoText: 'Interactive Learning Platform for Circle Geometry',
                navHome: 'Home',
                navGame: 'Game',
                navQuiz: 'Quiz',
                breadHome: 'Home',
                breadGame: 'Game Center',
                breadCurrent: 'Tangent Judgment Challenge',
                gameTitle: 'Tangent Judgment Challenge',
                gameTip: 'Judge the relationship between the line and the circle! (Tangent/Intersecting/Separate)',
                scoreLabel: 'Score:',
                timeLabel: 'Time:',
                timeUnit: 's',
                chooseText: 'Choose the relationship between line and circle',
                startBtn: 'Start Game',
                backToGameCenter: 'Back to Game Center',
                gameOverTitle: 'Game Over!',
                finalScoreText: 'Final Score:',
                backToHomeBtn: 'Back to Home',
                langDisplay: 'English',
                navGameCenter: 'Back to Game Center',
                tangent: 'Tangent',
                intersecting: 'Intersecting',
                separate: 'Separate'
            }
        };

        let score = 0;
        let timeLeft = 10;
        let timer = null;
        let isGameRunning = false;
        let currentQuestion = 0;
        const totalQuestions = 10;
        let currentRelationship = '';
        let currentLineCircleParams = null;

        const scoreElement = document.getElementById('score');
        const timeElement = document.getElementById('time');
        const optionContainer = document.getElementById('optionContainer');
        const gameOverModal = document.getElementById('gameOverModal');
        const finalScoreElement = document.getElementById('finalScore');
        const questionCountText = document.getElementById('questionCountText');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function applyState() {
            const lang = localStorage.getItem('appLang') || 'zh-CN';
            const theme = localStorage.getItem('appTheme') || 'default';
            const fontSize = localStorage.getItem('appFontSize') || '16';
            
            const texts = langTexts[lang];
            document.getElementById('logoText').textContent = texts.logoText;
            document.getElementById('navGameCenter').textContent = texts.navGameCenter;
            document.getElementById('breadHome').textContent = texts.breadHome;
            document.getElementById('breadGame').textContent = texts.breadGame;
            document.getElementById('breadCurrent').textContent = texts.breadCurrent;
            document.getElementById('gameTitle').textContent = texts.gameTitle;
            document.getElementById('gameTip').textContent = texts.gameTip;
            document.getElementById('scoreLabel').textContent = texts.scoreLabel;
            document.getElementById('timeLabel').textContent = texts.timeLabel;
            document.getElementById('timeUnit').textContent = texts.timeUnit;
            document.getElementById('chooseText').textContent = texts.chooseText;
            document.getElementById('startBtn').textContent = texts.startBtn;
            document.getElementById('backToGameCenter').textContent = texts.backToGameCenter;
            document.getElementById('gameOverTitle').textContent = texts.gameOverTitle;
            document.getElementById('finalScoreText').textContent = texts.finalScoreText;
            document.getElementById('backToHomeBtn').textContent = texts.backToHomeBtn;
            document.getElementById('currentLangDisplay').textContent = texts.langDisplay;
            document.documentElement.lang = lang;

            document.body.classList.remove('eye-mode', 'night-mode');
            if (theme === 'eye') document.body.classList.add('eye-mode');
            if (theme === 'night') document.body.classList.add('night-mode');
            document.documentElement.style.setProperty('--font-size', fontSize + 'px');

            if (isGameRunning) refreshOptions();
        }

        function calculateDistanceToLine(px, py, x1, y1, x2, y2) {
            const A = y2 - y1;
            const B = x1 - x2;
            const C = x2 * y1 - x1 * y2;
            return Math.abs(A * px + B * py + C) / Math.sqrt(A * A + B * B);
        }

        function drawLineCircleRelationship(relationship) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = 60;
            const mainColor = getComputedStyle(document.documentElement).getPropertyValue('--main-color').trim();

            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.strokeStyle = mainColor;
            ctx.lineWidth = 2;
            ctx.stroke();

            let d;
            if (relationship === 'tangent') d = radius;
            else if (relationship === 'intersecting') d = Math.max(5, radius - Math.random() * 30);
            else d = Math.min(canvas.width/2 - 10, radius + Math.random() * 30);

            const footAngle = Math.random() * Math.PI * 2;
            const footX = centerX + d * Math.cos(footAngle);
            const footY = centerY + d * Math.sin(footAngle);
            const offsetAngle = (Math.random() - 0.5) * Math.PI / 3;
            const lineAngle = footAngle + Math.PI/2 + offsetAngle;
            const lineLen = 80;
            const x1 = footX - lineLen * Math.cos(lineAngle);
            const y1 = footY - lineLen * Math.sin(lineAngle);
            const x2 = footX + lineLen * Math.cos(lineAngle);
            const y2 = footY + lineLen * Math.sin(lineAngle);

            const actualDistance = calculateDistanceToLine(centerX, centerY, x1, y1, x2, y2);
            const isTangent = Math.abs(actualDistance - radius) < 0.1;
            const isIntersecting = actualDistance < radius - 0.1;
            const isSeparate = actualDistance > radius + 0.1;

            if ((relationship === 'tangent' && !isTangent) || (relationship === 'intersecting' && !isIntersecting) || (relationship === 'separate' && !isSeparate)) {
                drawLineCircleRelationship(relationship);
                return;
            }

            ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 2; ctx.stroke();
            ctx.beginPath(); ctx.moveTo(centerX, centerY); ctx.lineTo(footX, footY); ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 1; ctx.setLineDash([5, 3]); ctx.stroke(); ctx.setLineDash([]);
            currentLineCircleParams = { distance: actualDistance, radius: radius, expectedRelationship: relationship };
        }

        function generateQuestion() {
            if (currentQuestion >= totalQuestions) { endGame(); return; }
            const relationships = ['tangent', 'intersecting', 'separate'];
            currentRelationship = relationships[Math.floor(Math.random() * 3)];
            drawLineCircleRelationship(currentRelationship);
            refreshOptions();
        }

        function refreshOptions() {
            const lang = localStorage.getItem('appLang') || 'zh-CN';
            const texts = langTexts[lang];
            const options = [
                { text: texts.tangent, value: 'tangent' },
                { text: texts.intersecting, value: 'intersecting' },
                { text: texts.separate, value: 'separate' }
            ];
            optionContainer.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt.text;
                btn.onclick = () => {
                    if (!isGameRunning) return;
                    if (opt.value === currentRelationship) { btn.classList.add('correct'); score += 10; }
                    else { btn.classList.add('wrong'); score = Math.max(0, score - 5); }
                    scoreElement.textContent = score;
                    optionContainer.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
                    currentQuestion++;
                    setTimeout(() => { generateQuestion(); timeLeft = 10; timeElement.textContent = timeLeft; }, 1000);
                };
                optionContainer.appendChild(btn);
            });
        }

        function startGame() {
            if (isGameRunning) return;
            score = 0; timeLeft = 10; currentQuestion = 0; isGameRunning = true;
            scoreElement.textContent = score; timeElement.textContent = timeLeft;
            gameOverModal.style.display = 'none';
            generateQuestion();
            if (timer) clearInterval(timer);
            timer = setInterval(() => {
                timeLeft--;
                timeElement.textContent = timeLeft;
                if (timeLeft <= 0) endGame();
            }, 1000);
        }

        function endGame() {
            isGameRunning = false; clearInterval(timer);
            finalScoreElement.textContent = score;
            const lang = localStorage.getItem('appLang') || 'zh-CN';
            questionCountText.textContent = lang === 'zh-CN' ? `总题目数: ${currentQuestion} / ${totalQuestions}` : `Total Questions: ${currentQuestion} / ${totalQuestions}`;
            gameOverModal.style.display = 'block';
        }

        document.getElementById('startBtn').onclick = startGame;
        window.onload = () => {
            canvas.width = 230; canvas.height = 230;
            applyState();
        };
        window.addEventListener('storage', (e) => {
            if (['appLang', 'appTheme', 'appFontSize'].includes(e.key)) applyState();
        });
    </script>
</body>
</html>
