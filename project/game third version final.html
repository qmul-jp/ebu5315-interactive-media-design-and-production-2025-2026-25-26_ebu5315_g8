<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>圆几何交互式学习平台 - 圆心角与弧长匹配</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Trebuchet MS", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
        }

        :root {
            --primary: #2563eb;
            --primary-strong: #1d4ed8;
            --text: #1f2937;
            --muted: #64748b;
            --bg-color: #f8fafc;
            --surface: rgba(255, 255, 255, 0.85);
            --surface-strong: #ffffff;
            --border-color: #e2e8f0;
            --shadow-lg: 0 24px 60px rgba(31, 41, 55, 0.12);
            --shadow-md: 0 16px 32px rgba(31, 41, 55, 0.08);
            --radius-xl: 28px;
            --radius-lg: 22px;
            --radius-md: 16px;
            --font-size: 16px;
        }

        body {
            color: var(--text);
            font-size: var(--font-size);
            background:
                radial-gradient(circle at 12% 10%, rgba(37, 99, 235, 0.1), transparent 22%),
                radial-gradient(circle at 86% 14%, rgba(37, 99, 235, 0.1), transparent 20%),
                linear-gradient(rgba(180, 154, 109, 0.12) 1px, transparent 1px),
                linear-gradient(90deg, rgba(180, 154, 109, 0.12) 1px, transparent 1px),
                linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
            background-size: auto, auto, 46px 46px, 46px 46px, auto;
            background-attachment: fixed;
            min-height: 100vh;
            overflow-x: hidden;
            transition: all 0.3s ease-in-out;
            line-height: 1.6;
        }

        /* 模式切换：护眼/夜晚，修改CSS变量 */
        body.eye-mode {
            --bg-color: #f0f9eb;
            --surface: rgba(247, 251, 242, 0.88);
            --text: #166534;
            --border-color: #c7e3b4;
            --primary: #438a4c;
            --primary-strong: #3f6234;
        }
        body.night-mode {
            --text: #f1f5f9;
            --muted: #94a3b8;
            --primary: #60a5fa;
            --primary-strong: #3b82f6;
            --surface: rgba(30, 41, 59, 0.88);
            --surface-strong: #1e293b;
            --border-color: #475569;
        }

        /* 头部样式 */
        .header-container {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
            width: 100%;
            height: 80px;
            padding: 0 4vw;
            background: var(--surface);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-md);
        }
        .logo {
            font-size: clamp(1.2rem, 2.5vw, 1.6rem);
            font-weight: 800;
            color: var(--primary);
        }
        .nav-main {
            display: flex;
            background: rgba(15, 23, 42, 0.04);
            padding: 6px;
            border-radius: 100px;
        }
        .nav-link {
            font-size: 0.95rem;
            color: var(--muted);
            font-weight: 600;
            padding: 8px 24px;
            border-radius: 100px;
        }
        .nav-link:hover {
            color: var(--primary);
            background: rgba(255, 255, 255, 0.8);
        }
        .nav-link.active {
            color: white;
            background: var(--primary);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        /* 主体容器 */
        .main-container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 120px 4vw 60px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            min-height: 100vh;
        }

        .breadcrumb {
            width: 100%;
            font-size: 0.9rem;
            color: var(--muted);
        }
        .breadcrumb a { color: var(--primary); font-weight: 600; }

        .game-container {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 40px;
            text-align: center;
            box-shadow: var(--shadow-lg);
        }

        .game-info {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: var(--bg-color);
            border-radius: var(--radius-md);
            border-bottom: 1px solid var(--border-color);
        }
        .game-info-item {
            font-size: 1rem;
            font-weight: 600;
        }
        .game-info-item span {
            color: var(--primary);
            font-weight: 800;
        }

        .circle-arc-container {
            width: 300px;
            height: 300px;
            margin: 0 auto 20px;
            background: var(--surface-strong);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-lg);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: var(--shadow-md);
        }
        #arcCanvas {
            width: 280px;
            height: 280px;
        }

        .arc-slider-container {
            width: 100%;
            max-width: 500px;
            margin: 20px auto;
        }
        .slider-label {
            display: flex;
            justify-content: space-between;
            color: var(--muted);
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .arc-slider {
            width: 100%;
            height: 8px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .game-feedback {
            margin: 15px 0;
            font-size: 1.2rem;
            height: 28px;
            font-weight: 800;
        }
        .feedback-correct { color: #22c55e; }
        .feedback-wrong { color: #ef4444; }

        .game-control {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        .game-control-btn {
            padding: 10px 25px;
            background-color: var(--primary);
            color: #fff;
            border-radius: 100px;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 700;
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }
        .game-control-btn:hover:not(:disabled) {
            background-color: var(--primary-strong);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.3);
        }
        .game-control-btn:disabled {
            background-color: var(--muted);
            cursor: not-allowed;
            opacity: 0.6;
        }

        .game-over {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--surface-strong);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 50px;
            box-shadow: var(--shadow-lg);
            z-index: 10000;
            display: none;
            text-align: center;
            min-width: 350px;
        }
        .game-over h3 {
            margin-bottom: 20px;
            color: var(--primary);
            font-size: 2rem;
            font-weight: 800;
        }
        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            color: var(--muted);
            transition: color 0.3s;
        }
        .close-btn:hover { color: var(--primary); }

        @media (max-width: 768px) {
            .header-container { padding: 0 20px; height: 70px; }
            .main-container { padding-top: 100px; }
            .circle-arc-container { width: 250px; height: 250px; }
            #arcCanvas { width: 230px; height: 230px; }
        }
    </style>
</head>
<body>
    <header class="header-container">
        <div class="logo" id="logoText">圆几何交互式学习平台</div>
        <nav class="nav-main">
            <a href="game.html" class="nav-link active" id="navGameCenter">返回游戏中心</a>
        </nav>
        <div class="header-right">
            <div class="lang-switch">
                <span id="currentLangDisplay">简体中文</span>
            </div>
        </div>
    </header>

    <main class="main-container">
        <div class="breadcrumb" id="breadcrumb">
            <a href="index.html" id="breadHome">首页</a> › <a href="game.html" id="breadGame">游戏中心</a> › <span id="breadCurrent">圆心角与弧长匹配</span>
        </div>
        <div class="game-container">
            <h2 id="gameTitle" style="margin-bottom: 5px;">圆心角与弧长匹配</h2>
            <p id="gameTip" style="color: #64748b; margin-bottom: 15px;">根据目标角度调整弧长，拖动滑块！</p>
            
            <div class="game-info">
                <div class="game-info-item"><span id="scoreTxt">分数</span>: <span id="score">0</span></div>
                <div class="game-info-item"><span id="timeTxt">时间</span>: <span id="time">10</span><span id="unit">秒</span></div>
                <div class="game-info-item"><span id="levelTxt">关卡</span>: <span id="puzzleNum">1</span>/8</div>
            </div>

            <div class="circle-arc-container">
                <canvas id="arcCanvas"></canvas>
            </div>

            <div class="arc-slider-container">
                <div class="slider-label"><span id="sShort">短</span><span id="sLong">长</span></div>
                <input type="range" min="1" max="100" value="10" class="arc-slider" id="arcSlider">
            </div>

            <div style="margin-bottom:15px; font-size:18px;">
                <span id="targetTxt">目标角度</span>: 
                <span id="targetAngle" style="color:var(--main-color); font-weight:700;">?</span>°
            </div>

            <div class="game-feedback" id="feedback"></div>

            <div class="game-control">
                <button class="game-control-btn" id="startBtn">开始</button>
                <button class="game-control-btn" id="checkBtn" disabled>检查</button>
                <button class="game-control-btn" id="restartBtn" disabled>重置</button>
                <button class="game-control-btn" onclick="window.location.href='game.html'" id="backBtn">返回</button>
            </div>
        </div>
    </main>

    <div class="game-over" id="gameOverModal">
        <button class="close-btn" onclick="document.getElementById('gameOverModal').style.display='none'">×</button>
        <h3 id="overTitle">游戏结束</h3>
        <p><span id="finalTxt">最终分数</span>: <span id="finalScore">0</span></p>
        <p><span id="finLevelTxt">关卡</span>: <span id="finalLevel">0</span>/8</p>
        <button class="game-control-btn" onclick="startGame()">再来一次</button>
        <button class="game-control-btn" onclick="window.location.href='index.html'" id="backToHomeBtn">返回首页</button>
    </div>

    <script>
        const langData = {
            'zh-CN': {
                logoText: '圆几何交互式学习平台',
                navHome: '首页',
                navGame: '游戏',
                navQuiz: '测试',
                breadHome: '首页',
                breadGame: '游戏中心',
                breadCurrent: '圆心角与弧长匹配',
                gameTitle: '圆心角与弧长匹配',
                gameTip: '根据目标角度调整弧长，拖动滑块！',
                scoreTxt: '分数',
                timeTxt: '时间',
                levelTxt: '关卡',
                targetTxt: '目标角度',
                sShort: '短',
                sLong: '长',
                startBtn: '开始',
                checkBtn: '检查',
                restartBtn: '重置',
                backBtn: '返回',
                unit: '秒',
                overTitle: '游戏结束',
                youWin: '恭喜通关！',
                finalTxt: '最终分数',
                finLevelTxt: '关卡',
                backToHomeBtn: '返回首页',
                langDisplay: '简体中文',
                navGameCenter: '返回游戏中心',
                perfect: '正确！误差：{error}%',
                tryAgain: '超时/错误！误差：{error}%'
            },
            'en': {
                logoText: 'Interactive Learning Platform for Circle Geometry',
                navHome: 'Home',
                navGame: 'Game',
                navQuiz: 'Quiz',
                breadHome: 'Home',
                breadGame: 'Game Center',
                breadCurrent: 'Arc Puzzle',
                gameTitle: 'Central Angle & Arc Length Puzzle',
                gameTip: 'Estimate the arc by target angle, drag to match!',
                scoreTxt: 'Score',
                timeTxt: 'Time',
                levelTxt: 'Level',
                targetTxt: 'Target Angle',
                sShort: 'Short',
                sLong: 'Long',
                startBtn: 'Start',
                checkBtn: 'Check',
                restartBtn: 'Restart',
                backBtn: 'Back',
                unit: 's',
                overTitle: 'Game Over',
                youWin: 'You Win!',
                finalTxt: 'Final Score',
                finLevelTxt: 'Level',
                backToHomeBtn: 'Back to Home',
                langDisplay: 'English',
                navGameCenter: 'Back to Game Center',
                perfect: 'Perfect! Error: {error}%',
                tryAgain: 'Time out / Wrong! Error: {error}%'
            }
        };

        const canvas = document.getElementById('arcCanvas');
        const ctx = canvas.getContext('2d');
        let score = 0, timeLeft = 10, timer, currentPuzzle = 1, isPlaying = false, targetAngle, userArcPercent = 10;

        const scoreEl = document.getElementById('score'), timeEl = document.getElementById('time'), puzzleEl = document.getElementById('puzzleNum');
        const targetEl = document.getElementById('targetAngle'), feedbackEl = document.getElementById('feedback'), slider = document.getElementById('arcSlider');
        const startBtn = document.getElementById('startBtn'), checkBtn = document.getElementById('checkBtn'), restartBtn = document.getElementById('restartBtn');

        function applyState() {
            const lang = localStorage.getItem('appLang') || 'zh-CN';
            const theme = localStorage.getItem('appTheme') || 'default';
            const fontSize = localStorage.getItem('appFontSize') || '16';
            const texts = langData[lang];

            document.getElementById('logoText').textContent = texts.logoText;
            document.getElementById('navGameCenter').textContent = texts.navGameCenter;
            document.getElementById('breadHome').textContent = texts.breadHome;
            document.getElementById('breadGame').textContent = texts.breadGame;
            document.getElementById('breadCurrent').textContent = texts.breadCurrent;
            document.getElementById('gameTitle').textContent = texts.gameTitle;
            document.getElementById('gameTip').textContent = texts.gameTip;
            document.getElementById('scoreTxt').textContent = texts.scoreTxt;
            document.getElementById('timeTxt').textContent = texts.timeTxt;
            document.getElementById('levelTxt').textContent = texts.levelTxt;
            document.getElementById('targetTxt').textContent = texts.targetTxt;
            document.getElementById('sShort').textContent = texts.sShort;
            document.getElementById('sLong').textContent = texts.sLong;
            document.getElementById('startBtn').textContent = texts.startBtn;
            document.getElementById('checkBtn').textContent = texts.checkBtn;
            document.getElementById('restartBtn').textContent = texts.restartBtn;
            document.getElementById('backBtn').textContent = texts.backBtn;
            document.getElementById('unit').textContent = texts.unit;
            document.getElementById('finalTxt').textContent = texts.finalTxt;
            document.getElementById('finLevelTxt').textContent = texts.finLevelTxt;
            document.getElementById('backToHomeBtn').textContent = texts.backToHomeBtn;
            document.getElementById('currentLangDisplay').textContent = texts.langDisplay;
            document.documentElement.lang = lang;

            document.body.classList.remove('eye-mode', 'night-mode');
            if (theme === 'eye') document.body.classList.add('eye-mode');
            if (theme === 'night') document.body.classList.add('night-mode');
            document.documentElement.style.setProperty('--font-size', fontSize + 'px');
            draw();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const cx = canvas.width / 2, cy = canvas.height / 2, r = canvas.width * 0.4;
            const mainColor = getComputedStyle(document.documentElement).getPropertyValue('--main-color').trim();
            
            ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.strokeStyle = '#ccc'; ctx.lineWidth = 2; ctx.stroke();
            ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + r, cy); ctx.strokeStyle = mainColor; ctx.stroke();
            const rad = userArcPercent / 100 * Math.PI * 2;
            ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + r * Math.cos(rad), cy + r * Math.sin(rad)); ctx.stroke();
            ctx.beginPath(); ctx.arc(cx, cy, r, 0, rad); ctx.lineWidth = 4; ctx.stroke();
        }

        function startGame() {
            score = 0; currentPuzzle = 1; isPlaying = true;
            scoreEl.textContent = 0; puzzleEl.textContent = 1;
            startBtn.disabled = true; checkBtn.disabled = false; restartBtn.disabled = false;
            document.getElementById('gameOverModal').style.display = 'none';
            newQuestion(); resetTimer();
        }

        function newQuestion() {
            targetAngle = Math.floor(Math.random() * 341) + 10;
            targetEl.textContent = targetAngle;
            userArcPercent = 10; slider.value = 10;
            feedbackEl.textContent = ''; feedbackEl.className = 'game-feedback';
            draw();
        }

        function resetTimer() {
            clearInterval(timer); timeLeft = 10; timeEl.textContent = 10;
            timer = setInterval(() => {
                timeLeft--; timeEl.textContent = timeLeft;
                if (timeLeft <= 0) { clearInterval(timer); check(false); }
            }, 1000);
        }

        function check(isManual = true) {
            if (!isPlaying) return;
            const lang = localStorage.getItem('appLang') || 'zh-CN';
            const correct = Math.round(targetAngle / 360 * 100);
            const err = Math.abs((userArcPercent - correct) / correct * 100).toFixed(1);
            const ok = parseFloat(err) <= 5;

            if (ok) {
                feedbackEl.textContent = langData[lang].perfect.replace('{error}', err);
                feedbackEl.className = 'game-feedback feedback-correct';
                score += 10; scoreEl.textContent = score;
            } else {
                feedbackEl.textContent = langData[lang].tryAgain.replace('{error}', err);
                feedbackEl.className = 'game-feedback feedback-wrong';
            }

            setTimeout(() => {
                currentPuzzle++;
                if (currentPuzzle > 8) {
                    isPlaying = false; clearInterval(timer);
                    document.getElementById('overTitle').textContent = ok ? langData[lang].youWin : langData[lang].overTitle;
                    document.getElementById('finalScore').textContent = score;
                    document.getElementById('finalLevel').textContent = 8;
                    document.getElementById('gameOverModal').style.display = 'block';
                    startBtn.disabled = false; checkBtn.disabled = true; restartBtn.disabled = true;
                    return;
                }
                puzzleEl.textContent = currentPuzzle; newQuestion(); resetTimer();
            }, 1500);
        }

        slider.oninput = () => { if (isPlaying) { userArcPercent = +slider.value; draw(); } };
        startBtn.onclick = startGame;
        checkBtn.onclick = () => check(true);
        restartBtn.onclick = () => { newQuestion(); resetTimer(); };
        window.onload = () => { canvas.width = 300; canvas.height = 300; applyState(); };
        window.addEventListener('storage', (e) => { if (['appLang', 'appTheme', 'appFontSize'].includes(e.key)) applyState(); });
    </script>
</body>
</html>
