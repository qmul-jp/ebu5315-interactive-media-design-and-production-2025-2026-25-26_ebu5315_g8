<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日一题作答 | 圆几何测试学习中心</title>
    <style>
:root {
    --text: #1f2937;
    --muted: #64748b;
    --primary: #2563eb;
    --primary-strong: #1d4ed8;
    --accent: #f4b860;
    --accent-soft: #fff3dc;
    --cyan-soft: #dbeafe;
    --surface: rgba(255, 255, 255, 0.85);
    --surface-strong: #ffffff;
    --line: rgba(15, 23, 42, 0.08);
    --shadow-lg: 0 24px 60px rgba(31, 41, 55, 0.12);
    --shadow-md: 0 16px 32px rgba(31, 41, 55, 0.08);
    --radius-xl: 28px;
    --radius-lg: 22px;
    --radius-md: 16px;
    --font-size: 16px;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: "Trebuchet MS", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
    color: var(--text);
    font-size: var(--font-size);
    background:
        radial-gradient(circle at 12% 10%, rgba(37, 99, 235, 0.1), transparent 22%),
        radial-gradient(circle at 86% 14%, rgba(37, 99, 235, 0.1), transparent 20%),
        linear-gradient(rgba(180, 154, 109, 0.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(180, 154, 109, 0.12) 1px, transparent 1px),
        linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
    background-size: auto, auto, 46px 46px, 46px 46px, auto;
    min-height: 100vh;
    overflow-x: hidden;
    transition: all 0.3s ease-in-out;
}

/* 模式切换：护眼/夜晚，修改CSS变量 */
body.eye-mode {
    --bg-color: #f0f9eb;
    --surface: rgba(247, 251, 242, 0.88);
    --text: #166534;
    --line: #c7e3b4;
    --primary: #438a4c;
    --primary-strong: #3f6234;
}
body.night-mode {
    --text: #f1f5f9;
    --muted: #94a3b8;
    --primary: #60a5fa;
    --primary-strong: #3b82f6;
    --surface: rgba(15, 23, 42, 0.9);
    --surface-strong: #0f172a;
    --border-color: #334155;
    --bg-color: #020617;
    background:
        radial-gradient(circle at 12% 10%, rgba(56, 189, 248, 0.15), transparent 25%),
        radial-gradient(circle at 86% 14%, rgba(56, 189, 248, 0.15), transparent 22%),
        linear-gradient(rgba(56, 189, 248, 0.2) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56, 189, 248, 0.2) 1px, transparent 1px),
        linear-gradient(180deg, #020617 0%, #0f172a 100%);
    background-size: auto, auto, 46px 46px, 46px 46px, auto;
}

.top-nav {
    display: flex;
    justify-content: center;
    gap: 1rem;
    padding: 1.5rem 1rem 0;
}

.top-nav a {
    padding: 0.85rem 1.5rem;
    border-radius: 999px;
    color: var(--muted);
    text-decoration: none;
    font-weight: 700;
    background: rgba(255, 255, 255, 0.76);
    border: 1px solid var(--line);
    transition: all 0.2s;
}

.top-nav a:hover {
    background: white;
    color: var(--primary);
}

.top-nav a.active {
    color: #fff;
    background: var(--primary);
}

.quiz-return {
    position: fixed;
    top: 18px;
    left: 18px;
    z-index: 9999;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.78);
    border: 1px solid var(--line);
    color: var(--text);
    font-weight: 900;
    text-decoration: none;
    box-shadow: var(--shadow-md);
    backdrop-filter: blur(12px);
    transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
}
body.night-mode .quiz-return {
    background: rgba(2, 6, 23, 0.55);
    border-color: rgba(148, 163, 184, 0.18);
    color: #f1f5f9;
}
body.eye-mode .quiz-return {
    background: rgba(247, 251, 242, 0.88);
}
.quiz-return:hover {
    transform: translateY(-2px);
}

.quiz-shell {
    width: min(1120px, calc(100% - 32px));
    margin: 2rem auto 3rem;
}

.quiz-session-card,
.quiz-result-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 36px;
    box-shadow: var(--shadow-md);
    padding: 2rem;
    backdrop-filter: blur(12px);
}

.hidden {
    display: none !important;
}

.eyebrow {
    margin: 0 0 0.6rem;
    color: var(--primary);
    font-size: 0.9rem;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
}

.session-topbar,
.result-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 1.5rem;
}

.session-title-group h1,
.result-header h1 {
    margin: 0;
    font-size: clamp(2rem, 4vw, 3.1rem);
    line-height: 1.1;
    overflow-wrap: anywhere;
}

.session-progress-group {
    min-width: 240px;
    padding: 1rem 1.15rem;
    border-radius: 24px;
    background: var(--surface-strong);
    border: 1px solid var(--line);
}

.progress-meta {
    display: flex;
    justify-content: space-between;
    margin-bottom: 0.7rem;
    font-weight: 700;
}

.progress-track {
    height: 10px;
    border-radius: 999px;
    overflow: hidden;
    background: var(--line);
}

.progress-bar {
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--primary-strong), var(--primary));
}

.progress-bar.full {
    width: 100%;
}

.question-card,
.result-detail {
    margin-top: 1.75rem;
    padding: 1.6rem;
    border-radius: 28px;
    background: var(--surface-strong);
    border: 1px solid var(--line);
}

.question-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1rem;
}

.question-tag,
.question-topic {
    display: inline-flex;
    align-items: center;
    padding: 0.45rem 0.8rem;
    border-radius: 999px;
    font-size: 0.92rem;
    font-weight: 700;
}

.question-tag {
    color: var(--primary);
    background: var(--cyan-soft);
}

.question-topic {
    color: var(--muted);
    background: var(--line);
}

.quiz-question-title {
    margin: 0 0 1.4rem;
    font-size: clamp(1.4rem, 2vw, 1.9rem);
    line-height: 1.5;
    overflow-wrap: anywhere;
}

.quiz-options {
    display: grid;
    gap: 1rem;
}

.option-item {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 1.25rem 1.3rem;
    border-radius: 24px;
    border: 1px solid var(--line);
    background: var(--surface-strong);
    cursor: pointer;
    transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
}

.option-item:hover {
    transform: translateY(-2px);
    border-color: var(--primary);
    box-shadow: var(--shadow-md);
}

.option-item input {
    width: 22px;
    height: 22px;
    margin: 0;
    accent-color: var(--primary);
    flex: none;
}

.option-item span {
    font-size: 1.28rem;
    line-height: 1.55;
}

.option-item.active {
    border-color: var(--primary);
    background: var(--cyan-soft);
}

.option-item.correct-lock {
    border-color: #22c55e;
    background: #f0fdf4;
}

.option-item.wrong-lock {
    border-color: #ef4444;
    background: #fef2f2;
}

.option-item.locked {
    cursor: default;
}

.quiz-meta,
.result-grid,
.result-actions {
    display: grid;
    gap: 1rem;
}

.quiz-meta {
    margin-top: 1.25rem;
    grid-template-columns: repeat(2, minmax(0, 1fr));
}

.meta-item,
.result-item {
    padding: 1rem 1.1rem;
    border-radius: 22px;
    background: var(--surface-strong);
    border: 1px solid var(--line);
}

.meta-label,
.result-label {
    display: block;
    margin-bottom: 0.45rem;
    font-size: 0.9rem;
    color: var(--muted);
}

.meta-item strong,
.result-item strong {
    font-size: 1.1rem;
}

.quiz-actions,
.result-actions {
    margin-top: 1.4rem;
}

.quiz-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
}

.action-btn {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    min-height: 52px;
    padding: 0.9rem 1.4rem;
    border: 1px solid var(--line);
    border-radius: 18px;
    color: var(--primary);
    background: var(--surface-strong);
    font-size: 1rem;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
}

.action-btn:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
}

.action-btn.primary {
    color: #fff;
    background: linear-gradient(135deg, var(--primary-strong), var(--primary));
    border: none;
}

.quiz-feedback {
    margin-top: 1.4rem;
    padding: 1rem 1.15rem;
    border-radius: 22px;
    border: 1px solid transparent;
}

.quiz-feedback.correct {
    color: #166534;
    background: #f0f9eb;
    border-color: #c7e3b4;
}

.quiz-feedback.wrong {
    color: #991b1b;
    background: #fef2f2;
    border-color: #fecaca;
}

.quiz-feedback strong {
    display: block;
    margin-bottom: 0.35rem;
    font-size: 1.1rem;
}

.result-header p {
    max-width: 620px;
    color: var(--muted);
    line-height: 1.7;
}

.result-grid {
    margin-top: 1.6rem;
    grid-template-columns: repeat(4, minmax(0, 1fr));
}

.card-header {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    margin-bottom: 0.8rem;
}

.card-header h2 {
    margin: 0;
    font-size: 1.22rem;
}

.result-detail p {
    margin: 0;
    color: var(--text);
    line-height: 1.8;
    font-size: 1.03rem;
}

.result-success {
    margin-top: 1.4rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 1rem 1.15rem;
    border-radius: 22px;
    color: #166534;
    background: #f0f9eb;
    border: 1px solid #c7e3b4;
    font-weight: 700;
}

.modal-backdrop {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 1.25rem;
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(8px);
    z-index: 20;
}

.modal-card {
    width: min(720px, 100%);
    max-height: min(82vh, 760px);
    overflow: auto;
    padding: 1.35rem;
    border-radius: 28px;
    background: var(--surface-strong);
    box-shadow: var(--shadow-lg);
    border: 1px solid var(--border-color);
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    margin-bottom: 0.8rem;
}

.modal-header h3 {
    margin: 0;
    font-size: 1.25rem;
}

.modal-close {
    width: 40px;
    height: 40px;
    border: none;
    border-radius: 50%;
    background: var(--line);
    color: var(--text);
    font-size: 1.4rem;
    cursor: pointer;
}

.modal-body {
    color: var(--text);
    line-height: 1.8;
}

.wrong-book-item {
    padding: 1rem 0;
    border-bottom: 1px solid var(--line);
}

.wrong-book-item:last-child {
    border-bottom: none;
}

.wrong-book-item h4 {
    margin: 0 0 0.4rem;
    color: var(--text);
}

.wrong-book-item p,
.wrong-empty {
    margin: 0;
}

.page-footer {
    padding: 0 1rem 2rem;
    text-align: center;
    color: var(--muted);
}

@supports not ((backdrop-filter: blur(12px)) or (-webkit-backdrop-filter: blur(12px))) {
    .quiz-session-card,
    .quiz-result-card,
    .top-nav a,
    .modal-card {
        background: rgba(255, 255, 255, 0.97);
    }
}

@media (max-width: 860px) {
    .session-topbar,
    .result-header {
        flex-direction: column;
    }

    .session-progress-group {
        width: 100%;
    }

    .quiz-meta,
    .result-grid,
    .result-actions {
        grid-template-columns: 1fr;
    }
}

@media (max-width: 640px) {
    .top-nav {
        flex-wrap: wrap;
    }

    .quiz-shell {
        width: min(100% - 20px, 1120px);
        margin-top: 1.25rem;
    }

    .quiz-session-card,
    .quiz-result-card {
        padding: 1.2rem;
        border-radius: 26px;
    }

    .session-title-group h1,
    .result-header h1 {
        font-size: clamp(1.8rem, 10vw, 2.6rem);
    }

    .question-head {
        flex-direction: column;
        align-items: flex-start;
    }

    .option-item span {
        font-size: 1.08rem;
    }

    .quiz-actions {
        flex-direction: column;
    }

    .action-btn {
        width: 100%;
    }
}
</style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<body data-page="daily-quiz">
    <a class="quiz-return" href="test.html">返回测试首页</a>
    <nav class="top-nav">
        <a href="../index/index.html" id="navHome">首页</a>
        <a href="../game/game.html" id="navGame">游戏</a>
        <a href="test.html" class="active" id="navQuiz">测试</a>
    </nav>
    <main class="quiz-shell">
        <section class="quiz-session-card" id="quizSessionCard">
            <div class="session-topbar">
                <div class="session-title-group"><p class="eyebrow" id="eyebrow">每日一题</p><h1 id="title">每日一题</h1></div>
                <div class="session-progress-group"><div class="progress-meta"><span>1 / 1</span><strong>100%</strong></div><div class="progress-track"><div class="progress-bar full"></div></div></div>
            </div>
            <div class="question-card">
                <div class="question-head"><span class="question-tag" id="tag">今日题目</span><span class="question-topic" id="quizTopic">--</span></div>
                <h2 class="quiz-question-title" id="quizQuestionTitle"></h2>
                <div class="quiz-options" id="quizOptions"></div>
            </div>
            <div class="quiz-meta">
                <div class="meta-item"><span class="meta-label" id="labelDiff">本题难度</span><strong id="quizDifficulty">--</strong></div>
                <div class="meta-item"><span class="meta-label" id="labelTopic">所属专题</span><strong id="quizMetaTopic">--</strong></div>
            </div>
            <div class="quiz-actions"><button class="action-btn primary" id="submitQuizBtn">提交答案</button><button class="action-btn" id="showQuizAiBtn">AI 解释</button></div>
            <div class="quiz-feedback hidden" id="quizFeedback"><strong id="quizFeedbackState"></strong><p id="quizFeedbackText"></p></div>
        </section>
        <section class="quiz-result-card hidden" id="quizResultCard">
            <div class="result-header"><p class="eyebrow" id="resEyebrow">今日结果</p><h1 id="resTitle">今日结果</h1><p id="resultStatusText">今日打卡成功后，可以查看答案、AI 解释和错题收录情况。</p></div>
            <div class="result-grid">
                <article class="result-item"><span class="result-label" id="resOutcome">作答结果</span><strong id="resultOutcome">--</strong></article>
                <article class="result-item"><span class="result-label" id="resCorrect">正确答案</span><strong id="resultCorrectAnswer">--</strong></article>
                <article class="result-item"><span class="result-label" id="resSaved">错题是否收录</span><strong id="resultWrongSaved">--</strong></article>
                <article class="result-item"><span class="result-label" id="resStreak">连续打卡天数</span><strong id="resultStreakDays">0 天</strong></article>
            </div>
            <section class="result-detail"><div class="card-header"><i class="fas fa-robot"></i><h2 id="aiTitle">AI 详细解释</h2></div><p id="resultAiExplanation"></p></section>
            <section class="result-success"><i class="fas fa-circle-check"></i><span id="resSuccess">今日打卡成功</span></section>
            <div class="result-actions"><a class="action-btn" href="test.html" id="backHome">返回首页</a><button class="action-btn" id="viewWrongBookBtn">查看错题本</button><a class="action-btn primary" href="test-topic.html" id="goTopic">前往专题练习</a></div>
        </section>
    </main>
    <div class="modal-backdrop hidden" id="quizAiModal"><div class="modal-card"><div class="modal-header"><h3 id="aiModalTitle">AI 解释</h3><button class="modal-close" id="closeQuizAiModalBtn" aria-label="关闭">×</button></div><div class="modal-body"><p id="quizAiAnswer"></p><p id="quizAiExplanation"></p></div></div></div>
    <div class="modal-backdrop hidden" id="wrongBookModal"><div class="modal-card"><div class="modal-header"><h3 id="wrongBookTitle">错题本</h3><button class="modal-close" id="closeWrongBookModalBtn" aria-label="关闭">×</button></div><div class="modal-body" id="wrongBookList"></div></div></div>
    <footer class="page-footer"><p id="footerText">圆几何互动学习网站 © 2026 EBU5315 Coursework</p></footer>

    <script src="../question-bank.js"></script>
    <script>
        // 核心逻辑保留并适配
        (function() {
            function normalizeLang(lang) {
                const value = String(lang || '').toLowerCase();
                if (value === 'en' || value === 'en-us' || value === 'en_us' || value === 'en-gb' || value === 'en_gb') return 'en';
                return 'zh-CN';
            }

            const langTexts = {
                'zh-CN': {
                    docTitle: '每日一题作答 | 圆几何测试学习中心',
                    returnHomeEntry: '返回测试首页',
                    closeLabel: '关闭',
                    navHome: '首页', navGame: '游戏', navQuiz: '测试',
                    eyebrow: '每日一题', title: '每日一题', tag: '今日题目',
                    labelDiff: '本题难度', labelTopic: '所属专题',
                    submit: '提交答案', ai: 'AI 解释',
                    resEyebrow: '今日结果', resTitle: '今日结果',
                    resultStatusText: '今日打卡成功后，可以查看答案、AI 解释和错题收录情况。',
                    resOutcome: '作答结果', resCorrect: '正确答案', resSaved: '错题是否收录', resStreak: '连续打卡天数',
                    aiTitle: 'AI 详细解释', resSuccess: '今日打卡成功',
                    backHome: '返回首页', viewWrongBook: '查看错题本', goTopic: '前往专题练习',
                    aiModalTitle: 'AI 解释', wrongBookTitle: '错题本',
                    footerText: '圆几何互动学习网站 © 2026 EBU5315 Coursework'
                },
                'en': {
                    docTitle: 'Daily Quiz | Circle Geometry Learning Center',
                    returnHomeEntry: 'Back to Test Home',
                    closeLabel: 'Close',
                    navHome: 'Home', navGame: 'Game', navQuiz: 'Test',
                    eyebrow: 'DAILY QUIZ', title: 'Daily Quiz', tag: 'Today\'s Question',
                    labelDiff: 'Difficulty', labelTopic: 'Topic',
                    submit: 'Submit Answer', ai: 'AI Explanation',
                    resEyebrow: 'TODAY\'S RESULT', resTitle: 'Today\'s Result',
                    resultStatusText: 'After today\'s check-in is completed, you can review the answer, AI explanation, and wrong-question status.',
                    resOutcome: 'Outcome', resCorrect: 'Correct Answer', resSaved: 'Saved to Wrong Book', resStreak: 'Streak',
                    aiTitle: 'AI Detailed Explanation', resSuccess: 'Today\'s Check-in Complete',
                    backHome: 'Back Home', viewWrongBook: 'View Wrong Book', goTopic: 'Go to Topic Practice',
                    aiModalTitle: 'AI Explanation', wrongBookTitle: 'Wrong Question Book',
                    footerText: 'Circle Geometry Learning © 2026 EBU5315 Coursework'
                }
            };

            function applyState() {
                const lang = normalizeLang(localStorage.getItem('appLang') || 'zh-CN');
                const theme = localStorage.getItem('appTheme') || 'default';
                const fontSize = localStorage.getItem('appFontSize') || '16';
                
                document.body.classList.remove('eye-mode', 'night-mode');
                if (theme === 'eye') document.body.classList.add('eye-mode');
                if (theme === 'night') document.body.classList.add('night-mode');
                document.documentElement.style.setProperty('--font-size', fontSize + 'px');
                document.documentElement.style.fontSize = fontSize + 'px';

                const texts = langTexts[lang] || langTexts['zh-CN'];
                Object.keys(texts).forEach(id => {
                    const el = document.getElementById(id);
                    if (el) {
                        if (el.tagName === 'INPUT') el.placeholder = texts[id];
                        else el.textContent = texts[id];
                    }
                });

                if (texts.docTitle) document.title = texts.docTitle;
                const quizReturn = document.querySelector('.quiz-return');
                if (quizReturn) quizReturn.textContent = texts.returnHomeEntry;
                const closeAi = document.getElementById('closeQuizAiModalBtn');
                const closeWrong = document.getElementById('closeWrongBookModalBtn');
                if (closeAi) closeAi.setAttribute('aria-label', texts.closeLabel);
                if (closeWrong) closeWrong.setAttribute('aria-label', texts.closeLabel);

                const streakEl = document.getElementById('resultStreakDays');
                if (streakEl) {
                    const fallbackNum = parseInt((streakEl.textContent || '0').replace(/[^\d]/g, ''), 10) || 0;
                    const num = parseInt(streakEl.dataset.days || String(fallbackNum), 10) || 0;
                    streakEl.dataset.days = String(num);
                    streakEl.textContent = lang === 'en' ? `${num} Days` : `${num} 天`;
                }
                document.documentElement.lang = lang;
            }

            window.addEventListener('load', applyState);
            window.addEventListener('storage', (e) => {
                if (['appLang', 'appTheme', 'appFontSize'].includes(e.key)) applyState();
            });

            // --- 业务逻辑开始 ---
            // 这里放入原本 quiz.html 中的逻辑，主要包括题目加载、答题、错题本等
            // 由于逻辑较多，我会简化并确保它能运行
            const WRONG_BOOK_KEY = 'quizWrongBookV1';
            function loadWrongBook() {
                return JSON.parse(localStorage.getItem(WRONG_BOOK_KEY) || '[]');
            }
            function saveWrongBook(items) {
                localStorage.setItem(WRONG_BOOK_KEY, JSON.stringify(items));
            }
            function syncWrongBook(question) {
                const lang = normalizeLang(localStorage.getItem('appLang') || 'zh-CN');
                const id = 'daily-' + question.id;
                const items = loadWrongBook().filter(item => item.id !== id);
                items.push({
                    id,
                    source: 'daily',
                    sourceLabel: lang === 'en' ? 'Daily Quiz' : '每日一题',
                    topic: lang === 'en' ? (question.topicEn || question.topic) : question.topic,
                    question: lang === 'en' ? (question.questionEn || question.question) : question.question,
                    answer: ((lang === 'en' ? question.optionsEn : question.options) || question.options)[question.answer],
                    explanation: lang === 'en' ? (question.explanationEn || question.explanation) : question.explanation,
                    savedAt: new Date().toLocaleString(lang === 'en' ? 'en-US' : 'zh-CN')
                });
                saveWrongBook(items);
            }

            const QUESTIONS = (window.QuizQuestionBank && window.QuizQuestionBank.daily) || [];

            const daySeed = new Date().getDate() + new Date().getMonth() * 31 + new Date().getFullYear();
            let currentQuestion = QUESTIONS.length ? QUESTIONS[daySeed % QUESTIONS.length] : null;
            let userSelected = null;

            function initQuiz() {
                if (!currentQuestion) return;
                const lang = normalizeLang(localStorage.getItem('appLang') || 'zh-CN');
                const q = currentQuestion;
                document.getElementById('quizTopic').textContent = lang === 'zh-CN' ? q.topic : q.topicEn;
                document.getElementById('quizMetaTopic').textContent = lang === 'zh-CN' ? q.topic : q.topicEn;
                document.getElementById('quizDifficulty').textContent = lang === 'zh-CN'
                    ? (q.difficultyLabel || q.difficulty || '--')
                    : (q.difficultyLabelEn || q.difficultyEn || '--');
                document.getElementById('quizQuestionTitle').textContent = lang === 'zh-CN' ? q.question : q.questionEn;
                
                const optionsContainer = document.getElementById('quizOptions');
                optionsContainer.innerHTML = '';
                const opts = lang === 'zh-CN' ? q.options : q.optionsEn;
                opts.forEach((opt, idx) => {
                    const div = document.createElement('div');
                    div.className = 'option-item';
                    div.innerHTML = `<input type="radio" name="quizOpt" value="${idx}"><span>${opt}</span>`;
                    div.onclick = () => {
                        if (document.getElementById('submitQuizBtn').disabled) return;
                        document.querySelectorAll('.option-item').forEach(i => i.classList.remove('active'));
                        div.classList.add('active');
                        userSelected = idx;
                    };
                    optionsContainer.appendChild(div);
                });
            }

            document.getElementById('submitQuizBtn').onclick = () => {
                if (userSelected === null) return;
                const isCorrect = userSelected === currentQuestion.answer;
                const lang = normalizeLang(localStorage.getItem('appLang') || 'zh-CN');
                
                document.getElementById('submitQuizBtn').disabled = true;
                const items = document.querySelectorAll('.option-item');
                items[currentQuestion.answer].classList.add('correct-lock');
                if (!isCorrect) items[userSelected].classList.add('wrong-lock');
                
                document.getElementById('quizFeedback').classList.remove('hidden');
                document.getElementById('quizFeedback').className = `quiz-feedback ${isCorrect ? 'correct' : 'wrong'}`;
                document.getElementById('quizFeedbackState').textContent = isCorrect ? (lang === 'zh-CN' ? '回答正确！' : 'Correct!') : (lang === 'zh-CN' ? '回答错误' : 'Wrong');
                document.getElementById('quizFeedbackText').textContent = isCorrect
                    ? (lang === 'zh-CN' ? currentQuestion.explanation : currentQuestion.explanationEn)
                    : (lang === 'zh-CN'
                        ? '这道题已自动加入错题本，建议稍后回顾解析。'
                        : 'This question has been added to the wrong-book for later review.');

                if (!isCorrect) {
                    syncWrongBook(currentQuestion);
                }
                
                // 显示结果卡片
                setTimeout(() => {
                    document.getElementById('quizSessionCard').classList.add('hidden');
                    document.getElementById('quizResultCard').classList.remove('hidden');
                    document.getElementById('resultOutcome').textContent = isCorrect ? (lang === 'zh-CN' ? '正确' : 'Correct') : (lang === 'zh-CN' ? '错误' : 'Wrong');
                    document.getElementById('resultCorrectAnswer').textContent = (lang === 'zh-CN' ? currentQuestion.options : currentQuestion.optionsEn)[currentQuestion.answer];
                    document.getElementById('resultAiExplanation').textContent = lang === 'zh-CN' ? currentQuestion.explanation : currentQuestion.explanationEn;
                    document.getElementById('resultWrongSaved').textContent = isCorrect ? (lang === 'zh-CN' ? '否' : 'No') : (lang === 'zh-CN' ? '已存入错题本' : 'Saved');
                }, 1500);
            };

            document.getElementById('showQuizAiBtn').onclick = () => {
                const lang = normalizeLang(localStorage.getItem('appLang') || 'zh-CN');
                document.getElementById('quizAiExplanation').textContent = lang === 'zh-CN' ? currentQuestion.explanation : currentQuestion.explanationEn;
                document.getElementById('quizAiModal').classList.remove('hidden');
            };

            document.getElementById('closeQuizAiModalBtn').onclick = () => {
                document.getElementById('quizAiModal').classList.add('hidden');
            };

            document.getElementById('viewWrongBookBtn').onclick = () => {
                window.location.href = 'wrong-book.html';
            };

            initQuiz();
        })();
    </script>
</body>
</html>
