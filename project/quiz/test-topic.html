<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>专题练习 | 圆几何测试学习中心</title>
    <style>
:root {
    --text: #1f2937;
    --muted: #64748b;
    --primary: #2563eb;
    --primary-strong: #1d4ed8;
    --accent: #f4b860;
    --accent-soft: #fff3dc;
    --cyan-soft: #dbeafe;
    --surface: rgba(255, 255, 255, 0.85);
    --surface-strong: #ffffff;
    --line: rgba(15, 23, 42, 0.08);
    --shadow-lg: 0 24px 60px rgba(31, 41, 55, 0.12);
    --shadow-md: 0 16px 32px rgba(31, 41, 55, 0.08);
    --radius-xl: 28px;
    --radius-lg: 22px;
    --radius-md: 16px;
    --font-size: 16px;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: "Trebuchet MS", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
    color: var(--text);
    font-size: var(--font-size);
    background:
        radial-gradient(circle at 12% 10%, rgba(37, 99, 235, 0.1), transparent 22%),
        radial-gradient(circle at 86% 14%, rgba(37, 99, 235, 0.1), transparent 20%),
        linear-gradient(rgba(180, 154, 109, 0.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(180, 154, 109, 0.12) 1px, transparent 1px),
        linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
    background-size: auto, auto, 46px 46px, 46px 46px, auto;
    min-height: 100vh;
    overflow-x: hidden;
    transition: all 0.3s ease-in-out;
}

/* 模式切换：护眼/夜晚，修改CSS变量 */
body.eye-mode {
    --bg-color: #f0f9eb;
    --surface: rgba(247, 251, 242, 0.88);
    --text: #166534;
    --line: #c7e3b4;
    --primary: #438a4c;
    --primary-strong: #3f6234;
}
body.night-mode {
    --text: #f1f5f9;
    --muted: #94a3b8;
    --primary: #60a5fa;
    --primary-strong: #3b82f6;
    --surface: rgba(30, 41, 59, 0.88);
    --surface-strong: #1e293b;
    --line: #475569;
}

.top-nav {
    display: flex;
    justify-content: center;
    gap: 1rem;
    padding: 1.5rem 1rem 0;
}

.top-nav a {
    padding: 0.85rem 1.5rem;
    border-radius: 999px;
    color: var(--muted);
    text-decoration: none;
    font-weight: 700;
    background: rgba(255, 255, 255, 0.76);
    border: 1px solid var(--line);
    transition: all 0.2s;
}

.top-nav a:hover {
    background: white;
    color: var(--primary);
}

.top-nav a.active {
    color: #fff;
    background: var(--primary);
}

.container {
    display: flex;
    max-width: 1240px;
    margin: 2rem auto 4rem;
    padding: 0 1.5rem;
    gap: 2rem;
}

.sidebar {
    width: 240px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 1.5rem 0;
    box-shadow: var(--shadow-md);
    backdrop-filter: blur(10px);
    flex-shrink: 0;
}

.menu-list {
    list-style: none;
}

.menu-list a {
    display: block;
    text-decoration: none;
    color: var(--text);
    padding: 1rem 1.5rem;
    border-left: 4px solid transparent;
    transition: 0.2s;
    font-weight: 600;
}

.menu-list a:hover,
.menu-list a.active {
    background: var(--cyan-soft);
    border-left-color: var(--primary);
    color: var(--primary);
}

.practice-content {
    flex: 1;
}

.topic-config-shell,
.topic-session-shell,
.topic-result-shell {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 30px;
    padding: 2.5rem;
    box-shadow: var(--shadow-lg);
    backdrop-filter: blur(12px);
}

.eyebrow {
    color: var(--primary);
    font-size: 0.9rem;
    font-weight: 800;
    letter-spacing: 0.12em;
    margin-bottom: 0.8rem;
    text-transform: uppercase;
}

h1 {
    font-size: clamp(2rem, 4vw, 3rem);
    margin-bottom: 1rem;
}

.page-intro p {
    color: var(--muted);
    line-height: 1.7;
    margin-bottom: 2rem;
}

.config-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1.5rem;
    margin-bottom: 2rem;
}

.config-card {
    background: var(--surface-strong);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 1.5rem;
}

.choice-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0.8rem;
    margin-top: 1rem;
}

.choice-chip {
    padding: 1rem;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--surface-strong);
    cursor: pointer;
    text-align: center;
    transition: 0.2s;
    font-weight: 600;
}

.choice-chip.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
}

.action-btn {
    padding: 1rem 2rem;
    border-radius: 999px;
    border: none;
    background: var(--primary);
    color: #fff;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
}

.action-btn:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
}

.page-footer {
    text-align: center;
    padding: 2rem;
    color: var(--muted);
}

@media (max-width: 900px) {
    .container {
        flex-direction: column;
    }
    .sidebar {
        width: 100%;
    }
    .config-grid {
        grid-template-columns: 1fr;
    }
}
</style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body data-page="topic-practice">
    <nav class="top-nav">
        <a href="index.html" id="navHome">首页</a>
        <a href="game.html" id="navGame">游戏</a>
        <a href="home.html" class="active" id="navQuiz">测试</a>
    </nav>

    <div class="container">
        <aside class="sidebar">
            <ul class="menu-list">
                <li><a href="test-prep.html" id="menuGuide">使用教程</a></li>
                <li><a href="test-topic.html" class="active" id="menuTopic">专题练习</a></li>
                <li><a href="test-comprehensive.html" id="menuComp">综合练习</a></li>
                <li><a href="daily.html" id="menuDaily">每日一题</a></li>
            </ul>
        </aside>

        <main class="practice-content">
            <section class="topic-config-shell" id="topicConfigShell">
                <div class="page-intro">
                    <p class="eyebrow" id="setupEyebrow">TOPIC SETUP</p>
                    <h1 id="setupTitle">专题练习配置页</h1>
                    <p id="setupDesc">先选择专题，再设置难度和题量。系统会按你的条件从题库中筛选题目，并进入做题页面。</p>
                </div>

                <div class="config-grid">
                    <div class="config-card">
                        <h2 id="cardTopic">选择专题</h2>
                        <div class="choice-grid" id="topicChoices">
                            <div class="choice-chip active" data-value="circle-basics">圆基础</div>
                            <div class="choice-chip" data-value="angles">圆心角与圆周角</div>
                            <div class="choice-chip" data-value="tangent">切线性质</div>
                            <div class="choice-chip" data-value="chord">弦与弧</div>
                        </div>
                    </div>
                    <div class="config-card">
                        <h2 id="cardDifficulty">选择难度</h2>
                        <div class="choice-grid" id="difficultyChoices">
                            <div class="choice-chip active" data-value="basic">基础</div>
                            <div class="choice-chip" data-value="intermediate">进阶</div>
                            <div class="choice-chip" data-value="advanced">提高</div>
                        </div>
                    </div>
                </div>

                <button class="action-btn" id="startPracticeBtn">开始练习</button>
            </section>
        </main>
    </div>

    <footer class="page-footer">
        <p id="footerText">圆几何互动学习网站 © 2026 EBU5315 Coursework</p>
    </footer>

    <script>
        function applyState() {
            const lang = localStorage.getItem('appLang') || 'zh-CN';
            const theme = localStorage.getItem('appTheme') || 'default';
            const fontSize = localStorage.getItem('appFontSize') || '16';
            
            document.body.classList.remove('eye-mode', 'night-mode');
            if (theme === 'eye') document.body.classList.add('eye-mode');
            if (theme === 'night') document.body.classList.add('night-mode');
            document.documentElement.style.setProperty('--font-size', fontSize + 'px');

            const texts = {
                'zh-CN': {
                    navHome: '首页', navGame: '游戏', navQuiz: '测试',
                    menuGuide: '使用教程', menuTopic: '专题练习', menuComp: '综合练习', menuDaily: '每日一题',
                    setupEyebrow: '专题练习配置', setupTitle: '专题练习配置页',
                    setupDesc: '先选择专题，再设置难度和题量。系统会按你的条件从题库中筛选题目，并进入做题页面。',
                    cardTopic: '选择专题', cardDifficulty: '选择难度',
                    startPracticeBtn: '开始练习',
                    footerText: '圆几何互动学习网站 © 2026 EBU5315 Coursework'
                },
                'en': {
                    navHome: 'Home', navGame: 'Game', navQuiz: 'Test',
                    menuGuide: 'Guide', menuTopic: 'Topic Practice', menuComp: 'Mixed Practice', menuDaily: 'Daily Quiz',
                    setupEyebrow: 'TOPIC SETUP', setupTitle: 'Topic Practice',
                    setupDesc: 'Choose a topic, difficulty, and amount first.',
                    cardTopic: 'Choose Topic', cardDifficulty: 'Choose Difficulty',
                    startPracticeBtn: 'Start Practice',
                    footerText: 'Circle Geometry Learning © 2026 EBU5315 Coursework'
                }
            }[lang] || {};

            Object.keys(texts).forEach(id => {
                const el = document.getElementById(id);
                if (el) el.textContent = texts[id];
            });
            document.documentElement.lang = lang;
        }

        window.onload = applyState;
        window.addEventListener('storage', (e) => {
            if (['appLang', 'appTheme', 'appFontSize'].includes(e.key)) applyState();
        });

        document.querySelectorAll('.choice-chip').forEach(chip => {
            chip.addEventListener('click', () => {
                chip.parentElement.querySelectorAll('.choice-chip').forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
            });
        });
    </script>
</body>
</html>
