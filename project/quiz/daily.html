    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Microsoft YaHei", sans-serif;
}

body {
    --daily-text: var(--text, #243042);
    --daily-muted: var(--muted, #66758a);
    --daily-primary: var(--primary, #0f5f66);
    --daily-primary-strong: var(--primary-strong, #0a454a);
    --daily-surface: var(--surface, rgba(255, 255, 255, 0.9));
    --daily-surface-strong: var(--surface-strong, #ffffff);
    --daily-line: var(--line, rgba(28, 39, 61, 0.09));
    --daily-shadow: var(--shadow, 0 18px 40px rgba(28, 39, 61, 0.08));
}

body {
    background:
        radial-gradient(circle at 10% 8%, rgba(240, 180, 100, 0.2), transparent 20%),
        radial-gradient(circle at 88% 12%, rgba(16, 95, 102, 0.16), transparent 18%),
        linear-gradient(180deg, #fffaf1 0%, #f4f8fc 100%);
    color: var(--daily-text);
    line-height: 1.6;
    overflow-x: hidden;
}

.hidden {
    display: none !important;
}

.top-nav {
    width: 100%;
    padding: 16px 0;
    background: color-mix(in srgb, var(--daily-surface) 94%, transparent);
    backdrop-filter: blur(10px);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    display: flex;
    justify-content: center;
    gap: 24px;
    position: sticky;
    top: 0;
    z-index: 20;
}

.top-nav a {
    text-decoration: none;
    font-size: 18px;
    color: var(--daily-muted);
    padding: 10px 18px;
    border-radius: 999px;
    transition: 0.2s;
}

.top-nav a:hover,
.top-nav a.active {
    background: linear-gradient(135deg, var(--daily-primary-strong), var(--daily-primary));
    color: #fff;
}

.daily-shell {
    max-width: 1100px;
    margin: 32px auto 0;
    padding: 0 20px 40px;
}

.daily-hero,
.rules-card,
.start-card,
.daily-question-card {
    background: var(--daily-surface);
    border: 1px solid color-mix(in srgb, var(--daily-surface-strong) 80%, transparent);
    border-radius: 28px;
    box-shadow: var(--daily-shadow);
}

.daily-hero {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    padding: 30px;
    margin-bottom: 22px;
}

.eyebrow {
    display: inline-flex;
    align-items: center;
    padding: 7px 12px;
    margin-bottom: 14px;
    border-radius: 999px;
    background: color-mix(in srgb, var(--daily-primary) 10%, transparent);
    color: var(--daily-primary);
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 0.08em;
}

.daily-hero h1 {
    font-size: clamp(2rem, 4vw, 3.2rem);
    margin-bottom: 10px;
    overflow-wrap: anywhere;
}

.daily-hero p {
    color: var(--daily-muted);
}

.hero-badge {
    width: 92px;
    height: 92px;
    display: grid;
    place-items: center;
    border-radius: 28px;
    background: linear-gradient(135deg, var(--daily-primary-strong), var(--daily-primary));
    color: #fff;
    font-size: 2rem;
}

.checkin-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 18px;
    margin-bottom: 22px;
}

.info-card {
    background: color-mix(in srgb, var(--daily-surface) 98%, transparent);
    border: 1px solid color-mix(in srgb, var(--daily-surface-strong) 80%, transparent);
    border-radius: 24px;
    padding: 22px;
    box-shadow: var(--daily-shadow);
}

.info-label {
    display: block;
    color: var(--daily-muted);
    font-size: 0.9rem;
    margin-bottom: 8px;
}

.info-card strong {
    font-size: 1.5rem;
}

.rules-card,
.start-card {
    padding: 26px;
    margin-bottom: 22px;
}

.card-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
}

.card-header i {
    color: var(--daily-primary);
}

.rules-list {
    padding-left: 20px;
    color: var(--daily-muted);
    display: grid;
    gap: 8px;
}

.start-card {
    text-align: center;
}

.start-btn {
    border: none;
    border-radius: 999px;
    padding: 16px 30px;
    background: linear-gradient(135deg, var(--daily-primary-strong), var(--daily-primary));
    color: #fff;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 10px;
}

.start-tip {
    margin-top: 14px;
    color: var(--daily-muted);
}

.action-btn {
    border: 1px solid color-mix(in srgb, var(--daily-line) 100%, #d6e4eb);
    background: var(--daily-surface-strong);
    border-radius: 999px;
    padding: 10px 18px;
    cursor: pointer;
    transition: 0.2s;
}

.action-btn.primary {
    background: linear-gradient(135deg, var(--daily-primary-strong), var(--daily-primary));
    color: #fff;
    border-color: transparent;
}

.action-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.page-footer {
    text-align: center;
    padding: 20px;
    font-size: 13px;
    color: var(--daily-muted);
    border-top: 1px solid color-mix(in srgb, var(--daily-line) 100%, transparent);
    margin-top: 40px;
}

@supports not ((backdrop-filter: blur(10px)) or (-webkit-backdrop-filter: blur(10px))) {
    .top-nav,
    .daily-hero,
    .rules-card,
    .start-card,
    .daily-question-card,
    .info-card {
        background: var(--daily-surface-strong);
    }
}

@media (max-width: 900px) {
    .checkin-grid {
        grid-template-columns: 1fr;
    }

    .daily-hero {
        flex-direction: column;
        align-items: flex-start;
    }
}

@media (max-width: 760px) {
    .top-nav {
        gap: 10px;
        padding: 12px 10px;
        flex-wrap: wrap;
    }

    .top-nav a {
        font-size: 16px;
        padding: 8px 14px;
    }

    .daily-shell {
        padding: 0 14px 36px;
    }

    .daily-hero,
    .rules-card,
    .start-card {
        padding: 22px;
    }

    .daily-hero h1 {
        font-size: clamp(1.8rem, 10vw, 2.6rem);
    }

    .daily-hero p,
    .start-tip,
    .rules-list {
        font-size: 0.96rem;
        line-height: 1.72;
    }

    .start-btn {
        width: 100%;
        justify-content: center;
    }
}
</style>

  function getLang() { return localStorage.getItem(LANG_KEY) || "zh"; }
  function getFontScale() {
    const value = Number(localStorage.getItem(FONT_KEY) || "1");
    if (Number.isNaN(value)) return 1;
    return Math.max(MIN_FONT_SCALE, Math.min(MAX_FONT_SCALE, value));
  }
  function getTheme() {
    const theme = localStorage.getItem(THEME_KEY) || "eye-care";
    return ["eye-care", "night"].includes(theme) ? theme : "eye-care";
  }
  function pageKey() { return document.body.dataset.page || "home"; }
  function qs(selector) { return document.querySelector(selector); }
  function qsa(selector) { return Array.from(document.querySelectorAll(selector)); }
  function setText(selector, text) {
    const node = typeof selector === "string" ? qs(selector) : selector;
    if (node && typeof text === "string") node.textContent = text;
  }
  function setMany(selector, values) {
    qsa(selector).forEach((node, index) => {
      if (typeof values[index] === "string") node.textContent = values[index];
    });
  }

  function buildToolbar() {
    qsa(".lang-switcher, .ui-toolbar").forEach((node) => node.remove());
    const lang = getLang();
    const scale = getFontScale();
    const theme = getTheme();
    const t = shared[lang];
    const toolbar = document.createElement("div");
    toolbar.className = "ui-toolbar";
    toolbar.innerHTML = `
      <div class="lang-switcher">
        <button type="button" class="lang-btn ${lang === "zh" ? "active" : ""}" data-lang="zh">${t.languageZh}</button>
        <span>/</span>
        <button type="button" class="lang-btn ${lang === "en" ? "active" : ""}" data-lang="en">${t.languageEn}</button>
      </div>
      <div class="theme-switcher" role="group" aria-label="${t.theme}">
        <span class="theme-switcher-label">${t.theme}</span>
        <button type="button" class="theme-btn ${theme === "eye-care" ? "active" : ""}" data-theme="eye-care">${t.eyeCare}</button>
        <button type="button" class="theme-btn ${theme === "night" ? "active" : ""}" data-theme="night">${t.night}</button>
      </div>
      <label class="font-size-control" for="fontScaleRange">
        <span class="font-size-label">${t.font}</span>
        <input id="fontScaleRange" type="range" min="${MIN_FONT_SCALE}" max="${MAX_FONT_SCALE}" step="0.02" value="${scale}">
        <span class="font-size-value">${Math.round(scale * 100)}%</span>
      </label>
    `;
    toolbar.querySelectorAll(".lang-btn").forEach((button) => {
      button.addEventListener("click", () => setLang(button.dataset.lang));
    });
    toolbar.querySelectorAll(".theme-btn").forEach((button) => {
      button.addEventListener("click", () => setTheme(button.dataset.theme));
    });
    toolbar.querySelector("#fontScaleRange").addEventListener("input", (event) => {
      localStorage.setItem(FONT_KEY, event.target.value);
      applyFontScale();
    });
    document.body.prepend(toolbar);
  }

  function setLang(lang) {
    localStorage.setItem(LANG_KEY, lang);
    buildToolbar();
    applyLanguage();
    window.dispatchEvent(new CustomEvent("g8-language-change", { detail: { lang } }));
  }

  function applyTheme() {
    const theme = getTheme();
    document.body.dataset.theme = theme;
    document.documentElement.style.colorScheme = theme === "night" ? "dark" : "light";
    qsa(".theme-btn").forEach((button) => {
      button.classList.toggle("active", button.dataset.theme === theme);
    });
  }

  function setTheme(theme) {
    localStorage.setItem(THEME_KEY, theme);
    applyTheme();
    buildToolbar();
    window.dispatchEvent(new CustomEvent("g8-theme-change", { detail: { theme } }));
  }

  function applyFontScale() {
    const scale = getFontScale();
    document.documentElement.style.fontSize = `${scale * 100}%`;
    setText(".font-size-value", `${Math.round(scale * 100)}%`);
    const input = qs("#fontScaleRange");
    if (input) input.value = String(scale);
  }

  function parsePracticeTitle(value, lang) {

    if (!match) return value;
    if (lang === "zh") return `${match[1]} - ${match[2]} - ${match[3]} 题`;
    return `${match[1]} - ${match[2]} - ${match[3]} Questions`;
  }

    <script>
document.addEventListener("DOMContentLoaded", () => {
    if (document.body.dataset.page !== "daily-checkin") {
        return;
    }

    const questionBank = [
        {
            id: "daily-cb-1",
            topic: "circle-basics",
            topicLabel: "圆的基础概念",
            difficulty: "basic",
            difficultyLabel: "基础",
            question: "下列关于圆的说法中，正确的是哪一项？",
            options: [
                "圆心到圆上任意一点的距离相等",
                "圆的直径一定小于半径",
                "半径是圆外两点之间的线段",
                "任意圆心角都等于 90°"
            ],
            answer: "A",
            explanation: "圆的定义决定了圆上各点到圆心的距离都相等，这个固定距离就是半径。",
        },
        {
            id: "daily-ang-1",
            topic: "angles",
            topicLabel: "圆心角与圆周角",
            difficulty: "intermediate",
            difficultyLabel: "提高",
            question: "同弧所对的圆心角是 100°，那么对应的圆周角是多少？",
            options: ["25°", "50°", "100°", "200°"],
            answer: "B",
            explanation: "同弧所对的圆周角等于圆心角的一半，所以 100° 对应的圆周角是 50°。",
        },
        {
            id: "daily-tan-1",
            topic: "tangent",
            topicLabel: "切线性质",
            difficulty: "basic",
            difficultyLabel: "基础",
            question: "圆的切线与经过切点的半径之间的位置关系是？",
            options: ["平行", "重合", "垂直", "没有固定关系"],
            answer: "C",
            explanation: "切线性质的核心结论是：圆的切线垂直于经过切点的半径。",
        },
        {
            id: "daily-ch-1",
            topic: "chord",
            topicLabel: "弦与弧",
            difficulty: "advanced",
            difficultyLabel: "进阶",
            question: "在同圆中，相等的弦所对应的弧有什么关系？",
            options: ["互相垂直", "对应的弧相等", "一定平行", "与圆心无关"],
            answer: "B",
            explanation: "同圆或等圆中，相等的弦所对的弧相等，这是弦弧关系中的基础结论。",
        },
    ];

    const storageKey = "g8-daily-checkin-history";
    const statusKey = "g8-daily-checkin-status";
    const sessionKey = "g8-daily-quiz-session";
    const usedQuestionKey = "g8-daily-used-question-ids";
    const todayKey = new Date().toISOString().slice(0, 10);

    const history = JSON.parse(localStorage.getItem(storageKey) || "[]");
    const statusMap = JSON.parse(localStorage.getItem(statusKey) || "{}");

    const todayDateEl = document.getElementById("todayDate");
    const checkinStatusEl = document.getElementById("checkinStatus");
    const streakDaysEl = document.getElementById("streakDays");
    const startDailyBtn = document.getElementById("startDailyBtn");

    function formatToday() {
        return new Intl.DateTimeFormat("zh-CN", {
            year: "numeric",
            month: "long",
            day: "numeric",
            weekday: "long",
        }).format(new Date());
    }

    function getStreakDays() {
        if (!history.length) {
            return 0;
        }

        const uniqueDays = [...new Set(history)].sort().reverse();
        let streak = 0;
        const current = new Date(`${todayKey}T00:00:00`);

        for (let i = 0; i < uniqueDays.length; i += 1) {
            const compare = current.toISOString().slice(0, 10);
            if (uniqueDays[i] === compare) {
                streak += 1;
                current.setDate(current.getDate() - 1);
            } else {
                break;
            }
        }

        return streak;
    }

    function refreshHeader() {
        todayDateEl.textContent = formatToday();
        checkinStatusEl.textContent = statusMap[todayKey] ? "已打卡" : "未打卡";
        streakDaysEl.textContent = `${getStreakDays()} 天`;
    }

    function pickDailyQuestion() {
        const usedIds = JSON.parse(localStorage.getItem(usedQuestionKey) || "[]");
        const validUsedIds = usedIds.filter((id) => questionBank.some((item) => item.id === id));
        const unusedQuestions = questionBank.filter((item) => !validUsedIds.includes(item.id));

        const pool = unusedQuestions.length ? unusedQuestions : questionBank;
        const nextQuestion = pool[0];

        const nextUsedIds = unusedQuestions.length
            ? [...validUsedIds, nextQuestion.id]
            : [nextQuestion.id];

        localStorage.setItem(usedQuestionKey, JSON.stringify(nextUsedIds));
        return nextQuestion;
    }

    startDailyBtn.addEventListener("click", () => {
        const question = pickDailyQuestion();
        const session = {
            mode: "daily-quiz",
            date: todayKey,
            question,
        };

        localStorage.setItem(sessionKey, JSON.stringify(session));
        window.location.href = "quiz.html";
    });

    refreshHeader();
});
</script>
