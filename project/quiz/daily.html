<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日一题 | 圆几何测试学习中心</title>
    <style>
:root {
    --text: #1f2937;
    --muted: #64748b;
    --primary: #2563eb;
    --primary-strong: #1d4ed8;
    --accent: #f4b860;
    --accent-soft: #fff3dc;
    --cyan-soft: #dbeafe;
    --surface: rgba(255, 255, 255, 0.85);
    --surface-strong: #ffffff;
    --line: rgba(15, 23, 42, 0.08);
    --shadow-lg: 0 24px 60px rgba(31, 41, 55, 0.12);
    --shadow-md: 0 16px 32px rgba(31, 41, 55, 0.08);
    --radius-xl: 28px;
    --radius-lg: 22px;
    --radius-md: 16px;
    --font-size: 16px;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: "Trebuchet MS", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
    color: var(--text);
    font-size: var(--font-size);
    background:
        radial-gradient(circle at 12% 10%, rgba(37, 99, 235, 0.1), transparent 22%),
        radial-gradient(circle at 86% 14%, rgba(37, 99, 235, 0.1), transparent 20%),
        linear-gradient(rgba(180, 154, 109, 0.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(180, 154, 109, 0.12) 1px, transparent 1px),
        linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
    background-size: auto, auto, 46px 46px, 46px 46px, auto;
    min-height: 100vh;
    overflow-x: hidden;
    transition: all 0.3s ease-in-out;
}

/* 模式切换：护眼/夜晚，修改CSS变量 */
body.eye-mode {
    --bg-color: #f0f9eb;
    --surface: rgba(247, 251, 242, 0.88);
    --text: #166534;
    --line: #c7e3b4;
    --primary: #438a4c;
    --primary-strong: #3f6234;
}
body.night-mode {
    --text: #f1f5f9;
    --muted: #94a3b8;
    --primary: #60a5fa;
    --primary-strong: #3b82f6;
    --surface: rgba(30, 41, 59, 0.88);
    --surface-strong: #1e293b;
    --line: #475569;
}

.top-nav {
    display: flex;
    justify-content: center;
    gap: 1rem;
    padding: 1.5rem 1rem 0;
}

.top-nav a {
    padding: 0.85rem 1.5rem;
    border-radius: 999px;
    color: var(--muted);
    text-decoration: none;
    font-weight: 700;
    background: rgba(255, 255, 255, 0.76);
    border: 1px solid var(--line);
    transition: all 0.2s;
}

.top-nav a:hover {
    background: white;
    color: var(--primary);
}

.top-nav a.active {
    color: #fff;
    background: var(--primary);
}

.quiz-shell {
    width: min(1120px, calc(100% - 32px));
    margin: 2rem auto 3rem;
}

.quiz-session-card,
.quiz-result-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 36px;
    box-shadow: var(--shadow-md);
    padding: 2rem;
    backdrop-filter: blur(12px);
}

.hidden {
    display: none !important;
}

.eyebrow {
    margin: 0 0 0.6rem;
    color: var(--primary);
    font-size: 0.9rem;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
}

.session-topbar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 1.5rem;
}

.session-title-group h1 {
    margin: 0;
    font-size: clamp(2rem, 4vw, 3.1rem);
    line-height: 1.1;
}

.question-card {
    margin-top: 1.75rem;
    padding: 1.6rem;
    border-radius: 28px;
    background: var(--surface-strong);
    border: 1px solid var(--line);
}

.action-btn {
    padding: 1rem 2rem;
    border-radius: 999px;
    border: none;
    background: var(--primary);
    color: #fff;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
    text-decoration: none;
}

.page-footer {
    text-align: center;
    padding: 2rem;
    color: var(--muted);
}
</style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body data-page="daily-quiz">
    <nav class="top-nav">
        <a href="index.html" id="navHome">首页</a>
        <a href="game.html" id="navGame">游戏</a>
        <a href="home.html" class="active" id="navQuiz">测试</a>
    </nav>

    <main class="quiz-shell">
        <section class="quiz-session-card">
            <div class="session-topbar">
                <div class="session-title-group">
                    <p class="eyebrow" id="eyebrow">DAILY QUESTION</p>
                    <h1 id="title">每日一题</h1>
                </div>
            </div>

            <div class="question-card">
                <h2 id="questionPlaceholder">今日题目正在加载中...</h2>
                <p id="questionDesc">每日更新一道精选圆几何题目，帮助你巩固基础。</p>
            </div>

            <div style="margin-top: 2rem;">
                <a href="quiz.html" class="action-btn" id="startBtn">开始答题</a>
            </div>
        </section>
    </main>

    <footer class="page-footer">
        <p id="footerText">圆几何互动学习网站 © 2026 EBU5315 Coursework</p>
    </footer>

    <script>
        function applyState() {
            const lang = localStorage.getItem('appLang') || 'zh-CN';
            const theme = localStorage.getItem('appTheme') || 'default';
            const fontSize = localStorage.getItem('appFontSize') || '16';
            
            document.body.classList.remove('eye-mode', 'night-mode');
            if (theme === 'eye') document.body.classList.add('eye-mode');
            if (theme === 'night') document.body.classList.add('night-mode');
            document.documentElement.style.setProperty('--font-size', fontSize + 'px');

            const texts = {
                'zh-CN': {
                    navHome: '首页', navGame: '游戏', navQuiz: '测试',
                    eyebrow: '每日精选', title: '每日一题',
                    questionPlaceholder: '今日题目正在加载中...',
                    questionDesc: '每日更新一道精选圆几何题目，帮助你巩固基础。',
                    startBtn: '开始答题',
                    footerText: '圆几何互动学习网站 © 2026 EBU5315 Coursework'
                },
                'en': {
                    navHome: 'Home', navGame: 'Game', navQuiz: 'Test',
                    eyebrow: 'DAILY SELECTION', title: 'Daily Question',
                    questionPlaceholder: 'Loading today\'s question...',
                    questionDesc: 'One selected question per day to help you consolidate basics.',
                    startBtn: 'Start Quiz',
                    footerText: 'Circle Geometry Learning © 2026 EBU5315 Coursework'
                }
            }[lang] || {};

            Object.keys(texts).forEach(id => {
                const el = document.getElementById(id);
                if (el) el.textContent = texts[id];
            });
            document.documentElement.lang = lang;
        }

        window.onload = applyState;
        window.addEventListener('storage', (e) => {
            if (['appLang', 'appTheme', 'appFontSize'].includes(e.key)) applyState();
        });
    </script>
</body>
</html>
