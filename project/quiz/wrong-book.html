<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>错题本 | 圆几何测试学习中心</title>
<style>
:root{--text:#1f2937;--muted:#64748b;--primary:#2563eb;--primary-strong:#1d4ed8;--surface:rgba(255,255,255,.85);--surface-strong:#fff;--line:rgba(15,23,42,.08);--shadow-lg:0 24px 60px rgba(31,41,55,.12);--shadow-md:0 16px 32px rgba(31,41,55,.08);--font-size:16px}*{box-sizing:border-box;margin:0;padding:0}body{font-family:"Trebuchet MS","Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;color:var(--text);font-size:var(--font-size);background:radial-gradient(circle at 12% 10%,rgba(37,99,235,.1),transparent 22%),radial-gradient(circle at 86% 14%,rgba(37,99,235,.1),transparent 20%),linear-gradient(rgba(180,154,109,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(180,154,109,.12) 1px,transparent 1px),linear-gradient(180deg,#f8fafc 0%,#f1f5f9 100%);background-size:auto,auto,46px 46px,46px 46px,auto;min-height:100vh}body.eye-mode{--surface:rgba(247,251,242,.88);--text:#166534;--line:#c7e3b4;--primary:#438a4c;--primary-strong:#3f6234}body.night-mode{--text:#f1f5f9;--muted:#94a3b8;--primary:#60a5fa;--primary-strong:#3b82f6;--surface:rgba(15,23,42,0.9);--surface-strong:#0f172a;--border-color:#334155;--bg-color:#020617;background:radial-gradient(circle at 12% 10%,rgba(56,189,248,0.15),transparent 25%),radial-gradient(circle at 86% 14%,rgba(56,189,248,0.15),transparent 22%),linear-gradient(rgba(56,189,248,0.2) 1px,transparent 1px),linear-gradient(90deg,rgba(56,189,248,0.2) 1px,transparent 1px),linear-gradient(180deg,#020617 0%,#0f172a 100%);background-size:auto,auto,46px 46px,46px 46px,auto}.top-nav{display:flex;justify-content:center;gap:1rem;padding:1.5rem 1rem 0;flex-wrap:wrap}.top-nav a{padding:.85rem 1.5rem;border-radius:999px;color:var(--muted);text-decoration:none;font-weight:700;background:rgba(255,255,255,.76);border:1px solid var(--line)}.top-nav a.active{color:#fff;background:var(--primary)}.shell{width:min(1180px,calc(100% - 32px));margin:2rem auto 3rem}.hero,.panel,.item{background:var(--surface);border:1px solid var(--line);border-radius:32px;box-shadow:var(--shadow-md);backdrop-filter:blur(12px)}.hero,.panel{padding:2rem}.hero{margin-bottom:1rem}.eyebrow{display:inline-flex;align-items:center;padding:.45rem .9rem;border-radius:999px;background:rgba(37,99,235,.08);color:var(--primary);font-size:.88rem;font-weight:800;letter-spacing:.08em;margin-bottom:.9rem}.title{font-size:clamp(2.2rem,4vw,3.8rem);margin-bottom:.7rem}.desc{color:var(--muted);line-height:1.8}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-top:1.4rem}.stat{padding:1.1rem;border-radius:22px;background:var(--surface-strong);border:1px solid var(--line)}.stat strong{display:block;font-size:2rem;margin:.5rem 0}.stat span,.meta,.empty p{color:var(--muted)}.toolbar{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}.btn{min-height:44px;padding:.8rem 1.2rem;border-radius:999px;border:1px solid var(--line);background:var(--surface-strong);color:var(--text);font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.primary{color:#fff;background:linear-gradient(135deg,var(--primary-strong),var(--primary));border:none}.list{display:grid;gap:1rem}.item{padding:1.2rem;background:var(--surface-strong)}.item h3{margin-bottom:.6rem;font-size:1.25rem}.meta{display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:.8rem}.explain{line-height:1.8;margin-bottom:1rem}.actions{display:flex;gap:.8rem;flex-wrap:wrap}.empty{text-align:center;padding:3rem 1.2rem}.page-footer{text-align:center;padding:0 1rem 2rem;color:var(--muted)}@media (max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}}@media (max-width:640px){.shell{width:min(100% - 20px,1180px)}.hero,.panel{padding:1.2rem}.stats{grid-template-columns:1fr}.toolbar,.actions{flex-direction:column}.btn{width:100%}}
</style>
<style>
.quiz-return{position:fixed;top:18px;left:18px;z-index:9999;display:inline-flex;align-items:center;gap:10px;padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.78);border:1px solid var(--line);color:var(--text);font-weight:900;text-decoration:none;box-shadow:var(--shadow-md);backdrop-filter:blur(12px);transition:transform .2s ease,background .2s ease,border-color .2s ease}
body.night-mode .quiz-return{background:rgba(2,6,23,.55);border-color:rgba(148,163,184,.18);color:#f1f5f9}
body.eye-mode .quiz-return{background:rgba(247,251,242,.88)}
.quiz-return:hover{transform:translateY(-2px)}
</style>
<script src="../js/common.js" defer></script>
</head>
<body>
<a class="quiz-return" href="test.html">返回测试首页</a>
<nav class="top-nav"><a href="../index/index.html" id="navHome">首页</a><a href="../game/game.html" id="navGame">游戏</a><a href="test.html" class="active" id="navQuiz">测试</a></nav>
<main class="shell">
<section class="hero">
<p class="eyebrow">Wrong Book</p>
<h1 class="title">错题本</h1>
<p class="desc">统一收录专题练习、综合练习和每日一题中的错题，方便集中回顾、反复练习和查看解析。</p>
<div class="stats">
<div class="stat"><span>累计错题</span><strong id="totalCount">0</strong><p>当前已收录的错题数量。</p></div>
<div class="stat"><span>专题练习</span><strong id="topicCount">0</strong><p>来自专题练习的错题。</p></div>
<div class="stat"><span>综合练习</span><strong id="compCount">0</strong><p>来自综合练习的错题。</p></div>
<div class="stat"><span>每日一题</span><strong id="dailyCount">0</strong><p>来自每日打卡的错题。</p></div>
</div>
</section>
<section class="panel">
<div class="toolbar">
<div class="desc">可以在这里查看题目来源、正确答案和解析。</div>
<div class="actions"><button class="btn" id="clearBtn">清空错题本</button><a class="btn primary" href="test.html">返回测试首页</a></div>
</div>
<div class="list" id="wrongList"></div>
</section>
</main>
<footer class="page-footer"><p>圆几何互动学习网站 © 2026 EBU5315 Coursework</p></footer>
<script src="../question-bank.js"></script>
<script>
(() => {
    const KEY = 'quizWrongBookV1';

    function normalizeLang(lang) {
        const value = String(lang || '').toLowerCase();
        if (value === 'en' || value === 'en-us' || value === 'en_us' || value === 'en-gb' || value === 'en_gb') return 'en';
        return 'zh-CN';
    }

    function getLang() {
        return normalizeLang(localStorage.getItem('appLang') || 'zh-CN');
    }

    const i18n = {
        'zh-CN': {
            docTitle: '错题本 | 圆几何测试学习中心',
            returnHome: '返回测试首页',
            navHome: '首页', navGame: '游戏', navQuiz: '测试',
            eyebrow: 'Wrong Book',
            title: '错题本',
            heroDesc: '统一收录专题练习、综合练习和每日一题中的错题，方便集中回顾、反复练习和查看解析。',
            statTotal: '累计错题', statTotalDesc: '当前已收录的错题数量。',
            statTopic: '专题练习', statTopicDesc: '来自专题练习的错题。',
            statComp: '综合练习', statCompDesc: '来自综合练习的错题。',
            statDaily: '每日一题', statDailyDesc: '来自每日打卡的错题。',
            toolbarDesc: '可以在这里查看题目来源、正确答案和解析。',
            clearBtn: '清空错题本',
            backBtn: '返回测试首页',
            footerText: '圆几何互动学习网站 © 2026 EBU5315 Coursework',
            emptyTitle: '当前还没有错题记录',
            emptyDesc: '去做题后，答错的题目会自动同步到这里。',
            source: '来源', topic: '专题', answer: '正确答案', savedAt: '记录时间',
            remove: '移除这道题',
            sourceTopic: '专题练习', sourceComp: '综合练习', sourceDaily: '每日一题'
        },
        'en': {
            docTitle: 'Wrong Book | Circle Geometry Learning Center',
            returnHome: 'Back to Test Home',
            navHome: 'Home', navGame: 'Game', navQuiz: 'Test',
            eyebrow: 'Wrong Book',
            title: 'Wrong Question Book',
            heroDesc: 'Collects wrong answers from topic practice, mixed practice, and daily quiz for focused review.',
            statTotal: 'Total Wrong Questions', statTotalDesc: 'Number of wrong questions currently recorded.',
            statTopic: 'Topic Practice', statTopicDesc: 'Wrong questions from topic practice.',
            statComp: 'Mixed Practice', statCompDesc: 'Wrong questions from mixed practice.',
            statDaily: 'Daily Quiz', statDailyDesc: 'Wrong questions from daily check-ins.',
            toolbarDesc: 'You can review source, correct answer, and explanation here.',
            clearBtn: 'Clear Wrong Book',
            backBtn: 'Back to Test Home',
            footerText: 'Circle Geometry Learning © 2026 EBU5315 Coursework',
            emptyTitle: 'No wrong-question records yet',
            emptyDesc: 'After you answer incorrectly in practice, items will appear here automatically.',
            source: 'Source', topic: 'Topic', answer: 'Correct Answer', savedAt: 'Saved At',
            remove: 'Remove This Item',
            sourceTopic: 'Topic Practice', sourceComp: 'Mixed Practice', sourceDaily: 'Daily Quiz'
        }
    };

    function t(key) {
        const lang = getLang();
        return (i18n[lang] && i18n[lang][key]) || i18n['zh-CN'][key] || '';
    }

    function sourceLabel(source) {
        if (source === 'topic') return t('sourceTopic');
        if (source === 'comprehensive') return t('sourceComp');
        if (source === 'daily') return t('sourceDaily');
        return source || '--';
    }

    const get = () => JSON.parse(localStorage.getItem(KEY) || '[]');
    const set = v => localStorage.setItem(KEY, JSON.stringify(v));

    const questionMap = (() => {
        const map = {};
        const all = (window.QuizQuestionBank && window.QuizQuestionBank.all) || [];
        all.forEach(q => {
            map[q.id] = q;
        });
        return map;
    })();

    function lookupQuestion(item) {
        if (!item || !item.id) return null;
        if (questionMap[item.id]) return questionMap[item.id];
        if (String(item.id).startsWith('daily-')) {
            const stripped = String(item.id).slice(6);
            if (questionMap[stripped]) return questionMap[stripped];
        }
        return null;
    }

    function applyStaticLang() {
        document.title = t('docTitle');
        const quizReturn = document.querySelector('.quiz-return');
        if (quizReturn) quizReturn.textContent = t('returnHome');

        const navHome = document.getElementById('navHome');
        const navGame = document.getElementById('navGame');
        const navQuiz = document.getElementById('navQuiz');
        if (navHome) navHome.textContent = t('navHome');
        if (navGame) navGame.textContent = t('navGame');
        if (navQuiz) navQuiz.textContent = t('navQuiz');

        const eyebrow = document.querySelector('.hero .eyebrow');
        const title = document.querySelector('.hero .title');
        const heroDesc = document.querySelector('.hero .desc');
        if (eyebrow) eyebrow.textContent = t('eyebrow');
        if (title) title.textContent = t('title');
        if (heroDesc) heroDesc.textContent = t('heroDesc');

        const stats = document.querySelectorAll('.hero .stat');
        const statKeys = [
            ['statTotal', 'statTotalDesc'],
            ['statTopic', 'statTopicDesc'],
            ['statComp', 'statCompDesc'],
            ['statDaily', 'statDailyDesc']
        ];
        stats.forEach((stat, i) => {
            const span = stat.querySelector('span');
            const p = stat.querySelector('p');
            if (span) span.textContent = t(statKeys[i][0]);
            if (p) p.textContent = t(statKeys[i][1]);
        });

        const toolbarDesc = document.querySelector('.toolbar > .desc');
        if (toolbarDesc) toolbarDesc.textContent = t('toolbarDesc');

        const clearBtn = document.getElementById('clearBtn');
        if (clearBtn) clearBtn.textContent = t('clearBtn');

        const backBtn = document.querySelector('.toolbar .actions a.btn.primary');
        if (backBtn) backBtn.textContent = t('backBtn');

        const footer = document.querySelector('.page-footer p');
        if (footer) footer.textContent = t('footerText');
    }

    function render() {
        const lang = getLang();
        const items = get();
        document.getElementById('totalCount').textContent = items.length;
        document.getElementById('topicCount').textContent = items.filter(i => i.source === 'topic').length;
        document.getElementById('compCount').textContent = items.filter(i => i.source === 'comprehensive').length;
        document.getElementById('dailyCount').textContent = items.filter(i => i.source === 'daily').length;

        const list = document.getElementById('wrongList');
        list.innerHTML = '';
        if (!items.length) {
            list.innerHTML = `<div class="empty"><h3>${t('emptyTitle')}</h3><p>${t('emptyDesc')}</p></div>`;
            return;
        }

        items.slice().reverse().forEach(item => {
            const q = lookupQuestion(item);
            const qText = q ? (lang === 'en' ? (q.questionEn || q.question) : q.question) : item.question;
            const qTopic = q ? (lang === 'en' ? (q.topicEn || q.topic) : q.topic) : item.topic;
            const qExplanation = q ? (lang === 'en' ? (q.explanationEn || q.explanation) : q.explanation) : item.explanation;
            const qAnswer = q
                ? (((lang === 'en' ? q.optionsEn : q.options) || [])[q.answer] || item.answer)
                : item.answer;

            const el = document.createElement('article');
            el.className = 'item';
            el.innerHTML = `
                <h3>${qText}</h3>
                <div class="meta">
                    <span>${t('source')}: ${sourceLabel(item.source)}</span>
                    <span>${t('topic')}: ${qTopic || '--'}</span>
                    <span>${t('answer')}: ${qAnswer || '--'}</span>
                    <span>${t('savedAt')}: ${item.savedAt || '--'}</span>
                </div>
                <p class="explain">${qExplanation || ''}</p>
                <div class="actions"><button class="btn" data-id="${item.id}">${t('remove')}</button></div>
            `;
            el.querySelector('button').onclick = () => {
                const data = get().filter(x => x.id !== item.id);
                set(data);
                render();
            };
            list.appendChild(el);
        });
    }

    document.getElementById('clearBtn').onclick = () => {
        set([]);
        render();
    };

    function applyState() {
        const theme = localStorage.getItem('appTheme') || 'default';
        const fs = localStorage.getItem('appFontSize') || '16';

        document.body.classList.remove('eye-mode', 'night-mode');
        if (theme === 'eye') document.body.classList.add('eye-mode');
        if (theme === 'night') document.body.classList.add('night-mode');
        document.documentElement.style.setProperty('--font-size', fs + 'px');
        document.documentElement.style.fontSize = fs + 'px';

        applyStaticLang();
        render();
        document.documentElement.lang = getLang();
    }

    window.addEventListener('load', () => {
        applyState();
    });

    window.addEventListener('storage', (e) => {
        if (['appLang', 'appTheme', 'appFontSize'].includes(e.key)) applyState();
    });
})();
</script>
</body>
</html>
