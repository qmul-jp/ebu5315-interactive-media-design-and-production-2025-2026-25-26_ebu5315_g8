<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试首页 | 圆几何测试学习中心</title>
    <style>
:root {
    --text: #1f2937;
    --muted: #64748b;
    --primary: #0f5f66;
    --primary-strong: #0a454a;
    --accent: #f4b860;
    --accent-soft: #fff3dc;
    --cyan-soft: #dff5f7;
    --surface: rgba(255, 255, 255, 0.82);
    --surface-strong: #ffffff;
    --line: rgba(15, 23, 42, 0.08);
    --shadow-lg: 0 24px 60px rgba(31, 41, 55, 0.12);
    --shadow-md: 0 16px 32px rgba(31, 41, 55, 0.08);
    --radius-xl: 28px;
    --radius-lg: 22px;
    --radius-md: 16px;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: "Trebuchet MS", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
    color: var(--text);
    background:
        radial-gradient(circle at 12% 10%, rgba(244, 184, 96, 0.2), transparent 22%),
        radial-gradient(circle at 86% 14%, rgba(15, 95, 102, 0.18), transparent 20%),
        linear-gradient(rgba(180, 154, 109, 0.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(180, 154, 109, 0.12) 1px, transparent 1px),
        linear-gradient(180deg, #fffaf0 0%, #f8f1e3 100%);
    background-size: auto, auto, 46px 46px, 46px 46px, auto;
    min-height: 100vh;
    overflow-x: hidden;
}

a {
    color: inherit;
}

.page-shell {
    overflow: hidden;
}

.navbar {
    padding-top: 22px;
}

.nav-container {
    max-width: 1240px;
    margin: 0 auto;
    padding: 0 24px;
    display: grid;
    grid-template-columns: minmax(320px, 520px) 1fr minmax(320px, 520px);
    align-items: center;
    gap: 24px;
    min-height: 88px;
}

.brand-mark {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    text-decoration: none;
    max-width: 520px;
    flex: 0 0 auto;
    grid-column: 1;
    justify-self: start;
}

.brand-badge {
    width: 78px;
    height: 78px;
    display: grid;
    place-items: center;
    border-radius: 24px;
    background: linear-gradient(135deg, var(--primary-strong), var(--primary));
    color: #fff;
    font-size: 1.7rem;
    box-shadow: 0 16px 30px rgba(15, 95, 102, 0.26);
}

.brand-text {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.brand-text strong {
    font-size: clamp(1.75rem, 2.4vw, 2.1rem);
    line-height: 1.1;
    overflow-wrap: anywhere;
}

.brand-text small {
    color: var(--muted);
    font-size: 0.92rem;
    font-weight: 700;
}

.nav-links {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    flex-wrap: wrap;
    grid-column: 2;
    justify-self: center;
    width: max-content;
    max-width: 100%;
}

.nav-link {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 18px 28px;
    border-radius: 999px;
    text-decoration: none;
    color: #6b7280;
    font-size: 1rem;
    font-weight: 700;
    transition: transform 0.22s ease, background-color 0.22s ease, color 0.22s ease, box-shadow 0.22s ease;
}

.nav-link:hover {
    color: var(--text);
    background: rgba(255, 255, 255, 0.66);
    transform: translateY(-1px);
}

.nav-link.active,
.nav-link.current {
    color: #fff;
    background: linear-gradient(135deg, var(--primary-strong), var(--primary));
    box-shadow: 0 14px 28px rgba(15, 95, 102, 0.2);
}

.main-wrapper {
    max-width: 1240px;
    margin: 0 auto;
    padding: 32px 24px 48px;
}

.hero-card {
    display: grid;
    grid-template-columns: 1.15fr 0.85fr;
    gap: 28px;
    padding: 34px;
    border-radius: var(--radius-xl);
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.92), rgba(255, 255, 255, 0.76));
    border: 1px solid rgba(255, 255, 255, 0.72);
    box-shadow: var(--shadow-lg);
    backdrop-filter: blur(10px);
    margin-bottom: 28px;
}

.eyebrow {
    display: inline-flex;
    align-items: center;
    padding: 8px 14px;
    margin-bottom: 18px;
    border-radius: 999px;
    background: rgba(15, 95, 102, 0.08);
    color: var(--primary);
    font-size: 0.88rem;
    font-weight: 700;
    letter-spacing: 0.08em;
}

.hero-copy h1 {
    font-size: clamp(2.3rem, 4vw, 4rem);
    line-height: 1.08;
    margin-bottom: 16px;
    overflow-wrap: anywhere;
}

.hero-description {
    max-width: 60ch;
    color: var(--muted);
    font-size: 1.06rem;
    line-height: 1.85;
    margin-bottom: 0;
}

.hero-visual {
    position: relative;
    min-height: 320px;
    border-radius: 24px;
    background: linear-gradient(160deg, #0e5258, #15717a);
    overflow: hidden;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16);
}

.orbit {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.18);
}

.orbit-large {
    width: 290px;
    height: 290px;
    top: 18px;
    right: 22px;
}

.orbit-small {
    width: 180px;
    height: 180px;
    left: 34px;
    bottom: 26px;
}

.visual-card {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: #fff;
    text-align: center;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow: 0 14px 30px rgba(0, 0, 0, 0.12);
}

.visual-card i {
    font-size: 1.7rem;
}

.visual-card.main {
    width: 170px;
    height: 170px;
    top: 74px;
    left: 108px;
    border-radius: 32px;
}

.visual-card.sub {
    width: 132px;
    height: 96px;
    border-radius: 24px;
}

.visual-card-top {
    top: 34px;
    right: 34px;
}

.visual-card-bottom {
    right: 54px;
    bottom: 34px;
}

.content-grid {
    display: block;
}

.sidebar {
    background: var(--surface);
    border: 1px solid rgba(255, 255, 255, 0.72);
    box-shadow: var(--shadow-md);
    backdrop-filter: blur(10px);
}

.sidebar {
    border-radius: var(--radius-xl);
    padding: 22px;
    align-self: start;
}

.sidebar-header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 20px;
    background: #ffffff;
    position: relative;
    z-index: 1;
}

.sidebar-icon {
    width: 52px;
    height: 52px;
    display: grid;
    place-items: center;
    border-radius: 18px;
    color: #fff;
    background: linear-gradient(135deg, var(--accent), #f29a38);
    box-shadow: 0 14px 28px rgba(244, 184, 96, 0.28);
}

.sidebar-header h2 {
    font-size: 1.3rem;
    margin-bottom: 4px;
    background: #ffffff;
    display: inline-block;
    padding-right: 8px;
}

.sidebar-header p {
    color: var(--muted);
    font-size: 0.92rem;
    background: #ffffff;
    display: inline-block;
    padding-right: 8px;
}

.sidebar-menu {
    list-style: none;
    display: grid;
    gap: 12px;
}

.sidebar-menu a {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 18px;
    border-radius: 18px;
    text-decoration: none;
    background: rgba(255, 255, 255, 0.64);
    transition: transform 0.22s ease, box-shadow 0.22s ease;
}

.sidebar-menu a:hover {
    transform: translateX(4px);
    box-shadow: 0 16px 24px rgba(15, 23, 42, 0.08);
}

.sidebar-menu i {
    width: 20px;
    text-align: center;
    color: var(--primary);
}

.footer {
    max-width: 1240px;
    margin: 0 auto;
    padding: 0 24px 36px;
}

.footer p {
    text-align: center;
    padding: 20px 24px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.56);
    border: 1px solid rgba(255, 255, 255, 0.72);
    color: var(--muted);
}

@supports not ((backdrop-filter: blur(10px)) or (-webkit-backdrop-filter: blur(10px))) {
    .hero-card,
    .sidebar,
    .footer p {
        background: rgba(255, 255, 255, 0.96);
    }
}

@media (max-width: 1080px) {
    .nav-container {
        grid-template-columns: 1fr;
        min-height: 0;
    }

    .brand-mark {
        justify-self: start;
    }

    .nav-links {
        grid-column: auto;
        justify-self: start;
        width: 100%;
    }

    .hero-card {
        grid-template-columns: 1fr;
    }
}

@media (max-width: 920px) {
    .nav-links {
        gap: 12px;
    }

    .nav-link {
        padding: 14px 22px;
    }

    .hero-card {
        padding: 28px;
    }
}

@media (max-width: 760px) {
    .nav-container,
    .main-wrapper,
    .footer {
        padding-left: 16px;
        padding-right: 16px;
    }

    .brand-badge {
        width: 64px;
        height: 64px;
        border-radius: 20px;
    }

    .brand-text strong {
        font-size: 1.45rem;
    }

    .brand-text small {
        font-size: 0.86rem;
    }

    .nav-links {
        display: grid;
        gap: 12px;
        width: 100%;
        justify-self: stretch;
    }

    .nav-link {
        justify-content: center;
    }

    .hero-card,
    .sidebar {
        padding: 22px;
    }

    .hero-copy h1 {
        font-size: clamp(1.9rem, 10vw, 2.6rem);
    }

    .hero-description {
        font-size: 0.98rem;
        line-height: 1.75;
    }

    .hero-visual {
        min-height: 280px;
    }

    .visual-card.main {
        left: 50%;
        top: 76px;
        transform: translateX(-50%);
    }

    .visual-card-top {
        top: 20px;
        right: 18px;
    }

    .visual-card-bottom {
        right: 22px;
        bottom: 22px;
    }
}

@media (max-width: 520px) {
    .navbar {
        padding-top: 72px;
    }

    .brand-mark {
        align-items: flex-start;
    }

    .brand-badge {
        width: 56px;
        height: 56px;
        border-radius: 18px;
        font-size: 1.25rem;
    }

    .sidebar-menu a {
        padding: 14px 15px;
    }

    .visual-card.main {
        width: 144px;
        height: 144px;
    }

    .visual-card.sub {
        width: 116px;
        height: 84px;
    }
}

.sidebar-header h2,
.sidebar-header p,
.sidebar-menu a,
.sidebar-menu a span,
.sidebar-menu a i {
    text-decoration: none !important;
}
</style>
    <style>
.ui-toolbar {
    position: fixed;
    top: 18px;
    right: 24px;
    z-index: 50;
    display: grid;
    gap: 10px;
    justify-items: end;
}

.lang-switcher,
.theme-switcher,
.font-size-control {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    padding: 0.7rem 1rem;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.92);
    border: 1px solid rgba(21, 94, 105, 0.12);
    box-shadow: 0 12px 28px rgba(21, 94, 105, 0.1);
    backdrop-filter: blur(10px);
    width: max-content;
}

.lang-switcher button {
    border: none;
    background: transparent;
    color: #64748b;
    font-size: 0.98rem;
    font-weight: 700;
    cursor: pointer;
    padding: 0;
}

.lang-switcher button.active {
    color: #2563eb;
}

.lang-switcher span {
    color: #64748b;
    font-weight: 700;
}

.theme-switcher,
.font-size-control {
    gap: 0.8rem;
    padding: 0.75rem 1rem;
}

.theme-switcher-label,
.font-size-label {
    color: #0f5f66;
    font-size: 0.92rem;
    font-weight: 700;
    white-space: nowrap;
}

.theme-btn {
    border: none;
    border-radius: 999px;
    padding: 0.45rem 0.85rem;
    background: transparent;
    color: #64748b;
    font-size: 0.92rem;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s ease;
}

.theme-btn.active {
    background: linear-gradient(135deg, #0a454a, #0f5f66);
    color: #fff;
    box-shadow: 0 10px 18px rgba(15, 95, 102, 0.18);
}

.font-size-control input[type="range"] {
    width: 132px;
    accent-color: #0f5f66;
    cursor: pointer;
}

.font-size-value {
    min-width: 42px;
    text-align: right;
    color: #64748b;
    font-size: 0.9rem;
    font-weight: 700;
}

@media (max-width: 760px) {
    .ui-toolbar {
        top: 12px;
        right: 12px;
    }

    .lang-switcher,
    .theme-switcher,
    .font-size-control {
        padding: 0.6rem 0.85rem;
    }

    .lang-switcher button {
        font-size: 0.9rem;
    }

    .theme-switcher,
    .font-size-control {
        gap: 0.6rem;
    }

    .font-size-control input[type="range"] {
        width: 96px;
    }
}

body[data-theme="eye-care"] .ui-toolbar > *,
body[data-theme="night"] .ui-toolbar > * {
    border-color: var(--line);
    background: var(--surface);
    box-shadow: var(--shadow-md);
}

body[data-theme="eye-care"] .lang-switcher button,
body[data-theme="eye-care"] .lang-switcher span,
body[data-theme="eye-care"] .theme-switcher-label,
body[data-theme="eye-care"] .font-size-label,
body[data-theme="eye-care"] .font-size-value,

body[data-theme="night"] .theme-switcher-label,
body[data-theme="night"] .font-size-label,
body[data-theme="night"] .font-size-value {
    color: var(--muted);
}

body[data-theme="eye-care"] .lang-switcher button.active,
body[data-theme="night"] .lang-switcher button.active {

body[data-theme="eye-care"] .theme-btn.active,
body[data-theme="night"] .theme-btn.active {

body[data-theme="eye-care"] .top-nav,
body[data-theme="night"] .top-nav,
body[data-theme="eye-care"] .navbar,
body[data-theme="night"] .navbar {

body[data-theme="eye-care"] .hero-card,
body[data-theme="eye-care"] .sidebar,
body[data-theme="eye-care"] .topic-config-shell,
body[data-theme="eye-care"] .topic-session-shell,
body[data-theme="eye-care"] .topic-result-shell,
body[data-theme="eye-care"] .quiz-session-card,
body[data-theme="eye-care"] .quiz-result-card,

body[data-theme="night"] .sidebar,
body[data-theme="night"] .topic-config-shell,
body[data-theme="night"] .topic-session-shell,
body[data-theme="night"] .topic-result-shell,
body[data-theme="night"] .quiz-session-card,
body[data-theme="night"] .quiz-result-card {

}

body[data-theme="eye-care"] .config-card,
body[data-theme="eye-care"] .question-card,
body[data-theme="eye-care"] .result-detail,
body[data-theme="eye-care"] .result-item,
body[data-theme="eye-care"] .info-card,

body[data-theme="night"] .question-card,
body[data-theme="night"] .result-detail,
body[data-theme="night"] .result-item,
body[data-theme="night"] .info-card {
    background: var(--surface-strong);
    border-color: var(--line);
}

body[data-theme="eye-care"] .nav-link:hover,
body[data-theme="night"] .nav-link:hover,
body[data-theme="eye-care"] .top-nav a,
body[data-theme="night"] .top-nav a,
body[data-theme="eye-care"] .nav-link,
body[data-theme="night"] .nav-link,
body[data-theme="eye-care"] .menu-list a,
body[data-theme="night"] .menu-list a {
    color: var(--muted);
}

body[data-theme="eye-care"] .nav-link.active,
body[data-theme="eye-care"] .nav-link.current,
body[data-theme="eye-care"] .top-nav a:hover,
body[data-theme="eye-care"] .top-nav a.active,
body[data-theme="night"] .nav-link.active,
body[data-theme="night"] .nav-link.current,
body[data-theme="night"] .top-nav a:hover,
body[data-theme="night"] .top-nav a.active {
    background: linear-gradient(135deg, var(--primary-strong), var(--primary));
    color: #fff;
}

body[data-theme="night"] .nav-link:hover,
body[data-theme="night"] .menu-list a:hover,
body[data-theme="night"] .menu-list a.active {
    background: rgba(124, 200, 208, 0.1);

}

body[data-theme="night"] .brand-text small,
body[data-theme="night"] .hero-description,
body[data-theme="night"] .page-intro p:not(.eyebrow),
body[data-theme="night"] .quiz-question-title,

    return Math.max(MIN_FONT_SCALE, Math.min(MAX_FONT_SCALE, value));
  }
  function getTheme() {
    const theme = localStorage.getItem(THEME_KEY) || "eye-care";
    return ["eye-care", "night"].includes(theme) ? theme : "eye-care";

  function qs(selector) { return document.querySelector(selector); }

  function setText(selector, text) {
    const node = typeof selector === "string" ? qs(selector) : selector;
    if (node && typeof text === "string") node.textContent = text;
  }
  function setMany(selector, values) {
    qsa(selector).forEach((node, index) => {
      if (typeof values[index] === "string") node.textContent = values[index];
    });
  }

      </div>

        <span class="font-size-value">${Math.round(scale * 100)}%</span>
      </label>
    `;
    toolbar.querySelectorAll(".lang-btn").forEach((button) => {
      button.addEventListener("click", () => setLang(button.dataset.lang));
    });
    toolbar.querySelectorAll(".theme-btn").forEach((button) => {
      button.addEventListener("click", () => setTheme(button.dataset.theme));
    });
    toolbar.querySelector("#fontScaleRange").addEventListener("input", (event) => {
      localStorage.setItem(FONT_KEY, event.target.value);
      applyFontScale();
    });
    document.body.prepend(toolbar);
  }

  function setLang(lang) {
    localStorage.setItem(LANG_KEY, lang);
    buildToolbar();
    applyLanguage();
    window.dispatchEvent(new CustomEvent("g8-language-change", { detail: { lang } }));
  }

  function applyTheme() {
    const theme = getTheme();
    document.body.dataset.theme = theme;
    document.documentElement.style.colorScheme = theme === "night" ? "dark" : "light";
    qsa(".theme-btn").forEach((button) => {
      button.classList.toggle("active", button.dataset.theme === theme);
    });
  }

  function setTheme(theme) {
    localStorage.setItem(THEME_KEY, theme);
    applyTheme();
    buildToolbar();
    window.dispatchEvent(new CustomEvent("g8-theme-change", { detail: { theme } }));
  }

  function applyFontScale() {
    const scale = getFontScale();
    document.documentElement.style.fontSize = `${scale * 100}%`;
    setText(".font-size-value", `${Math.round(scale * 100)}%`);
    const input = qs("#fontScaleRange");
    if (input) input.value = String(scale);
  }

  function parsePracticeTitle(value, lang) {
    const match = String(value || "").match(/^(.*) - (.*) - (\d+)/);
    if (!match) return value;
    if (lang === "zh") return `${match[1]} - ${match[2]} - ${match[3]} 题`;
    return `${match[1]} - ${match[2]} - ${match[3]} Questions`;
  }

    applySidebar(p.sidebar);
    setText("#topicConfigShell .eyebrow", mode === "topic-practice" ? p.topicSetupEyebrow : p.comprehensiveSetupEyebrow);

    setText(".config-card:nth-of-type(1) h2", mode === "topic-practice" ? p.card1Topic : p.card1Comprehensive);
    setText(".config-card:nth-of-type(1) .config-card-header p", mode === "topic-practice" ? p.card1TopicText : p.card1ComprehensiveText);
    setText(".config-card:nth-of-type(2) h2", p.card2);
    setText(".config-card:nth-of-type(2) .config-card-header p", mode === "topic-practice" ? p.card2TopicText : p.card2ComprehensiveText);
    setText(".config-card:nth-of-type(3) h2", p.card3);
    setText(".config-card:nth-of-type(3) .config-card-header p", p.card3Text);

    setText(".summary-item:nth-of-type(1) .summary-label", mode === "topic-practice" ? p.summaryTopic : p.summaryRange);
    setText(".summary-item:nth-of-type(2) .summary-label", p.summaryDifficulty);
    setText(".summary-item:nth-of-type(3) .summary-label", p.summaryAmount);
    setText("#startPracticeBtn span", p.start);
    setText(".session-title-group .eyebrow", p.progressEyebrow);
    setText("#backConfigBtn span", p.backConfig);
    setText("#resetPracticeBtn span", p.reset);
    setText(".question-footer .meta-item:nth-of-type(1) .meta-label", mode === "topic-practice" ? p.questionMetaTopic : p.questionMetaRange);
    setText(".question-footer .meta-item:nth-of-type(2) .meta-label", p.questionMetaDifficulty);
    setText("#submitAnswerBtn", p.submit);
    setText("#redoQuestionBtn", p.redo);
    setText("#showAiExplainBtn", p.ai);
    setText("#viewWrongBtn", p.wrong);
    setText(".result-intro .eyebrow", p.resultEyebrow);
    setText(".result-intro h1", mode === "topic-practice" ? p.topicResultTitle : p.comprehensiveResultTitle);
    setText("#resultSubtitle", p.resultSubtitle);
    setText(".result-card:nth-of-type(1) .result-label", p.score);
    setText(".result-card:nth-of-type(2) .result-label", p.accuracy);
    setText(".result-card:nth-of-type(3) .result-label", p.correct);
    setText(".result-card:nth-of-type(4) .result-label", p.wrongCount);
    setText(".result-panel:nth-of-type(1) h3", p.wrongList);
    setText(".result-panel:nth-of-type(2) h3", p.aiSummary);
    setText("#redoWrongBtn", p.redoWrong);
    setText("#backTopicHomeBtn", mode === "topic-practice" ? p.backTopicHome : p.backComprehensiveHome);
    setText("#aiModal h3", p.aiModal);
    setText("#closeAiModalBtn", p.close);
    setText("#closeWrongDrawerBtn", p.close);
    setText("#wrongDrawer h3", mode === "topic-practice" ? p.wrongTopicTitle : p.wrongComprehensiveTitle);
    applyFooter(t);

    Object.entries(p.topicLabels).forEach(([value, label]) => {
      qsa(`[data-value="${value}"]`).forEach((node) => {
        if (node.closest("#topicChoices") || node.dataset.group === "topic") node.textContent = label;
      });
    });

    Object.entries(p.difficultyLabels).forEach(([value, label]) => {
      const node = qs(`#difficultyChoices [data-value="${value}"]`);
      if (node) node.textContent = label;
    });

    const sessionTitle = qs("#sessionTitle");
    if (sessionTitle) sessionTitle.textContent = parsePracticeTitle(sessionTitle.textContent, lang);
    const progressText = qs("#progressText");
    if (progressText) {
      const match = progressText.textContent.match(/(\d+)\/(\d+)/);
      if (match) progressText.textContent = lang === "zh" ? `第 ${match[1]}/${match[2]} 题` : `${match[1]}/${match[2]}`;
    }
    const questionBadge = qs("#questionBadge");
    if (questionBadge) {
      const match = questionBadge.textContent.match(/(\d+)/);
      if (match) questionBadge.textContent = lang === "zh" ? `第 ${match[1]} 题` : `Question ${match[1]}`;
    }

    const topicMap = {
      "圆基础": p.topicLabels["circle-basics"],
      "圆心角与圆周角": p.topicLabels.angles,
      "切线性质": p.topicLabels.tangent,

      if (!node) return;
      const key = node.textContent.trim();
      if (topicMap[key]) node.textContent = topicMap[key];
    });

    const difficultyMap = {
      "基础": p.difficultyLabels.basic,
      "进阶": p.difficultyLabels.intermediate,
      "提高": p.difficultyLabels.advanced,
      "Basic": p.difficultyLabels.basic,
      "Intermediate": p.difficultyLabels.intermediate,
      "Advanced": p.difficultyLabels.advanced
    };
    const metaDifficulty = qs("#metaDifficulty");
    if (metaDifficulty && difficultyMap[metaDifficulty.textContent.trim()]) {
      metaDifficulty.textContent = difficultyMap[metaDifficulty.textContent.trim()];
    }
  }

  function applyDaily(lang) {

    if (streak) {
      const num = streak.textContent.match(/\d+/)?.[0] || "0";

    setText(".rules-card h2", d.rulesTitle);
    setMany(".rules-list li", d.rules);
    setText("#startDailyBtn span", d.start);
    setText(".start-tip", d.startTip);
    applyFooter(t);
  }

  function replaceCommonText(lang) {
    const map = commonMap[lang];
    qsa("button, a, span, strong, h1, h2, h3, p, label, li").forEach((node) => {
      const text = node.textContent.trim();
      if (map[text]) node.textContent = map[text];
    });
  }

  let applying = false;
  let observer;

  function applyLanguage() {
    if (applying) return;
    applying = true;
    const lang = getLang();
    document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
    const page = pageKey();
    if (page === "usage-guide") applyGuide(lang);
    else if (page === "topic-practice") applyPractice(lang, "topic-practice");
    else if (page === "comprehensive-practice") applyPractice(lang, "comprehensive-practice");
    else if (page === "daily-checkin") applyDaily(lang);
    else if (page === "daily-quiz") applyQuiz(lang);
    else applyHome(lang);
    replaceCommonText(lang);
    buildToolbar();
    applyFontScale();
    applying = false;
  }

  function setupObserver() {
    if (observer) observer.disconnect();
    observer = new MutationObserver(() => {
      if (!applying) window.requestAnimationFrame(applyLanguage);
    });
    observer.observe(document.body, { childList: true, subtree: true, characterData: true });
  }

  document.addEventListener("DOMContentLoaded", () => {
    buildToolbar();
    applyTheme();
    applyFontScale();
    applyLanguage();
    setupObserver();
  });

  window.G8I18n = { getLang, setLang, applyLanguage, getFontScale, applyFontScale, getTheme, setTheme, applyTheme };
