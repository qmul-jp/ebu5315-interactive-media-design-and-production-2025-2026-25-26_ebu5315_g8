<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试首页 | 圆几何测试学习中心</title>
    <style>
:root {
    --text: #1f2937;
    --muted: #64748b;
    --primary: #2563eb;
    --primary-strong: #1d4ed8;
    --accent: #f4b860;
    --accent-soft: #fff3dc;
    --cyan-soft: #dbeafe;
    --surface: rgba(255, 255, 255, 0.82);
    --surface-strong: #ffffff;
    --line: rgba(15, 23, 42, 0.08);
    --shadow-lg: 0 24px 60px rgba(31, 41, 55, 0.12);
    --shadow-md: 0 16px 32px rgba(31, 41, 55, 0.08);
    --radius-xl: 28px;
    --radius-lg: 22px;
    --radius-md: 16px;
    --font-size: 16px;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: "Trebuchet MS", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
    color: var(--text);
    font-size: var(--font-size);
    background:
        radial-gradient(circle at 12% 10%, rgba(37, 99, 235, 0.1), transparent 22%),
        radial-gradient(circle at 86% 14%, rgba(37, 99, 235, 0.1), transparent 20%),
        linear-gradient(rgba(180, 154, 109, 0.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(180, 154, 109, 0.12) 1px, transparent 1px),
        linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
    background-size: auto, auto, 46px 46px, 46px 46px, auto;
    min-height: 100vh;
    overflow-x: hidden;
    transition: all 0.3s ease-in-out;
}

/* 模式切换：护眼/夜晚，修改CSS变量 */
body.eye-mode {
    --bg-color: #f0f9eb;
    --surface: rgba(247, 251, 242, 0.88);
    --text: #166534;
    --line: #c7e3b4;
    --primary: #438a4c;
    --primary-strong: #3f6234;
}
body.night-mode {
    --text: #f1f5f9;
    --muted: #94a3b8;
    --primary: #60a5fa;
    --primary-strong: #3b82f6;
    --surface: rgba(30, 41, 59, 0.88);
    --surface-strong: #1e293b;
    --line: #475569;
}

a {
    color: inherit;
    text-decoration: none;
}

.page-shell {
    overflow: hidden;
}

.navbar {
    padding-top: 22px;
}

.nav-container {
    max-width: 1240px;
    margin: 0 auto;
    padding: 0 24px;
    display: grid;
    grid-template-columns: minmax(320px, 520px) 1fr minmax(320px, 520px);
    align-items: center;
    gap: 24px;
    min-height: 88px;
}

.brand-mark {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    text-decoration: none;
    max-width: 520px;
    flex: 0 0 auto;
    grid-column: 1;
    justify-self: start;
}

.brand-badge {
    width: 78px;
    height: 78px;
    display: grid;
    place-items: center;
    border-radius: 24px;
    background: linear-gradient(135deg, var(--primary-strong), var(--primary));
    color: #fff;
    font-size: 1.7rem;
    box-shadow: 0 16px 30px rgba(15, 95, 102, 0.26);
}

.brand-text {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.brand-text strong {
    font-size: clamp(1.75rem, 2.4vw, 2.1rem);
    line-height: 1.1;
    overflow-wrap: anywhere;
}

.brand-text small {
    color: var(--muted);
    font-size: 0.92rem;
    font-weight: 700;
}

.nav-links {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    flex-wrap: wrap;
    grid-column: 2;
    justify-self: center;
    width: max-content;
    max-width: 100%;
}

.nav-link {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 18px 28px;
    border-radius: 999px;
    text-decoration: none;
    color: #6b7280;
    font-size: 1rem;
    font-weight: 700;
    transition: transform 0.22s ease, background-color 0.22s ease, color 0.22s ease, box-shadow 0.22s ease;
}

.nav-link:hover {
    color: var(--text);
    background: rgba(255, 255, 255, 0.66);
    transform: translateY(-1px);
}

.nav-link.active,
.nav-link.current {
    color: #fff;
    background: linear-gradient(135deg, var(--primary-strong), var(--primary));
    box-shadow: 0 14px 28px rgba(15, 95, 102, 0.2);
}

.main-wrapper {
    max-width: 1240px;
    margin: 0 auto;
    padding: 32px 24px 48px;
}

.hero-card {
    display: grid;
    grid-template-columns: 1.15fr 0.85fr;
    gap: 28px;
    padding: 34px;
    border-radius: var(--radius-xl);
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.92), rgba(255, 255, 255, 0.76));
    border: 1px solid rgba(255, 255, 255, 0.72);
    box-shadow: var(--shadow-lg);
    backdrop-filter: blur(10px);
    margin-bottom: 28px;
}

.eyebrow {
    display: inline-flex;
    align-items: center;
    padding: 8px 14px;
    margin-bottom: 18px;
    border-radius: 999px;
    background: rgba(15, 95, 102, 0.08);
    color: var(--primary);
    font-size: 0.88rem;
    font-weight: 700;
    letter-spacing: 0.08em;
}

.hero-copy h1 {
    font-size: clamp(2.3rem, 4vw, 4rem);
    line-height: 1.08;
    margin-bottom: 16px;
    overflow-wrap: anywhere;
}

.hero-description {
    max-width: 60ch;
    color: var(--muted);
    font-size: 1.06rem;
    line-height: 1.85;
    margin-bottom: 0;
}

.hero-visual {
    position: relative;
    min-height: 320px;
    border-radius: 24px;
    background: linear-gradient(160deg, #0e5258, #15717a);
    overflow: hidden;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16);
}

.orbit {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.18);
}

.orbit-large {
    width: 290px;
    height: 290px;
    top: 18px;
    right: 22px;
}

.orbit-small {
    width: 180px;
    height: 180px;
    left: 34px;
    bottom: 26px;
}

.visual-card {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: #fff;
    text-align: center;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow: 0 14px 30px rgba(0, 0, 0, 0.12);
}

.visual-card i {
    font-size: 1.7rem;
}

.visual-card.main {
    width: 170px;
    height: 170px;
    top: 74px;
    left: 108px;
    border-radius: 32px;
}

.visual-card.sub {
    width: 132px;
    height: 96px;
    border-radius: 24px;
}

.visual-card-top {
    top: 34px;
    right: 34px;
}

.visual-card-bottom {
    right: 54px;
    bottom: 34px;
}

.content-grid {
    display: block;
}

.sidebar {
    background: var(--surface);
    border: 1px solid rgba(255, 255, 255, 0.72);
    box-shadow: var(--shadow-md);
    backdrop-filter: blur(10px);
}

.sidebar {
    border-radius: var(--radius-xl);
    padding: 22px;
    align-self: start;
}

.sidebar-header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 20px;
    background: #ffffff;
    position: relative;
    z-index: 1;
}

.sidebar-icon {
    width: 52px;
    height: 52px;
    display: grid;
    place-items: center;
    border-radius: 18px;
    color: #fff;
    background: linear-gradient(135deg, var(--accent), #f29a38);
    box-shadow: 0 14px 28px rgba(244, 184, 96, 0.28);
}

.sidebar-header h2 {
    font-size: 1.3rem;
    margin-bottom: 4px;
    background: #ffffff;
    display: inline-block;
    padding-right: 8px;
}

.sidebar-header p {
    color: var(--muted);
    font-size: 0.92rem;
    background: #ffffff;
    display: inline-block;
    padding-right: 8px;
}

.sidebar-menu {
    list-style: none;
    display: grid;
    gap: 12px;
}

.sidebar-menu a {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 18px;
    border-radius: 18px;
    text-decoration: none;
    background: rgba(255, 255, 255, 0.64);
    transition: transform 0.22s ease, box-shadow 0.22s ease;
}

.sidebar-menu a:hover {
    transform: translateX(4px);
    box-shadow: 0 16px 24px rgba(15, 23, 42, 0.08);
}

.sidebar-menu i {
    width: 20px;
    text-align: center;
    color: var(--primary);
}

.footer {
    max-width: 1240px;
    margin: 0 auto;
    padding: 0 24px 36px;
}

.footer p {
    text-align: center;
    padding: 20px 24px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.56);
    border: 1px solid rgba(255, 255, 255, 0.72);
    color: var(--muted);
}

@supports not ((backdrop-filter: blur(10px)) or (-webkit-backdrop-filter: blur(10px))) {
    .hero-card,
    .sidebar,
    .footer p {
        background: rgba(255, 255, 255, 0.96);
    }
}

@media (max-width: 1080px) {
    .nav-container {
        grid-template-columns: 1fr;
        min-height: 0;
    }

    .brand-mark {
        justify-self: start;
    }

    .nav-links {
        grid-column: auto;
        justify-self: start;
        width: 100%;
    }

    .hero-card {
        grid-template-columns: 1fr;
    }
}

@media (max-width: 920px) {
    .nav-links {
        gap: 12px;
    }

    .nav-link {
        padding: 14px 22px;
    }

    .hero-card {
        padding: 28px;
    }
}

@media (max-width: 760px) {
    .nav-container,
    .main-wrapper,
    .footer {
        padding-left: 16px;
        padding-right: 16px;
    }

    .brand-badge {
        width: 64px;
        height: 64px;
        border-radius: 20px;
    }

    .brand-text strong {
        font-size: 1.45rem;
    }

    .brand-text small {
        font-size: 0.86rem;
    }

    .nav-links {
        display: grid;
        gap: 12px;
        width: 100%;
        justify-self: stretch;
    }

    .nav-link {
        justify-content: center;
    }

    .hero-card,
    .sidebar {
        padding: 22px;
    }

    .hero-copy h1 {
        font-size: clamp(1.9rem, 10vw, 2.6rem);
    }

    .hero-description {
        font-size: 0.98rem;
        line-height: 1.75;
    }

    .hero-visual {
        min-height: 280px;
    }

    .visual-card.main {
        left: 50%;
        top: 76px;
        transform: translateX(-50%);
    }

    .visual-card-top {
        top: 20px;
        right: 18px;
    }

    .visual-card-bottom {
        right: 22px;
        bottom: 22px;
    }
}

@media (max-width: 520px) {
    .navbar {
        padding-top: 72px;
    }

    .brand-mark {
        align-items: flex-start;
    }

    .brand-badge {
        width: 56px;
        height: 56px;
        border-radius: 18px;
        font-size: 1.25rem;
    }

    .sidebar-menu a {
        padding: 14px 15px;
    }

    .visual-card.main {
        width: 144px;
        height: 144px;
    }

    .visual-card.sub {
        width: 116px;
        height: 84px;
    }
}

.sidebar-header h2,
.sidebar-header p,
.sidebar-menu a,
.sidebar-menu a span,
.sidebar-menu a i {
    text-decoration: none !important;
}
</style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="page-shell">
        <nav class="navbar">
            <div class="nav-container">
                <a href="index.html" class="brand-mark">
                    <span class="brand-badge"><i class="fas fa-compass"></i></span>
                    <span class="brand-text">
                        <strong id="logoText">圆几何测试中心</strong>
                        <small id="logoSubText">Circle Geometry Lab</small>
                    </span>
                </a>
                <div class="nav-links">
                    <a href="index.html" class="nav-link"><i class="fas fa-home"></i><span id="navHome">首页</span></a>
                    <a href="game.html" class="nav-link"><i class="fas fa-gamepad"></i><span id="navGame">游戏</span></a>
                    <a href="home.html" class="nav-link active"><i class="fas fa-clipboard-check"></i><span id="navQuiz">测试</span></a>
                </div>
            </div>
        </nav>

        <main class="main-wrapper">
            <section class="hero-card">
                <div class="hero-copy">
                    <p class="eyebrow" id="heroEyebrow">Circle Geometry Learning Hub</p>
                    <h1 id="heroTitle">圆几何测试学习中心</h1>
                    <p class="hero-description" id="heroDesc">
                        通过专题练习、综合训练与每日一题巩固圆几何知识，用更清晰的视觉分区、卡片化结构和重点强调提升使用体验。
                    </p>
                </div>

                <div class="hero-visual" aria-hidden="true">
                    <div class="orbit orbit-large"></div>
                    <div class="orbit orbit-small"></div>
                    <div class="visual-card main">
                        <i class="fas fa-drafting-compass"></i>
                        <span id="visualMain">几何图形</span>
                    </div>
                    <div class="visual-card sub visual-card-top">
                        <i class="fas fa-lightbulb"></i>
                        <span id="visualTop">解题思路</span>
                    </div>
                    <div class="visual-card sub visual-card-bottom">
                        <i class="fas fa-chart-line"></i>
                        <span id="visualBottom">训练反馈</span>
                    </div>
                </div>
            </section>

            <div class="content-grid">
                <aside class="sidebar">
                    <div class="sidebar-header">
                        <span class="sidebar-icon"><i class="fas fa-book-open"></i></span>
                        <div>
                            <h2 id="sidebarTitle">测试中心</h2>
                            <p id="sidebarDesc">选择你想进入的学习模式</p>
                        </div>
                    </div>

                    <ul class="sidebar-menu">
                        <li>
                            <a href="test-prep.html">
                                <i class="fas fa-book-reader"></i>
                                <span id="menuGuide">使用教程</span>
                            </a>
                        </li>
                        <li>
                            <a href="test-topic.html">
                                <i class="fas fa-layer-group"></i>
                                <span id="menuTopic">专题练习</span>
                            </a>
                        </li>
                        <li>
                            <a href="test-comprehensive.html">
                                <i class="fas fa-project-diagram"></i>
                                <span id="menuComp">综合练习</span>
                            </a>
                        </li>
                        <li>
                            <a href="daily.html">
                                <i class="fas fa-calendar-day"></i>
                                <span id="menuDaily">每日一题</span>
                            </a>
                        </li>
                    </ul>
                </aside>
            </div>
        </main>

        <footer class="footer">
            <p id="footerText">圆几何互动学习网站 © 2026 EBU5315 Coursework</p>
        </footer>
    </div>

    <script>
        const langTexts = {
            'zh-CN': {
                logoText: '圆几何测试中心',
                logoSubText: '圆几何学习实验室',
                navHome: '首页',
                navGame: '游戏',
                navQuiz: '测试',
                heroEyebrow: 'Circle Geometry Learning Hub',
                heroTitle: '圆几何测试学习中心',
                heroDesc: '通过专题练习、综合训练与每日一题巩固圆几何知识，用更清晰的视觉分区、卡片化结构和重点强调提升使用体验。',
                visualMain: '几何图形',
                visualTop: '解题思路',
                visualBottom: '训练反馈',
                sidebarTitle: '测试中心',
                sidebarDesc: '选择你想进入的学习模式',
                menuGuide: '使用教程',
                menuTopic: '专题练习',
                menuComp: '综合练习',
                menuDaily: '每日一题',
                footerText: '圆几何互动学习网站 © 2026 EBU5315 Coursework'
            },
            'en': {
                logoText: 'Circle Geometry Lab',
                logoSubText: 'Geometry Learning Lab',
                navHome: 'Home',
                navGame: 'Game',
                navQuiz: 'Test',
                heroEyebrow: 'Circle Geometry Learning Hub',
                heroTitle: 'Learning Hub',
                heroDesc: 'Consolidate circle geometry knowledge through topic practice, comprehensive training and daily questions.',
                visualMain: 'Geometry',
                visualTop: 'Ideas',
                visualBottom: 'Feedback',
                sidebarTitle: 'Learning Center',
                sidebarDesc: 'Choose your learning mode',
                menuGuide: 'User Guide',
                menuTopic: 'Topic Practice',
                menuComp: 'Mixed Practice',
                menuDaily: 'Daily Quiz',
                footerText: 'Circle Geometry Learning © 2026 EBU5315 Coursework'
            }
        };

        function applyState() {
            const lang = localStorage.getItem('appLang') || 'zh-CN';
            const theme = localStorage.getItem('appTheme') || 'default';
            const fontSize = localStorage.getItem('appFontSize') || '16';
            
            // 应用语言
            const texts = langTexts[lang] || langTexts['zh-CN'];
            document.getElementById('logoText').textContent = texts.logoText;
            document.getElementById('logoSubText').textContent = texts.logoSubText;
            document.getElementById('navHome').textContent = texts.navHome;
            document.getElementById('navGame').textContent = texts.navGame;
            document.getElementById('navQuiz').textContent = texts.navQuiz;
            document.getElementById('heroEyebrow').textContent = texts.heroEyebrow;
            document.getElementById('heroTitle').textContent = texts.heroTitle;
            document.getElementById('heroDesc').textContent = texts.heroDesc;
            document.getElementById('visualMain').textContent = texts.visualMain;
            document.getElementById('visualTop').textContent = texts.visualTop;
            document.getElementById('visualBottom').textContent = texts.visualBottom;
            document.getElementById('sidebarTitle').textContent = texts.sidebarTitle;
            document.getElementById('sidebarDesc').textContent = texts.sidebarDesc;
            document.getElementById('menuGuide').textContent = texts.menuGuide;
            document.getElementById('menuTopic').textContent = texts.menuTopic;
            document.getElementById('menuComp').textContent = texts.menuComp;
            document.getElementById('menuDaily').textContent = texts.menuDaily;
            document.getElementById('footerText').textContent = texts.footerText;
            document.documentElement.lang = lang;

            // 应用主题
            document.body.classList.remove('eye-mode', 'night-mode');
            if (theme === 'eye') document.body.classList.add('eye-mode');
            if (theme === 'night') document.body.classList.add('night-mode');

            // 应用字体
            document.documentElement.style.setProperty('--font-size', fontSize + 'px');
        }

        window.addEventListener('load', applyState);
        window.addEventListener('storage', (e) => {
            if (['appLang', 'appTheme', 'appFontSize'].includes(e.key)) {
                applyState();
            }
        });
    </script>
</body>
</html>
