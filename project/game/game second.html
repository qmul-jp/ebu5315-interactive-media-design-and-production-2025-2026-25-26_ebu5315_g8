<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>圆几何交互式学习平台 - 切线判定闯关</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 全局样式重置 - 完全对齐 index.html */
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: "Trebuchet MS", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
        }

        :root {
            --primary: #2563eb;
            --primary-strong: #1d4ed8;
            --text: #1f2937;
            --muted: #64748b;
            --bg-color: #f8fafc;
            --surface: rgba(255, 255, 255, 0.85);
            --surface-strong: #ffffff;
            --border-color: #e2e8f0;
            --shadow-lg: 0 24px 60px rgba(31, 41, 55, 0.12);
            --shadow-md: 0 16px 32px rgba(31, 41, 55, 0.08);
            --radius-xl: 28px;
            --radius-lg: 22px;
            --radius-md: 16px;
            --font-size: 16px;
        }

        body {
            color: var(--text); font-size: var(--font-size);
            background:
                radial-gradient(circle at 12% 10%, rgba(37, 99, 235, 0.1), transparent 22%),
                radial-gradient(circle at 86% 14%, rgba(37, 99, 235, 0.1), transparent 20%),
                linear-gradient(rgba(180, 154, 109, 0.12) 1px, transparent 1px),
                linear-gradient(90deg, rgba(180, 154, 109, 0.12) 1px, transparent 1px),
                linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
            background-size: auto, auto, 46px 46px, 46px 46px, auto;
            background-attachment: fixed;
            min-height: 100vh; overflow-x: hidden; transition: all 0.3s ease-in-out; line-height: 1.6;
        }

        body.eye-mode {
            --bg-color: #f0f9eb; --surface: rgba(247, 251, 242, 0.88);
            --text: #166534; --border-color: #c7e3b4; --primary: #438a4c; --primary-strong: #3f6234;
        }
        body.night-mode {
            --text: #f1f5f9; --muted: #94a3b8; --primary: #60a5fa; --primary-strong: #3b82f6;
            --surface: rgba(30, 41, 59, 0.88); --surface-strong: #1e293b; --border-color: #475569;
        }

        /* 头部导航 - 复用 index.html */
        .header-container {
            position: fixed; top: 0; left: 0; z-index: 9999; width: 100%; height: 80px; padding: 0 4vw;
            background: var(--surface); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow-md);
        }
        .logo { font-size: clamp(1.2rem, 2.5vw, 1.6rem); font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        .nav-main { display: flex; gap: 2.5vw; background: rgba(15, 23, 42, 0.04); padding: 6px; border-radius: 100px; }
        .nav-link { font-size: 0.95rem; color: var(--muted); font-weight: 600; padding: 8px 24px; border-radius: 100px; text-decoration: none; transition: 0.3s; }
        .nav-link:hover { color: var(--primary); background: rgba(255, 255, 255, 0.8); }
        .nav-link.active { color: white; background: var(--primary); box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }

        /* 游戏主体容器 */
        .main-container {
            width: 100%; max-width: 900px; margin: 0 auto; padding: 120px 4vw 60px;
            display: flex; flex-direction: column; gap: 25px; align-items: center;
        }
        .breadcrumb { width: 100%; font-size: 0.9rem; color: var(--muted); }
        .breadcrumb a { color: var(--primary); font-weight: 600; text-decoration: none; }

        .game-card-main {
            width: 100%; background: var(--surface); backdrop-filter: blur(12px);
            border: 1px solid var(--border-color); border-radius: var(--radius-xl);
            padding: 40px; box-shadow: var(--shadow-lg); text-align: center;
        }

        .game-info {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid var(--border-color);
        }
        .info-item { font-size: 1.2rem; font-weight: 700; }
        .info-item span { color: var(--primary); }

        .canvas-display {
            width: 260px; height: 260px; margin: 0 auto 30px; border: 3px solid var(--primary);
            border-radius: 20px; background: var(--surface-strong);
            display: flex; justify-content: center; align-items: center; box-shadow: var(--shadow-md);
        }
        #gameCanvas { width: 240px; height: 240px; }

        .options-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin: 30px 0; }
        .option-btn {
            padding: 18px 10px; background: var(--surface-strong); border: 2px solid var(--border-color);
            border-radius: var(--radius-md); font-size: 1.2rem; font-weight: 700; cursor: pointer; transition: all 0.3s;
        }
        .option-btn:hover { border-color: var(--primary); transform: translateY(-3px); box-shadow: var(--shadow-md); }
        .option-btn.correct { background: #dcfce7; border-color: #22c55e; color: #166534; }
        .option-btn.wrong { background: #fee2e2; border-color: #ef4444; color: #991b1b; }

        .btn-action {
            padding: 12px 35px; background: var(--primary); color: white; border: none;
            border-radius: 100px; font-weight: 700; font-size: 1.1rem; cursor: pointer; transition: all 0.3s;
        }
        .btn-action:hover { background: var(--primary-strong); transform: scale(1.05); }

        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(8px); z-index: 10000;
            justify-content: center; align-items: center;
        }
        .modal-content {
            background: var(--surface-strong); padding: 40px; border-radius: var(--radius-xl);
            max-width: 400px; width: 90%; text-align: center; box-shadow: var(--shadow-lg);
        }

        @media (max-width: 768px) {
            .header-container { padding: 0 20px; height: 70px; }
            .nav-main { display: none; }
            .options-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header class="header-container">
        <div class="logo" id="logoText">圆几何交互式学习平台</div>
        <nav class="nav-main">
            <a href="index.html" class="nav-link" id="navHome">首页</a>
            <a href="game.html" class="nav-link active" id="navGame">游戏</a>
            <a href="home.html" class="nav-link" id="navQuiz">测试</a>
        </nav>
        <div class="header-right">
            <div class="lang-switch">
                <a href="javascript:;" class="lang-link active" data-lang="zh-CN" id="langZh">简体中文</a>
                <span>/</span>
                <a href="javascript:;" class="lang-link" data-lang="en" id="langEn">English</a>
            </div>
        </div>
    </header>

    <main class="main-container">
        <div class="breadcrumb">
            <a href="index.html" id="breadHome">首页</a> › <a href="game.html" id="breadGame">游戏中心</a> › <span id="breadCurrent">切线判定闯关</span>
        </div>

        <div class="game-card-main">
            <h2 id="gameTitle" style="font-size: 2rem; margin-bottom: 10px;">切线判定闯关</h2>
            <p id="gameTip" style="color: var(--muted); margin-bottom: 30px;">判断直线与圆的位置关系！（相切/相交/相离）</p>

            <div class="game-info">
                <div class="info-item"><span id="scoreLabel">分数:</span> <span id="score">0</span></div>
                <div class="info-item"><span id="timeLabel">时间:</span> <span id="time">10</span> <span id="timeUnit">秒</span></div>
            </div>

            <div class="canvas-display">
                <canvas id="gameCanvas"></canvas>
            </div>

            <h3 id="chooseText" style="margin-bottom: 25px; font-weight: 800;">选择直线与圆的位置关系</h3>
            <div class="options-grid" id="optionContainer"></div>

            <div style="display: flex; gap: 20px; justify-content: center;">
                <button class="btn-action" id="startBtn">开始游戏</button>
                <button class="btn-action" onclick="window.location.href='game.html'" id="backToGameCenter" style="background: var(--muted);">返回游戏中心</button>
            </div>
        </div>
    </main>

    <div class="modal-overlay" id="gameOverModal">
        <div class="modal-content">
            <h3 id="gameOverTitle" style="font-size: 1.8rem; color: var(--primary); margin-bottom: 20px;">游戏结束！</h3>
            <p style="font-size: 1.2rem; margin-bottom: 10px;"><span id="finalScoreText">最终分数:</span> <span id="finalScore" style="font-weight: 800; color: var(--primary);">0</span></p>
            <p id="questionCountText" style="margin-bottom: 30px;">总题目数: 0 / 10</p>
            <div style="display: flex; flex-direction: column; gap: 12px;">
                <button class="btn-action" onclick="startGame()">重新开始</button>
                <button class="btn-action" onclick="window.location.href='index.html'" id="backToHomeBtn" style="background: var(--muted);">返回首页</button>
            </div>
        </div>
    </div>

    <script>
        const langTexts = {
            'zh-CN': {
                logoText: '圆几何交互式学习平台', navHome: '首页', navGame: '游戏', navQuiz: '测试',
                langZh: '简体中文', langEn: 'English', breadHome: '首页', breadGame: '游戏中心',
                breadCurrent: '切线判定闯关', gameTitle: '切线判定闯关',
                gameTip: '判断直线与圆的位置关系！（相切/相交/相离）',
                scoreLabel: '分数:', timeLabel: '时间:', timeUnit: '秒', chooseText: '选择直线与圆的位置关系',
                startBtn: '开始游戏', backToGameCenter: '返回游戏中心', gameOverTitle: '游戏结束！',
                finalScoreText: '最终分数:', backToHomeBtn: '返回首页',
                tangent: '相切', intersecting: '相交', separate: '相离'
            },
            'en': {
                logoText: 'Circle Geometry Platform', navHome: 'Home', navGame: 'Game', navQuiz: 'Quiz',
                langZh: 'ZH', langEn: 'EN', breadHome: 'Home', breadGame: 'Game Center',
                breadCurrent: 'Tangent Challenge', gameTitle: 'Tangent Judgment',
                gameTip: 'Judge the relationship between line and circle!',
                scoreLabel: 'Score:', timeLabel: 'Time:', timeUnit: 's', chooseText: 'Choose the relationship',
                startBtn: 'Start Game', backToGameCenter: 'Game Center', gameOverTitle: 'Game Over!',
                finalScoreText: 'Final Score:', backToHomeBtn: 'Home',
                tangent: 'Tangent', intersecting: 'Intersecting', separate: 'Separate'
            }
        };

        let score = 0, timeLeft = 10, timer = null, isGameRunning = false, currentQuestion = 0, currentRelationship = '';
        const totalQuestions = 10;
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function applyState() {
            const lang = localStorage.getItem('appLang') || 'zh-CN';
            const theme = localStorage.getItem('appTheme') || 'default';
            const fontSize = localStorage.getItem('appFontSize') || '16';
            const texts = langTexts[lang];

            document.getElementById('logoText').textContent = texts.logoText;
            document.getElementById('navHome').textContent = texts.navHome;
            document.getElementById('navGame').textContent = texts.navGame;
            document.getElementById('navQuiz').textContent = texts.navQuiz;
            document.getElementById('langZh').textContent = texts.langZh;
            document.getElementById('langEn').textContent = texts.langEn;
            document.getElementById('breadHome').textContent = texts.breadHome;
            document.getElementById('breadGame').textContent = texts.breadGame;
            document.getElementById('breadCurrent').textContent = texts.breadCurrent;
            document.getElementById('gameTitle').textContent = texts.gameTitle;
            document.getElementById('gameTip').textContent = texts.gameTip;
            document.getElementById('scoreLabel').textContent = texts.scoreLabel;
            document.getElementById('timeLabel').textContent = texts.timeLabel;
            document.getElementById('timeUnit').textContent = texts.timeUnit;
            document.getElementById('chooseText').textContent = texts.chooseText;
            document.getElementById('startBtn').textContent = texts.startBtn;
            document.getElementById('backToGameCenter').textContent = texts.backToGameCenter;
            document.getElementById('gameOverTitle').textContent = texts.gameOverTitle;
            document.getElementById('finalScoreText').textContent = texts.finalScoreText;
            document.getElementById('backToHomeBtn').textContent = texts.backToHomeBtn;
            document.documentElement.lang = lang;

            document.body.classList.remove('eye-mode', 'night-mode');
            if (theme === 'eye') document.body.classList.add('eye-mode');
            if (theme === 'night') document.body.classList.add('night-mode');
            document.documentElement.style.setProperty('--font-size', fontSize + 'px');
            document.documentElement.style.fontSize = fontSize + 'px';

            if (isGameRunning) refreshOptions();
        }

        function drawGame(relationship) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const cx = canvas.width / 2, cy = canvas.height / 2, r = 60;
            const mainColor = getComputedStyle(document.documentElement).getPropertyValue('--primary').trim();

            ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.strokeStyle = mainColor; ctx.lineWidth = 3; ctx.stroke();

            let d;
            if (relationship === 'tangent') d = r;
            else if (relationship === 'intersecting') d = r - 25;
            else d = r + 30;

            const angle = Math.random() * Math.PI * 2;
            const fx = cx + d * Math.cos(angle), fy = cy + d * Math.sin(angle);
            const lx = 90;
            const x1 = fx - lx * Math.sin(angle), y1 = fy + lx * Math.cos(angle);
            const x2 = fx + lx * Math.sin(angle), y2 = fy - lx * Math.cos(angle);

            ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
            ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 3; ctx.stroke();
        }

        function generateQuestion() {
            if (currentQuestion >= totalQuestions) { endGame(); return; }
            const rels = ['tangent', 'intersecting', 'separate'];
            currentRelationship = rels[Math.floor(Math.random() * 3)];
            drawGame(currentRelationship);
            refreshOptions();
        }

        function refreshOptions() {
            const lang = localStorage.getItem('appLang') || 'zh-CN';
            const texts = langTexts[lang];
            const opts = [
                { text: texts.tangent, val: 'tangent' },
                { text: texts.intersecting, val: 'intersecting' },
                { text: texts.separate, val: 'separate' }
            ];
            const container = document.getElementById('optionContainer');
            container.innerHTML = '';
            opts.forEach(o => {
                const btn = document.createElement('button');
                btn.className = 'option-btn'; btn.textContent = o.text;
                btn.onclick = () => {
                    if (!isGameRunning) return;
                    if (o.val === currentRelationship) { btn.classList.add('correct'); score += 10; }
                    else { btn.classList.add('wrong'); score = Math.max(0, score - 5); }
                    document.getElementById('score').textContent = score;
                    container.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
                    currentQuestion++;
                    setTimeout(() => { generateQuestion(); timeLeft = 10; }, 800);
                };
                container.appendChild(btn);
            });
        }

        function startGame() {
            if (isGameRunning) return;
            score = 0; timeLeft = 10; currentQuestion = 0; isGameRunning = true;
            document.getElementById('score').textContent = score;
            document.getElementById('gameOverModal').style.display = 'none';
            generateQuestion();
            if (timer) clearInterval(timer);
            timer = setInterval(() => {
                timeLeft--; document.getElementById('time').textContent = timeLeft;
                if (timeLeft <= 0) endGame();
            }, 1000);
        }

        function endGame() {
            isGameRunning = false; clearInterval(timer);
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOverModal').style.display = 'flex';
        }

        document.querySelectorAll('.lang-link').forEach(link => {
            link.onclick = () => { localStorage.setItem('appLang', link.dataset.lang); applyState(); };
        });
        document.getElementById('startBtn').onclick = startGame;
        window.onload = () => { canvas.width = 240; canvas.height = 240; applyState(); };
        window.addEventListener('storage', (e) => {
            if (['appLang', 'appTheme', 'appFontSize'].includes(e.key)) applyState();
        });
    </script>
</body>
</html>
