<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>圆几何交互式学习平台 - 旋转飞刀</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/common.css">
    <script src="../js/common.js" defer></script>
    <style>
        /* 星空背景 */
        .starry-background {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; overflow: hidden;
        }
        /* 模式适配 - 背景色 */
        body:not(.eye-mode):not(.night-mode) .starry-background {
            background: #1a2a40;
        }
        body.eye-mode .starry-background {
            background: #0f3421;
        }
        body.night-mode .starry-background {
            background: #000;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle linear infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        
        /* 模式适配 - 星星颜色 */
        body:not(.eye-mode):not(.night-mode) .star {
            background: #ffffff;
        }
        body.eye-mode .star {
            background: #e0e0e0;
        }
        body.night-mode .star {
            background: #a0a0ff;
        }
        
        /* 透明body背景，让星空背景显示 */
        body {
            background: transparent !important;
        }
        
        .main-container {
            width: 100%; max-width: 900px; margin: 0 auto; padding: 120px 4vw 60px;
            display: flex; flex-direction: column; gap: 25px; align-items: center;
        }
        .breadcrumb {
            width: 100%; font-size: 0.9rem; color: var(--muted);
        }
        .breadcrumb a {
            color: var(--primary); font-weight: 600; text-decoration: none;
        }
        .game-card-main {
            width: 100%; background: transparent; backdrop-filter: blur(12px);
            border: 1px solid var(--border-color); border-radius: var(--radius-xl);
            padding: 40px; box-shadow: var(--shadow-lg); text-align: center;
            margin-bottom: 20px;
        }
        .game-card-main h2 {
            color: var(--text);
        }
        /* 默认模式下的游戏标题颜色 */
        body:not(.eye-mode):not(.night-mode) .game-card-main h2 {
            color: #1d4ed8;
        }
        /* 默认模式下的覆盖层标题颜色 */
        body:not(.eye-mode):not(.night-mode) .overlay-title {
            color: #1d4ed8;
        }
        .game-card-main p {
            color: var(--muted);
        }
        #gameCanvas {
            position: fixed; top: 80px; left: 0; width: 100%; height: calc(100vh - 80px);
            touch-action: none; z-index: 1;
        }
        .hud {
            position:fixed; top:90px; left:20px;
            display:flex; gap:10px; z-index:10;
        }
        .hud-pill {
            background:transparent; border:1px solid var(--border-color);
            border-radius:999px; padding:8px 14px;
            display:flex; gap:6px;
        }
        .hud-label { font-size:0.8rem; color:var(--muted); }
        .hud-value { font-weight:bold; color:var(--text); }
        /* 默认模式下的HUD颜色 */
        body:not(.eye-mode):not(.night-mode) .hud-value {
            color: #1d4ed8;
        }
        .back-button {
            position:fixed; top:90px; right:90px;
            z-index:10;
        }
        .overlay {
            position:fixed; inset:0; z-index:200;
            display:none; align-items:center; justify-content:center;
            background:rgba(0,0,0,0.5); backdrop-filter:blur(6px);
            padding:20px;
        }
        .overlay.visible { display:flex; }
        .overlay-card {
            width:min(500px,100%); background:var(--surface);
            border-radius:24px; padding:30px; border:1px solid var(--border-color);
        }
        .overlay-title { font-size:1.6rem; font-weight:bold; margin-bottom:10px; color: var(--text); }
        .overlay-text { color:var(--muted); line-height:1.6; margin-bottom:20px; }
        .overlay-actions { display:flex; gap:12px; justify-content:flex-end; flex-wrap:wrap; }
        .btn {
            padding:10px 20px; border-radius:999px;
            border:1px solid var(--border-color);
            background:var(--surface-strong);
            font-weight:bold; cursor:pointer;
        }
        .btn.primary { background:var(--primary); color:white; border-color:var(--primary); }
        .toast {
            position:fixed; left:50%; top:40%; transform:translate(-50%,-50%);
            background:rgba(0,0,0,0.7); color:white; padding:12px 24px;
            border-radius:999px; opacity:0; animation:toast 1s forwards;
            z-index:500;
        }
        @keyframes toast {
            0%{opacity:0; transform:translate(-50%,-40%) scale(0.9);}
            20%{opacity:1; transform:translate(-50%,-50%) scale(1);}
            80%{opacity:1;}
            100%{opacity:0;}
        }
        .btn-action {
            padding: 12px 35px; background: var(--primary); color: white; border: none;
            border-radius: 100px; font-weight: 700; font-size: 1.1rem; cursor: pointer; transition: all 0.3s;
        }
        .btn-action:hover { background: var(--primary-strong); transform: scale(1.05); }
        .setting-wrap {
            position: relative;
        }
        .setting-icon {
            font-size: 1.2rem; color: var(--muted); width: 42px; height: 42px;
            display: flex; justify-content: center; align-items: center;
            background: var(--surface-strong); border-radius: 50%;
            border: 1px solid var(--border-color); cursor: pointer;
        }
        .setting-menu {
            display: none; position: absolute; top: 50px; right: 0;
            width: 200px; background: var(--surface-strong);
            border-radius: var(--radius-md); border: 1px solid var(--border-color);
            box-shadow: var(--shadow-lg); padding: 12px; z-index: 10000;
        }
        .menu-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px; font-size: 0.9rem; color: var(--text);
            border-radius: 8px; cursor: pointer;
        }
        .menu-item:hover { background: var(--bg-color); color: var(--primary); }
    </style>
    <link rel="stylesheet" href="../css/common.css">
    <script src="../js/common.js" defer></script>
</head>
<body>
    <!-- 星空背景 -->
    <div class="starry-background" id="starryBackground"></div>
    
    <header class="header-container">
        <div class="logo" id="logoText">圆几何交互式学习平台</div>
        <nav class="nav-main">
            <span class="nav-droplet" aria-hidden="true"></span>
            <a href="../index/index.html" class="nav-link" id="navHome">首页</a>
            <a href="game.html" class="nav-link active" id="navGame">游戏</a>
            <a href="../quiz/test.html" class="nav-link" id="navQuiz">测试</a>
        </nav>
        <div class="header-right">
            <div class="lang-switch">
                <a href="javascript:;" class="lang-link active" data-lang="zh-CN" id="langZh">简体中文</a>
                <span>/</span>
                <a href="javascript:;" class="lang-link" data-lang="en" id="langEn">English</a>
            </div>
            <div class="setting-wrap">
                <a href="javascript:;" class="setting-icon"><i class="fas fa-cog"></i></a>
                <div class="setting-menu">
                    <a href="javascript:;" class="menu-item" data-style="eye" id="menuEye">护眼模式</a>
                    <a href="javascript:;" class="menu-item" data-style="night" id="menuNight">夜晚模式</a>
                    <a href="javascript:;" class="menu-item" data-style="default" id="menuDefault">默认模式</a>
                </div>
            </div>
        </div>
    </header>

    <main class="main-container">
        <div class="breadcrumb">
            <a href="../index/index.html" id="breadHome">首页</a> › <a href="game.html" id="breadGame">游戏中心</a> › <span id="breadCurrent">旋转飞刀</span>
        </div>

        <div class="game-card-main">
            <h2 id="gameTitle" style="font-size: 2rem; margin-bottom: 10px;">旋转飞刀</h2>
            <p id="gameTip" style="color: var(--muted); margin-bottom: 30px;">点击屏幕发射飞刀，扎在旋转的圆盘上。不能碰到已经扎在上面的刀！</p>
        </div>
    </main>

    <canvas id="gameCanvas"></canvas>

    <div class="hud">
        <div class="hud-pill"><span class="hud-label" id="levelLabel">关卡</span><span class="hud-value" id="level">1</span></div>
        <div class="hud-pill"><span class="hud-label" id="knifeLabel">剩余</span><span class="hud-value" id="knife">6</span></div>
    </div>

    <div class="back-button">
        <div class="hud-pill" style="cursor: pointer;"><span class="hud-label" id="backLabel">返回</span></div>
    </div>

    <div class="overlay visible" id="startPanel">
        <div class="overlay-card">
            <div class="overlay-title" id="title">旋转飞刀</div>
            <div class="overlay-text" id="desc">
                点击屏幕发射飞刀，扎在旋转的圆盘上。<br>
                不能碰到已经扎在上面的刀！<br>
                扎完所有刀即可过关！
            </div>
            <div class="overlay-actions">
                <button class="btn primary" id="startBtn">开始游戏</button>
            </div>
        </div>
    </div>

    <div class="overlay" id="endPanel">
        <div class="overlay-card">
            <div class="overlay-title" id="endTitle">游戏结束</div>
            <div class="overlay-text" id="endDesc">你碰到了其他飞刀！</div>
            <div class="overlay-actions">
                <button class="btn primary" id="restartBtn">重新开始</button>
                <button class="btn primary" id="continueBtn">继续当前难度</button>
            </div>
        </div>
    </div>

    <script>
    // ==================== 双语配置 ====================
    const langTexts = {
        'zh-CN': {
            logoText: '圆几何交互式学习平台', navHome: '首页', navGame: '游戏', navQuiz: '测试',
            langZh: '简体中文', langEn: 'English', breadHome: '首页', breadGame: '游戏中心',
            breadCurrent: '旋转飞刀', gameTitle: '旋转飞刀',
            gameTip: '点击屏幕发射飞刀，扎在旋转的圆盘上。不能碰到已经扎在上面的刀！',
            title: '旋转飞刀',
            desc: '点击屏幕发射飞刀，扎在旋转的圆盘上。<br>不能碰到已经扎在上面的刀！<br>扎完所有刀即可过关！',
            endTitle: '游戏结束', endDesc: '你碰到了其他飞刀！',
            startBtn: '开始游戏', restartBtn: '重新开始', continueBtn: '继续当前难度',
            levelLabel: '关卡', knifeLabel: '剩余', clear: '过关！', backLabel: '返回',
            menuEye: '护眼模式', menuNight: '夜晚模式', menuDefault: '默认模式'
        },
        'en': {
            logoText: 'Interactive Learning Platform for Circle Geometry', navHome: 'Home', navGame: 'Game', navQuiz: 'Quiz',
            langZh: 'ZH', langEn: 'EN', breadHome: 'Home', breadGame: 'Game Center',
            breadCurrent: 'Knife Hit', gameTitle: 'Knife Hit',
            gameTip: 'Tap to throw knives on the rotating disk. Don\'t hit other knives!',
            title: 'Knife Hit',
            desc: 'Tap to throw knives. Don\'t hit others!<br>Clear all to win!',
            endTitle: 'Game Over', endDesc: 'You hit the knife!',
            startBtn: 'Start Game', restartBtn: 'Restart', continueBtn: 'Continue',
            levelLabel: 'Level', knifeLabel: 'Knives', clear: 'Clear!', backLabel: 'Back',
            menuEye: 'Eye Protection', menuNight: 'Night Mode', menuDefault: 'Default Mode'
        }
    };

    function applyState() {
        const lang = localStorage.getItem('appLang') || 'zh-CN';
        const theme = localStorage.getItem('appTheme') || 'default';
        const fontSize = localStorage.getItem('appFontSize') || '16';
        const texts = langTexts[lang];

        document.getElementById('logoText').textContent = texts.logoText;
        document.getElementById('navHome').textContent = texts.navHome;
        document.getElementById('navGame').textContent = texts.navGame;
        document.getElementById('navQuiz').textContent = texts.navQuiz;
        document.getElementById('langZh').textContent = texts.langZh;
        document.getElementById('langEn').textContent = texts.langEn;
        document.getElementById('menuEye').textContent = texts.menuEye;
        document.getElementById('menuNight').textContent = texts.menuNight;
        document.getElementById('menuDefault').textContent = texts.menuDefault;
        document.getElementById('breadHome').textContent = texts.breadHome;
        document.getElementById('breadGame').textContent = texts.breadGame;
        document.getElementById('breadCurrent').textContent = texts.breadCurrent;
        document.getElementById('gameTitle').textContent = texts.gameTitle;
        document.getElementById('gameTip').textContent = texts.gameTip;
        document.getElementById('title').textContent = texts.title;
        document.getElementById('desc').innerHTML = texts.desc;
        document.getElementById('endTitle').textContent = texts.endTitle;
        document.getElementById('endDesc').textContent = texts.endDesc;
        document.getElementById('startBtn').textContent = texts.startBtn;
        document.getElementById('restartBtn').textContent = texts.restartBtn;
        document.getElementById('continueBtn').textContent = texts.continueBtn;
        document.getElementById('levelLabel').textContent = texts.levelLabel;
        document.getElementById('knifeLabel').textContent = texts.knifeLabel;
        document.getElementById('backLabel').textContent = texts.backLabel;
        document.documentElement.lang = lang;

        document.body.classList.remove('eye-mode', 'night-mode');
        if (theme === 'eye') document.body.classList.add('eye-mode');
        if (theme === 'night') document.body.classList.add('night-mode');
        document.documentElement.style.setProperty('--font-size', fontSize + 'px');
        document.documentElement.style.fontSize = fontSize + 'px';
    }

    // 生成星空背景
    function createStars() {
        const container = document.getElementById('starryBackground');
        if (!container) {
            console.error('starryBackground element not found');
            return;
        }
        container.innerHTML = '';
        
        const starCount = 200;
        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            
            // 随机位置
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            
            // 随机大小
            const size = Math.random() * 2 + 0.5;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            
            // 随机动画持续时间
            const duration = Math.random() * 3 + 2;
            star.style.animationDuration = duration + 's';
            
            // 随机延迟
            star.style.animationDelay = Math.random() * 2 + 's';
            
            container.appendChild(star);
        }
        console.log('Stars created successfully');
    }

    // ==================== 游戏核心 ====================
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    let w = innerWidth, h = innerHeight;
    canvas.width = w; canvas.height = h;

    let savedLevel = 1;
    let savedSpeed = 1;
    let level = 1, knives = 6, speed = 1;
    let rotation = 0;
    let knifeAngles = [];
    let playing = false;
    let particles = [];

    const cx = w / 2;
    const cy = h * 0.6;
    const cr = Math.min(w, h) * 0.23;

    window.addEventListener("resize", () => {
        w = innerWidth; h = innerHeight;
        canvas.width = w; canvas.height = h;
    });

    function draw() {
        ctx.clearRect(0, 0, w, h);
        if (!playing) return;

        // 更新和绘制粒子
        updateParticles();
        drawParticles();

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(rotation);
        rotation += speed * 0.012;

        // 绘制星空黑洞
        // 黑洞中心 - 由外圈颜色渐变而成
        const centerGradient = ctx.createRadialGradient(0, 0, 0, 0, 0, cr * 0.3);
        centerGradient.addColorStop(0, "hsla(260, 100%, 20%, 1)");
        centerGradient.addColorStop(0.5, "hsla(280, 100%, 10%, 1)");
        centerGradient.addColorStop(1, "hsla(300, 100%, 5%, 1)");
        
        ctx.beginPath();
        ctx.arc(0, 0, cr * 0.3, 0, Math.PI * 2);
        ctx.fillStyle = centerGradient;
        ctx.fill();
        
        // 黑洞吸积盘 - 蓝紫色调
        for (let i = 1; i <= 5; i++) {
            ctx.beginPath();
            ctx.arc(0, 0, cr * 0.3 + i * (cr * 0.1), 0, Math.PI * 2);
            const gradient = ctx.createRadialGradient(0, 0, cr * 0.3, 0, 0, cr);
            const hue = 260 + i * 10; // 蓝紫色调
            gradient.addColorStop(0, `hsla(${hue}, 100%, 50%, 0.3)`);
            gradient.addColorStop(1, `hsla(${hue}, 100%, 50%, 0)`);
            ctx.strokeStyle = gradient;
            ctx.lineWidth = cr * 0.08;
            ctx.stroke();
        }
        
        // 星点效果
        for (let i = 0; i < 30; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = cr * 0.3 + Math.random() * cr * 0.7;
            const x = Math.cos(angle) * radius;
            const y = Math.sin(angle) * radius;
            ctx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.8 + 0.2})`;
            ctx.beginPath();
            ctx.arc(x, y, Math.random() * 2 + 0.5, 0, Math.PI * 2);
            ctx.fill();
        }

        // 绘制激光剑
        knifeAngles.forEach(a => {
            ctx.save();
            ctx.rotate(a);
            
            // 剑柄
            ctx.fillStyle = "#333333";
            ctx.beginPath();
            ctx.moveTo(0, -cr * 0.95);
            ctx.lineTo(-4, -cr * 1.3);
            ctx.lineTo(4, -cr * 1.3);
            ctx.closePath();
            ctx.fill();
            
            // 激光剑刃 - 白色到红色荧光（颜色对调）
            const gradient = ctx.createLinearGradient(0, -cr * 0.95, 0, -cr * 1.7);
            gradient.addColorStop(0, "#ffffff");
            gradient.addColorStop(0.7, "#ff6666");
            gradient.addColorStop(1, "#ff0000");
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.moveTo(0, -cr * 0.95);
            ctx.lineTo(-3, -cr * 1.7);
            ctx.lineTo(3, -cr * 1.7);
            ctx.closePath();
            ctx.fill();
            
            // 剑刃发光效果
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 1;
            ctx.stroke();
            
            ctx.restore();
        });

        ctx.restore();
        requestAnimationFrame(draw);
    }

    function createParticles(x, y) {
        for (let i = 0; i < 30; i++) { // 增加粒子数量到30
            const hue = 260 + Math.random() * 40; // 蓝紫色调
            particles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 8, // 增加速度
                vy: (Math.random() - 0.5) * 8,
                size: Math.random() * 4 + 1, // 增加大小
                life: 1,
                decay: Math.random() * 0.03 + 0.01,
                color: `hsla(${hue}, 100%, 70%, 1)` // 蓝紫色调
            });
        }
    }

    function updateParticles() {
        particles = particles.filter(p => p.life > 0);
        particles.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.life -= p.decay;
        });
    }

    function drawParticles() {
        particles.forEach(p => {
            ctx.save();
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color; // 使用粒子的颜色
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            // 添加光晕效果
            ctx.shadowColor = p.color;
            ctx.shadowBlur = 10;
            ctx.fill();
            ctx.restore();
        });
    }

    let lastThrowTime = 0;
    function throwKnife() {
        if (!playing) return;
        let now = Date.now();
        if (now - lastThrowTime < 80) return;
        lastThrowTime = now;

        const currentRot = rotation;
        const fireAngle = Math.PI;
        const worldAngle = (fireAngle - currentRot + Math.PI * 2) % (Math.PI * 2);

        for (let a of knifeAngles) {
            let diff = Math.abs(worldAngle - a);
            if (diff > Math.PI) diff = Math.PI * 2 - diff;
            if (diff < 0.18) {
                gameOver();
                return;
            }
        }

        knifeAngles.push(worldAngle);
        knives--;
        document.getElementById("knife").textContent = knives;

        // 创建粒子效果
        const particleX = cx + Math.cos(worldAngle) * cr;
        const particleY = cy + Math.sin(worldAngle) * cr;
        createParticles(particleX, particleY);

        if (knives <= 0) nextLevel();
    }

    function nextLevel() {
        savedLevel = ++level;
        savedSpeed = speed += 0.3;
        knives = 6 + Math.floor(level * 0.5);
        knifeAngles = [];
        document.getElementById("level").textContent = level;
        document.getElementById("knife").textContent = knives;
        showToast(langTexts[localStorage.getItem('appLang') || 'zh-CN'].clear);
    }

    function gameOver() {
        playing = false;
        document.getElementById("endPanel").classList.add("visible");
    }

    function startGame() {
        level = 1; speed = 1; knives = 6;
        knifeAngles = []; rotation = 0;
        document.getElementById("level").textContent = 1;
        document.getElementById("knife").textContent = 6;
        playing = true;
        document.getElementById("startPanel").classList.remove("visible");
        document.getElementById("endPanel").classList.remove("visible");
        draw();
    }

    function continueGame() {
        level = savedLevel;
        speed = savedSpeed;
        knives = 6 + Math.floor(savedLevel * 0.5);
        knifeAngles = [];
        rotation = 0;
        document.getElementById("level").textContent = level;
        document.getElementById("knife").textContent = knives;
        playing = true;
        document.getElementById("endPanel").classList.remove("visible");
        draw();
    }

    document.getElementById("startBtn").onclick = startGame;
    document.getElementById("restartBtn").onclick = startGame;
    document.getElementById("continueBtn").onclick = continueGame;
    canvas.onclick = throwKnife;
    document.querySelector('.back-button .hud-pill').onclick = function() {
        window.location.href = 'game.html';
    };

    function showToast(msg) {
        const t = document.createElement("div");
        t.className = "toast";
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 1000);
    }

    document.querySelectorAll('.lang-link').forEach(link => {
        link.onclick = () => {
            localStorage.setItem('appLang', link.dataset.lang);
            applyState();
        };
    });

    const settingWrap = document.querySelector('.setting-wrap');
    const settingMenu = document.querySelector('.setting-menu');
    let menuHideTimer = null;

    if (settingWrap && settingMenu) {
        settingWrap.addEventListener('mouseenter', () => { clearTimeout(menuHideTimer); settingMenu.style.display = 'block'; });
        settingWrap.addEventListener('mouseleave', () => { menuHideTimer = setTimeout(() => { settingMenu.style.display = 'none'; }, 1000); });
        settingMenu.addEventListener('mouseenter', () => clearTimeout(menuHideTimer));

        document.querySelectorAll('.menu-item[data-style]').forEach(item => {
            item.addEventListener('click', () => {
                localStorage.setItem('appTheme', item.dataset.style);
                applyState();
            });
        });
    }

    window.onload = () => {
        console.log('Window loaded, calling applyState and createStars');
        applyState();
        createStars();
        console.log('applyState and createStars called');
    };
    window.addEventListener('storage', (e) => {
        if (['appLang', 'appTheme', 'appFontSize'].includes(e.key)) applyState();
    });
    </script>
</body>
</html>
