<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>圆几何交互式学习平台 - 游戏中心</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 全局样式重置 - 完全对齐 index.html */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Trebuchet MS", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
        }

        :root {
            --primary: #2563eb;
            --primary-strong: #1d4ed8;
            --text: #1f2937;
            --muted: #64748b;
            --bg-color: #f8fafc;
            --surface: rgba(255, 255, 255, 0.85);
            --surface-strong: #ffffff;
            --border-color: #e2e8f0;
            --shadow-lg: 0 24px 60px rgba(31, 41, 55, 0.12);
            --shadow-md: 0 16px 32px rgba(31, 41, 55, 0.08);
            --radius-xl: 28px;
            --radius-lg: 22px;
            --radius-md: 16px;
            --font-size: 16px;
        }

        body {
            color: var(--text);
            font-size: var(--font-size);
            /* 背景与 index.html 完全一致 */
            background:
                radial-gradient(circle at 12% 10%, rgba(37, 99, 235, 0.1), transparent 22%),
                radial-gradient(circle at 86% 14%, rgba(37, 99, 235, 0.1), transparent 20%),
                linear-gradient(rgba(180, 154, 109, 0.12) 1px, transparent 1px),
                linear-gradient(90deg, rgba(180, 154, 109, 0.12) 1px, transparent 1px),
                linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
            background-size: auto, auto, 46px 46px, 46px 46px, auto;
            background-attachment: fixed;
            min-height: 100vh;
            overflow-x: hidden;
            transition: all 0.3s ease-in-out;
            line-height: 1.6;
        }

        /* 模式切换：护眼/夜晚 */
        body.eye-mode {
            --bg-color: #f0f9eb;
            --surface: rgba(247, 251, 242, 0.88);
            --text: #166534;
            --border-color: #c7e3b4;
            --primary: #438a4c;
            --primary-strong: #3f6234;
        }
        body.night-mode {
            --text: #f1f5f9;
            --muted: #94a3b8;
            --primary: #60a5fa;
            --primary-strong: #3b82f6;
            --surface: rgba(15, 23, 42, 0.9);
            --surface-strong: #0f172a;
            --border-color: #334155;
            --bg-color: #020617;
            background:
                radial-gradient(circle at 12% 10%, rgba(56, 189, 248, 0.15), transparent 25%),
                radial-gradient(circle at 86% 14%, rgba(56, 189, 248, 0.15), transparent 22%),
                linear-gradient(rgba(56, 189, 248, 0.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56, 189, 248, 0.2) 1px, transparent 1px),
                linear-gradient(180deg, #020617 0%, #0f172a 100%);
            background-size: auto, auto, 46px 46px, 46px 46px, auto;
        }

        /* 方格背景，与index.html保持一致 */
        body {
            background:
                radial-gradient(circle at 12% 10%, rgba(37, 99, 235, 0.1), transparent 22%),
                radial-gradient(circle at 86% 14%, rgba(37, 99, 235, 0.1), transparent 20%),
                linear-gradient(rgba(180, 154, 109, 0.12) 1px, transparent 1px),
                linear-gradient(90deg, rgba(180, 154, 109, 0.12) 1px, transparent 1px),
                linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
            background-size: auto, auto, 46px 46px, 46px 46px, auto;
            background-attachment: fixed;
        }
        
        body.eye-mode {
            background:
                radial-gradient(circle at 12% 10%, rgba(34, 197, 94, 0.1), transparent 22%),
                radial-gradient(circle at 86% 14%, rgba(34, 197, 94, 0.1), transparent 20%),
                linear-gradient(rgba(167, 243, 208, 0.12) 1px, transparent 1px),
                linear-gradient(90deg, rgba(167, 243, 208, 0.12) 1px, transparent 1px),
                linear-gradient(180deg, #f0f9eb 0%, #dcfce7 100%);
            background-size: auto, auto, 46px 46px, 46px 46px, auto;
            background-attachment: fixed;
        }
        
        body.night-mode {
            background:
                radial-gradient(circle at 12% 10%, rgba(96, 165, 250, 0.1), transparent 22%),
                radial-gradient(circle at 86% 14%, rgba(96, 165, 250, 0.1), transparent 20%),
                linear-gradient(90deg, rgba(56, 189, 248, 0.2) 1px, transparent 1px),
                linear-gradient(180deg, #020617 0%, #0f172a 100%);
            background-size: auto, auto, 46px 46px, 46px 46px, auto;
            background-attachment: fixed;
        }

        a {
            text-decoration: none;
            color: inherit;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 头部导航：像素级复用 index.html */
        .header-container {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
            width: 100%;
            height: 80px;
            padding: 0 4vw;
            background: var(--surface);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-md);
        }

        .logo {
            font-size: clamp(1.2rem, 2.5vw, 1.6rem);
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-main {
            display: flex;
            gap: 2.5vw;
            background: rgba(15, 23, 42, 0.04);
            padding: 6px;
            border-radius: 100px;
        }
        .nav-link {
            font-size: 0.95rem;
            color: var(--muted);
            font-weight: 600;
            padding: 8px 24px;
            border-radius: 100px;
        }
        .nav-link:hover {
            color: var(--primary);
            background: rgba(255, 255, 255, 0.8);
        }
        .nav-link.active {
            color: white;
            background: var(--primary);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 1.5vw;
        }

        .lang-switch {
            font-size: 0.85rem;
            color: var(--muted);
            background: var(--surface-strong);
            padding: 6px 16px;
            border-radius: 100px;
            border: 1px solid var(--border-color);
        }
        .lang-link { color: var(--muted); cursor: pointer; }
        .lang-link.active { color: var(--primary); font-weight: 700; }

        .setting-icon {
            font-size: 1.2rem;
            color: var(--muted);
            width: 42px;
            height: 42px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--surface-strong);
            border-radius: 50%;
            border: 1px solid var(--border-color);
            cursor: pointer;
        }

        .setting-menu {
            display: none;
            position: absolute;
            top: 90px;
            right: 4vw;
            width: 240px;
            background: var(--surface-strong);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-lg);
            padding: 16px;
            z-index: 10000;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            font-size: 0.9rem;
            color: var(--text);
            border-radius: 10px;
            margin-bottom: 4px;
            cursor: pointer;
        }
        .menu-item:hover {
            background: var(--bg-color);
            color: var(--primary);
        }

        /* 游戏中心主体 */
        .main-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 120px 4vw 60px;
            display: flex;
            flex-direction: column;
            gap: 40px;
            align-items: center;
        }

        .breadcrumb {
            width: 100%;
            font-size: 0.9rem;
            color: var(--muted);
            margin-bottom: 10px;
        }
        .breadcrumb a { color: var(--primary); font-weight: 600; }

        .game-title {
            font-size: clamp(2rem, 5vw, 2.5rem);
            font-weight: 800;
            text-align: center;
        }
        /* 默认模式下的标题颜色 */
        body:not(.eye-mode):not(.night-mode) .game-title {
            color: #1d4ed8;
        }
        /* 其他模式保持原有颜色 */
        body.eye-mode .game-title,
        body.night-mode .game-title {
            color: var(--text);
        }

        .game-grid {
            display: grid;
            grid-template-columns: auto 1fr 1fr;
            grid-auto-rows: 1fr;
            gap: 30px;
            width: 100%;
            max-width: 980px;
        }

        .game-style-select {
            grid-column: 1 / -1;
            text-align: left;
            margin-bottom: 10px;
            font-size: 1.2rem;
            font-weight: 700;
            word-wrap: break-word;
            white-space: normal;
        }

        .game-category {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            padding-right: 20px;
            min-width: 200px;
            max-width: 250px;
        }

        .category-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 10px;
            word-wrap: break-word;
            white-space: normal;
        }

        .category-desc {
            font-size: 0.9rem;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: normal;
        }

        /* 模式适配 - 文字颜色 */
        body:not(.eye-mode):not(.night-mode) .game-style-select,
        body:not(.eye-mode):not(.night-mode) .category-title,
        body:not(.eye-mode):not(.night-mode) .category-desc {
            color: #3b82f6;
        }

        body.eye-mode .game-style-select,
        body.eye-mode .category-title,
        body.eye-mode .category-desc {
            color: #438a4c;
        }

        body.night-mode .game-style-select,
        body.night-mode .category-title,
        body.night-mode .category-desc {
            color: #f1f5f9;
        }

        .game-card {
            background: transparent;
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 40px 30px;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            box-shadow: var(--shadow-md);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            min-height: 260px;
            height: 100%;
        }
        .game-card:hover {
            transform: translateY(-10px);
            border-color: var(--primary);
            box-shadow: var(--shadow-lg);
        }

        /* 统一 SVG 图标样式 */
        .game-icon-svg {
            width: 80px;
            height: 80px;
            color: var(--primary);
            transition: transform 0.3s ease;
        }
        .game-card:hover .game-icon-svg {
            transform: scale(1.1) rotate(5deg);
        }

        .game-name {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
        }
        .game-desc {
            font-size: 0.95rem;
            color: var(--muted);
            line-height: 1.6;
        }

        @media (max-width: 768px) {
            .header-container { padding: 0 20px; height: 70px; }
            .nav-main { display: none; }
            .main-container { padding-top: 100px; }
            .game-grid { grid-template-columns: 1fr; }
            .game-category { margin-bottom: 20px; }
        }
    </style>

    <link rel="stylesheet" href="../css/game.css">

</head>

    <script>
        const langTexts = {
            'zh-CN': {
                logoText: '圆几何交互式学习平台',
                navHome: '首页',
                navGame: '游戏',

                langEn: 'English',

        let menuHideTimer = null;

        function applyState() {
            const lang = localStorage.getItem('appLang') || 'zh-CN';

            document.getElementById('game4Name').textContent = texts.game4Name;
            document.getElementById('game4Desc').textContent = texts.game4Desc;
            document.getElementById('styleSelectText').textContent = texts.styleSelectText;
            document.getElementById('basicCategoryTitle').textContent = texts.basicCategoryTitle;
            document.getElementById('basicCategoryDesc').textContent = texts.basicCategoryDesc;
            document.getElementById('funCategoryTitle').textContent = texts.funCategoryTitle;
            document.getElementById('funCategoryDesc').textContent = texts.funCategoryDesc;
            document.documentElement.lang = lang;

            document.body.classList.remove('eye-mode', 'night-mode');
            if (theme === 'eye') document.body.classList.add('eye-mode');
            if (theme === 'night') document.body.classList.add('night-mode');
            document.documentElement.style.setProperty('--font-size', fontSize + 'px');
            document.documentElement.style.fontSize = fontSize + 'px';

            document.querySelectorAll('.lang-link').forEach(link => {
                link.classList.remove('active');
                if (link.dataset.lang === lang) link.classList.add('active');
            });
        }



        // 语言切换
        document.querySelectorAll('.lang-link').forEach(link => {
            link.onclick = () => {
                localStorage.setItem('appLang', link.dataset.lang);
                applyState();
            };
        });

        // 模式切换
        document.querySelectorAll('.menu-item[data-style]').forEach(item => {
            item.onclick = () => {
                localStorage.setItem('appTheme', item.dataset.style);
                applyState();
            };
        });

        // 设置菜单悬浮逻辑
        settingWrap.onmouseenter = () => { clearTimeout(menuHideTimer); settingMenu.style.display = 'block'; };
        settingWrap.onmouseleave = () => { menuHideTimer = setTimeout(() => { settingMenu.style.display = 'none'; }, 1000); };
        settingMenu.onmouseenter = () => clearTimeout(menuHideTimer);

        window.onload = () => {
            applyState();
            createStars();
        };
        window.addEventListener('storage', (e) => {
            if (['appLang', 'appTheme', 'appFontSize'].includes(e.key)) applyState();
        });
    </script>
</body>
</html>
