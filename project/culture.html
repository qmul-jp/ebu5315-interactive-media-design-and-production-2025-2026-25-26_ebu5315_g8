<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>圆文化小知识 - 圆几何交互式学习平台</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Trebuchet MS", "Microsoft YaHei", sans-serif; }

        :root {
            --primary: #2563eb;
            --primary-strong: #1d4ed8;
            --text: #1f2937;
            --muted: #64748b;
            --bg-color: #f8fafc;
            --surface: rgba(255, 255, 255, 0.85);
            --surface-strong: #ffffff;
            --border-color: #e2e8f0;
            --shadow-lg: 0 24px 60px rgba(31, 41, 55, 0.12);
            --radius-xl: 28px;
            --font-size: 16px;
        }

        body {
            color: var(--text);
            font-size: var(--font-size);
            background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
            min-height: 100vh;
            line-height: 1.6;
            transition: all 0.3s ease;
        }

        body.eye-mode { --bg-color: #f0f9eb; --surface: rgba(247, 251, 242, 0.88); --text: #166534; --border-color: #c7e3b4; --primary: #438a4c; }
        body.night-mode {
            --text: #f1f5f9;
            --muted: #94a3b8;
            --primary: #60a5fa;
            --surface: rgba(15, 23, 42, 0.9);
            --surface-strong: #0f172a;
            --border-color: #334155;
            --bg-color: #020617;
            background:
                radial-gradient(circle at 12% 10%, rgba(56, 189, 248, 0.15), transparent 25%),
                radial-gradient(circle at 86% 14%, rgba(56, 189, 248, 0.15), transparent 22%),
                linear-gradient(rgba(56, 189, 248, 0.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56, 189, 248, 0.2) 1px, transparent 1px),
                linear-gradient(180deg, #020617 0%, #0f172a 100%);
            background-size: auto, auto, 46px 46px, 46px 46px, auto;
        }

        .header-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 80px; padding: 0 4vw;
            background: var(--surface); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center; z-index: 1000;
        }

        .logo {
            font-size: 1.5rem; font-weight: 800; font-family: "Orbitron", sans-serif;
            background: linear-gradient(135deg, #2563eb 0%, #60a5fa 100%);
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }

        .back-btn {
            padding: 8px 20px; border-radius: 100px; background: var(--primary); color: white;
            font-weight: 600; text-decoration: none; transition: all 0.3s;
        }
        .back-btn:hover { transform: translateX(-5px); background: var(--primary-strong); }

        .content-container {
            max-width: 1000px; margin: 0 auto; padding: 120px 4vw 60px;
        }

        .glass-panel {
            background: var(--surface); backdrop-filter: blur(20px); border-radius: 40px;
            padding: 50px; border: 1px solid var(--border-color); box-shadow: var(--shadow-lg);
        }

        h1 { font-size: 2.5rem; color: var(--primary); margin-bottom: 40px; text-align: center; font-weight: 800; }
        .section { margin-bottom: 50px; animation: fadeIn 0.8s ease-out; }
        h2 { font-size: 1.8rem; color: var(--primary-strong); margin-bottom: 20px; border-left: 6px solid var(--primary); padding-left: 15px; }
        p { margin-bottom: 20px; font-size: 1.1rem; color: var(--text); text-align: justify; }
        
        .highlight-box {
            background: rgba(37, 99, 235, 0.05); border-left: 4px solid var(--primary);
            padding: 20px; border-radius: 0 15px 15px 0; margin: 20px 0;
        }

        .diagram-box {
            background: var(--bg-color); border-radius: 20px; padding: 30px; margin: 30px 0;
            display: flex; flex-direction: column; align-items: center; border: 1px dashed var(--border-color);
        }
        .diagram-box svg { width: 200px; height: 200px; margin-bottom: 15px; }
        .diagram-caption { font-size: 0.9rem; color: var(--muted); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 768px) {
            .glass-panel { padding: 30px 20px; }
            h1 { font-size: 1.8rem; }
            h2 { font-size: 1.4rem; }
        }
    </style>
</head>
<body>
    <header class="header-container">
        <a href="index.html" class="logo">CIRCLE GEOMETRY</a>
        <a href="index.html" class="back-btn" id="backBtn">返回首页</a>
    </header>

    <main class="content-container">
        <article class="glass-panel" id="contentBody">
            <!-- 内容由JS动态填充 -->
        </article>
    </main>

    <script>
        const langTexts = {
            'zh-CN': {
                backBtn: '返回首页',
                title: '圆文化小知识',
                content: `
                    <div class="section">
                        <h2>一、圆周率π的历史与趣味计算</h2>
                        <p>圆周率π是圆的周长与直径的固定比值，是数学史上最古老、最神奇、影响最深远的常数之一，人类对它的探索跨越四千余年，贯穿了古巴比伦、古埃及、古希腊与古代中国等各大文明。早在公元前1700年的古埃及莱因德纸草书中，就记载了π的近似计算方法，取值约3.1605，是人类最早对圆周率的系统记录；古巴比伦人则通过天文观测与几何测量，得出π≈3.125的结果，用于天体运行轨迹的测算。</p>
                        <div class="highlight-box">
                            <p>在趣味计算层面，π的求解从直观测量逐步走向严谨推导：早期文明用“滚圆测长”“量圆算比”的实验法获取近似值；古希腊数学家阿基米德首创<strong>理论计算法</strong>，通过圆内接与外切正多边形双向逼近，得出π介于3.1408至3.1429之间。</p>
                        </div>
                    </div>

                    <div class="section">
                        <h2>二、古代割圆术详解</h2>
                        <p>割圆术是古代数学极限思想的巅峰体现，分为<strong>古希腊穷竭法</strong>与<strong>中国割圆术</strong>两大体系，核心都是用正多边形无限逼近圆，完美诠释了“化曲为直”的数学思维。</p>
                        <p>中国魏晋时期数学家<strong>刘徽</strong>在《九章算术注》中创立完整割圆术，他提出：“割之弥细，所失弥少，割之又割，以至于不可割，则与圆周合体而无所失矣”。其计算步骤严谨且极具智慧：从圆内接正六边形起步，不断将边数加倍，依次计算正12边形、24边形、96边形，直至正192边形的周长与面积，最终得出π≈3.14。</p>
                        <div class="diagram-box">
                            <svg viewBox="0 0 100 100">
                                <circle cx="50" cy="50" r="45" fill="none" stroke="var(--primary)" stroke-width="1"/>
                                <polygon points="50,5 89,27.5 89,72.5 50,95 11,72.5 11,27.5" fill="none" stroke="var(--muted)" stroke-width="0.8"/>
                                <polygon points="50,5 72.5,10.6 89,27.5 94.6,50 89,72.5 72.5,89.4 50,95 27.5,89.4 11,72.5 5.4,50 11,27.5 27.5,10.6" fill="none" stroke="var(--primary-strong)" stroke-width="0.5"/>
                            </svg>
                            <div class="diagram-caption">刘徽割圆术示意图：正多边形逼近圆</div>
                        </div>
                        <p>南北朝时期<strong>祖冲之</strong>在刘徽基础上继续深耕，通过算筹手工演算至圆内接正24576边形，将π精确到小数点后7位，确定3.1415926＜π＜3.1415927，还提出约率22/7与密率355/113，这一精度保持世界领先近千年，被后世誉为“祖率”。</p>
                    </div>

                    <div class="section">
                        <h2>三、圆在中外数学史中的核心地位</h2>
                        <p>圆是人类最早认识的几何图形，从新石器时代的彩陶同心圆纹饰，到古代车轮、记里鼓车的发明，圆先融入生活，再升华为数学研究的核心。在<strong>西方数学史</strong>中，圆被毕达哥拉斯学派奉为“最完美的几何图形”，象征宇宙的和谐与秩序。</p>
                        <p>在<strong>中国数学史</strong>中，圆是《周髀算经》《九章算术》的核心研究对象，是古代天文历法、建筑营造、度量衡设计的基础工具。圆连接了几何、代数、三角学与物理学，是曲线图形的起点、对称性质的典范，从基础几何到高等数学，从机械制造到航天工程，圆始终是数学体系的核心纽带。</p>
                    </div>
                `
            },
            'en': {
                backBtn: 'Back Home',
                title: 'Circle Culture Trivia',
                content: `
                    <div class="section">
                        <h2>1. History and Fun Calculation of Pi (π)</h2>
                        <p>Pi (π) is the fixed ratio of a circle\'s circumference to its diameter. Its exploration spans over 4,000 years, across civilizations like Babylon, Egypt, Greece, and China. As early as 1700 BC, the Egyptian Rhind Papyrus recorded an approximation of π ≈ 3.1605.</p>
                        <div class="highlight-box">
                            <p>Archimedes, the Greek mathematician, pioneered the <strong>theoretical calculation method</strong> by using inscribed and circumscribed polygons to bound π between 3.1408 and 3.1429.</p>
                        </div>
                    </div>

                    <div class="section">
                        <h2>2. Detailed Explanation of Ancient Cyclotomy</h2>
                        <p>Cyclotomy represents the peak of limit thinking in ancient mathematics. <strong>Liu Hui</strong>, a Chinese mathematician of the Wei-Jin period, proposed: "The finer the cut, the smaller the loss." He started from a regular hexagon and kept doubling the sides to approximate the circle.</p>
                        <div class="diagram-box">
                            <svg viewBox="0 0 100 100">
                                <circle cx="50" cy="50" r="45" fill="none" stroke="var(--primary)" stroke-width="1"/>
                                <polygon points="50,5 89,27.5 89,72.5 50,95 11,72.5 11,27.5" fill="none" stroke="var(--muted)" stroke-width="0.8"/>
                            </svg>
                            <div class="diagram-caption">Cyclotomy: Regular polygons approximating a circle</div>
                        </div>
                        <p><strong>Zu Chongzhi</strong> later calculated π to 7 decimal places (3.1415926 < π < 3.1415927), a record that stood for nearly a millennium.</p>
                    </div>

                    <div class="section">
                        <h2>3. Core Status of Circles in History</h2>
                        <p>In <strong>Western history</strong>, circles were regarded by Pythagoreans as the "most perfect shape," symbolizing universal harmony. In <strong>Chinese history</strong>, circles were the foundation of astronomy, architecture, and measurement tools.</p>
                    </div>
                `
            }
        };

        function initPage() {
            const lang = localStorage.getItem('appLang') || 'zh-CN';
            const theme = localStorage.getItem('appTheme') || 'default';
            const texts = langTexts[lang];

            document.body.className = theme === 'default' ? '' : theme + '-mode';
            document.getElementById('backBtn').textContent = texts.backBtn;
            document.getElementById('contentBody').innerHTML = '<h1>' + texts.title + '</h1>' + texts.content;
        }

        window.onload = initPage;
    </script>
</body>
</html>
