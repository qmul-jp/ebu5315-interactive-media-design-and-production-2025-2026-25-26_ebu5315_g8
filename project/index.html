<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>圆几何交互式学习平台</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
    /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Trebuchet MS", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
        }

        :root {
            --primary: #2563eb;
            --primary-strong: #1d4ed8;
            --text: #1f2937;
            --muted: #64748b;
            --bg-color: #f8fafc;
            --surface: rgba(255, 255, 255, 0.85);
            --surface-strong: #ffffff;
            --border-color: #e2e8f0;
            --shadow-lg: 0 24px 60px rgba(31, 41, 55, 0.12);
            --shadow-md: 0 16px 32px rgba(31, 41, 55, 0.08);
            --radius-xl: 28px;
            --radius-lg: 22px;
            --radius-md: 16px;
            --font-size: 16px;
        }

        body {
            color: var(--text);
            font-size: var(--font-size);
            background:
                radial-gradient(circle at 12% 10%, rgba(37, 99, 235, 0.1), transparent 22%),
                radial-gradient(circle at 86% 14%, rgba(37, 99, 235, 0.1), transparent 20%),
                linear-gradient(rgba(180, 154, 109, 0.12) 1px, transparent 1px),
                linear-gradient(90deg, rgba(180, 154, 109, 0.12) 1px, transparent 1px),
                linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
            background-size: auto, auto, 46px 46px, 46px 46px, auto;
            background-attachment: fixed;
            min-height: 100vh;
            overflow-x: hidden;
            transition: all 0.3s ease-in-out;
            line-height: 1.6;
        }

        /* 模式切换：护眼/夜晚，修改CSS变量 */
        body.eye-mode {
            --bg-color: #f0f9eb;
            --surface: rgba(247, 251, 242, 0.88);
            --text: #166534;
            --border-color: #c7e3b4;
            --primary: #438a4c;
            --primary-strong: #3f6234;
        }
        body.night-mode {
            --text: #f1f5f9;
            --muted: #94a3b8;
            --primary: #60a5fa;
            --primary-strong: #3b82f6;
            --surface: rgba(30, 41, 59, 0.88);
            --surface-strong: #1e293b;
            --border-color: #475569;
        }

        a {
            text-decoration: none;
            color: inherit;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 头部样式：现代化设计 */
        .header-container {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
            width: 100%;
            height: 80px;
            padding: 0 4vw;
            background: var(--surface);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-md);
        }

        .logo {
            font-size: clamp(1.2rem, 2.5vw, 1.6rem);
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo i { font-size: 1.4rem; }

        .nav-main {
            display: flex;
            gap: 2.5vw;
            background: rgba(15, 23, 42, 0.04);
            padding: 6px;
            border-radius: 100px;
        }
        .nav-link {
            font-size: 0.95rem;
            color: var(--muted);
            font-weight: 600;
            padding: 8px 24px;
            border-radius: 100px;
        }
        .nav-link:hover {
            color: var(--primary);
            background: rgba(255, 255, 255, 0.8);
        }
        .nav-link.active {
            color: white;
            background: var(--primary);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 1.5vw;
        }

        .lang-switch {
            font-size: 0.85rem;
            color: var(--muted);
            background: var(--surface-strong);
            padding: 6px 16px;
            border-radius: 100px;
            border: 1px solid var(--border-color);
        }
        .lang-link { color: var(--muted); cursor: pointer; }
        .lang-link.active { color: var(--primary); font-weight: 700; }

        .setting-icon {
            font-size: 1.2rem;
            color: var(--muted);
            width: 42px;
            height: 42px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--surface-strong);
            border-radius: 50%;
            border: 1px solid var(--border-color);
            cursor: pointer;
        }
        .setting-icon:hover {
            color: var(--primary);
            transform: rotate(45deg);
        }

        .setting-menu {
            display: none;
            position: absolute;
            top: 90px;
            right: 4vw;
            width: 240px;
            background: var(--surface-strong);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-lg);
            padding: 16px;
            z-index: 10000;
            animation: slideDown 0.3s ease-out;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            font-size: 0.9rem;
            color: var(--text);
            border-radius: 10px;
            margin-bottom: 4px;
            cursor: pointer;
        }
        .menu-item:hover {
            background: var(--bg-color);
            color: var(--primary);
        }

        .font-size-slider-wrap {
            padding: 14px;
            background: var(--bg-color);
            border-radius: 12px;
            margin: 10px 0;
        }
        .font-size-label { font-size: 0.85rem; margin-bottom: 8px; font-weight: 600; }
        .font-size-slider { width: 100%; cursor: pointer; }
        .font-size-value { font-size: 0.75rem; text-align: center; margin-top: 6px; color: var(--muted); }

        .ad-tip {
            position: absolute;
            bottom: -25px;
            right: 0;
            font-size: 0.75rem;
            color: var(--muted);
        }

        /* 主体内容布局 */
        .main-container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 120px 4vw 60px;
            display: flex;
            flex-direction: column;
            gap: 60px;
            align-items: center;
        }

        .carousel-container {
            width: 100%;
            max-width: 1200px;
            border-radius: var(--radius-xl);
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
        }
        .carousel-wrap { position: relative; width: 100%; padding-bottom: 40%; }
        .carousel-list { position: absolute; top: 0; left: 0; width: 500%; height: 100%; display: flex; transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
        .carousel-item { width: 20%; height: 100%; }

        .ai-search-container {
            width: 100%;
            max-width: 900px;
            background: var(--surface);
            padding: 50px;
            border-radius: var(--radius-xl);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
            text-align: center;
        }
        .search-title { font-size: 2rem; margin-bottom: 30px; font-weight: 800; color: var(--primary); }
        .search-box { display: flex; gap: 12px; background: var(--surface-strong); padding: 8px; border-radius: 100px; border: 2px solid var(--border-color); transition: all 0.3s; }
        .search-box:focus-within { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); }
        .search-input { flex: 1; padding: 0 24px; font-size: 1.1rem; border: none; background: transparent; }
        .search-btn { background: var(--primary); color: white; padding: 12px 32px; border-radius: 100px; font-weight: 700; font-size: 1rem; }
        .search-btn:hover { background: var(--primary-strong); transform: scale(1.02); }

        /* 弹窗样式统一 */
        .ai-modal, .contact-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; z-index: 100000;
            width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            justify-content: center; align-items: center;
            padding: 20px;
        }
        .ai-modal-content, .contact-modal-content {
            background: var(--surface-strong);
            padding: 40px;
            border-radius: var(--radius-xl);
            max-width: 700px;
            width: 100%;
            position: relative;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
        }
        .modal-close {
            position: absolute; top: 20px; right: 20px;
            font-size: 1.5rem; color: var(--muted); cursor: pointer;
            width: 40px; height: 40px; display: flex; justify-content: center; align-items: center;
            border-radius: 50%; transition: all 0.3s;
        }
        .modal-close:hover { background: #fee2e2; color: #ef4444; }
        .modal-title, .contact-title { font-size: 1.6rem; font-weight: 800; color: var(--primary); margin-bottom: 24px; }
        .modal-result, .contact-info { font-size: 1.1rem; line-height: 1.8; color: var(--text); }

        @media (max-width: 768px) {
            .header-container { padding: 0 20px; height: 70px; }
            .nav-main { display: none; } /* 移动端简化导航 */
            .main-container { padding-top: 100px; gap: 40px; }
            .ai-search-container { padding: 30px 20px; }
            .search-title { font-size: 1.5rem; }
            .search-box { flex-direction: column; border-radius: 20px; }
            .search-btn { border-radius: 16px; }
        }
    </style>
</head>
<body>
    <!-- 头部：通栏，适配所有屏幕，包含logo/导航/语言/设置/广告 -->
    <header class="header-container">
        <div class="logo" id="logoText">圆几何交互式学习平台</div>
        <nav class="nav-main">
            <a href="index.html" class="nav-link" id="navHome">首页</a>
            <a href="game.html" class="nav-link" id="navGame">游戏</a>
            <a href="home.html" class="nav-link" id="navQuiz">测试</a>
        </nav>
        <div class="header-right">
            <div class="lang-switch">
                <a href="javascript:;" class="lang-link active" data-lang="zh-CN" id="langZh">简体中文</a>
                <span>/</span>
                <a href="javascript:;" class="lang-link" data-lang="en" id="langEn">English</a>
            </div>
            <div class="setting-wrap">
                <a href="javascript:;" class="setting-icon"><i class="fas fa-cog"></i></a>
                <div class="setting-menu">
                    <a href="javascript:;" class="menu-item" data-style="eye" id="menuEye">护眼模式</a>
                    <a href="javascript:;" class="menu-item" data-style="night" id="menuNight">夜晚模式</a>
                    <a href="javascript:;" class="menu-item" data-style="default" id="menuDefault">默认模式</a>
                    <!-- 字体大小滑块 -->
                    <div class="font-size-slider-wrap">
                        <label class="font-size-label" id="fontSizeLabel">字体大小调节</label>
                        <input type="range" class="font-size-slider" id="fontSizeSlider" min="12" max="24" value="16" step="1">
                        <div class="font-size-value" id="fontSizeValue">当前字体：16px</div>
                    </div>
                    <a href="javascript:;" class="menu-item" id="contactUs">联系我们</a>
                    <a href="#" class="menu-item" id="menuHelp">使用说明</a>
                </div>
            </div>
            <div class="ad-tip">
                <a href="https://m.zhuanzhuan.com/" class="ad-link" id="adLink">关于广告</a>
            </div>
        </div>
    </header>

    <!-- 主体内容：通栏自适应，轮播图+AI搜索栏 -->
    <main class="main-container">
        <div class="carousel-container">
            <div class="carousel-wrap">
                <div class="carousel-list">
                   <a href="indexPicture01.html" class="carousel-item"><img src="image/carousel_01.jpg" alt="圆几何知识点轮播图1" class="carousel-img"></a>
                   <a href="indexPicture02.html" class="carousel-item"><img src="image/carousel_02.jpg" alt="圆几何知识点轮播图2" class="carousel-img"></a>
                   <a href="indexPicture03.html" class="carousel-item"><img src="image/carousel_03.jpg" alt="圆几何知识点轮播图3" class="carousel-img"></a>
                   <a href="indexPicture04.html" class="carousel-item"><img src="image/carousel_04.jpg" alt="圆几何知识点轮播图4" class="carousel-img"></a>
                   <a href="indexPicture05.html" class="carousel-item"><img src="image/carousel_05.jpg" alt="圆几何知识点轮播图5" class="carousel-img"></a>
                </div>
            </div>
        </div>

        <div class="ai-search-container">
            <h3 class="search-title" id="searchTitle">AI圆几何知识点问答</h3>
            <div class="search-box">
                <input type="text" class="search-input" placeholder="请输入圆几何相关知识点，如：圆的垂径定理..." autocomplete="off" id="searchPlaceholder">
                <button class="search-btn" id="searchBtn">发送查询</button>
            </div>
        </div>
    </main>

    <!-- AI回复弹窗：默认隐藏，可关闭，自适应屏幕 -->
    <div class="ai-modal" id="aiModal">
        <div class="ai-modal-content">
            <span class="modal-close" id="modalClose">&times;</span>
            <h4 class="modal-title" id="modalTitle">AI知识点解答</h4>
            <div class="modal-result" id="modalResult"></div>
        </div>
    </div>

    <!-- 联系我们弹窗 -->
    <div class="contact-modal" id="contactModal">
        <div class="contact-modal-content">
            <span class="modal-close" id="contactModalClose">&times;</span>
            <h4 class="contact-title" id="contactTitle">联系我们</h4>
            <div class="contact-info" id="contactInfo">
                如果遇到问题，请联系我们的邮箱：<br>
                <strong>3058168199@qq.com</strong>
            </div>
        </div>
    </div>

    <!-- 核心JS：轮播/模式/AI接口/弹窗，全部嵌入 -->
    <script>
        // ********** 语言文本映射表 **********
        const langTexts = {
            'zh-CN': {
                logoText: '圆几何交互式学习平台',
                navHome: '首页',
                navGame: '游戏',
                navQuiz: '测试',
                langZh: '简体中文',
                langEn: 'English',
                menuEye: '护眼模式',
                menuNight: '夜晚模式',
                menuDefault: '默认模式',
                fontSizeLabel: '字体大小调节',
                fontSizeValue: '当前字体：{size}px',
                contactUs: '联系我们',
                menuHelp: '使用说明',
                adLink: '关于广告',
                searchTitle: 'AI圆几何知识点问答',
                searchPlaceholder: '请输入圆几何相关知识点，如：圆的垂径定理...',
                searchBtn: '发送查询',
                modalTitle: 'AI知识点解答',
                contactTitle: '联系我们',
                contactInfo: '如果遇到问题，请联系我们的邮箱：<br><strong>3058168199@qq.com</strong>',
                errorEmpty: '请输入圆几何相关的查询问题！',
                loading: 'AI正在为你查询，请稍候...',
                errorNoAnswer: 'AI查询失败：响应中无文本回答！',
                errorFormat: 'AI查询失败：响应格式异常！响应数据：<br>{data}',
                errorApi: 'AI查询失败：{code} - {msg}！',
                errorNetwork: '调用失败（总耗时：{time}ms）：{msg}',
                errorConsole: '可打开F12控制台查看完整日志',
                errorCORS: '网络错误：跨域限制！请搭建后端代理或临时禁用浏览器跨域测试。',
                error401: 'API_KEY无效/过期！请检查你的API_KEY。',
                errorOther: '网络错误：{msg}，请检查网络或API配置！'
            },
            'en': {
                logoText: 'Interactive Learning Platform for Circle Geometry',
                navHome: 'Home',
                navGame: 'Game',
                navQuiz: 'Quiz',
                langZh: 'Simplified Chinese',
                langEn: 'English',
                menuEye: 'Eye Protection Mode',
                menuNight: 'Night Mode',
                menuDefault: 'Default Mode',
                fontSizeLabel: 'Font Size Adjustment',
                fontSizeValue: 'Current Font: {size}px',
                contactUs: 'Contact Us',
                menuHelp: 'Usage Instructions',
                adLink: 'About Ads',
                searchTitle: 'AI Q&A for Circle Geometry Knowledge',
                searchPlaceholder: 'Enter circle geometry knowledge, e.g.: Vertical Chord Theorem...',
                searchBtn: 'Send Query',
                modalTitle: 'AI Knowledge Answer',
                contactTitle: 'Contact Us',
                contactInfo: 'If you encounter problems, please contact our email:<br><strong>3058168199@qq.com</strong>',
                errorEmpty: 'Please enter a query related to circle geometry!',
                loading: 'AI is querying for you, please wait...',
                errorNoAnswer: 'AI query failed: No text answer in response!',
                errorFormat: 'AI query failed: Abnormal response format! Response data:<br>{data}',
                errorApi: 'AI query failed: {code} - {msg}!',
                errorNetwork: 'Call failed (Total time: {time}ms): {msg}',
                errorConsole: 'Open F12 console to view complete logs',
                errorCORS: 'Network error: CORS restriction! Please set up a backend proxy or disable browser CORS temporarily for testing.',
                error401: 'API_KEY is invalid/expired! Please check your API_KEY.',
                errorOther: 'Network error: {msg}, please check network or API configuration!'
            }
        };

        // ********** 全局变量 **********
        const carouselList = document.querySelector('.carousel-list');
        const carouselItems = document.querySelectorAll('.carousel-item');
        const aiModal = document.getElementById('aiModal');
        const modalClose = document.getElementById('modalClose');
        const searchBtn = document.querySelector('.search-btn');
        const searchInput = document.querySelector('.search-input');
        const modalResult = document.getElementById('modalResult');
        const settingWrap = document.querySelector('.setting-wrap');
        const settingMenu = document.querySelector('.setting-menu');
        const fontSizeSlider = document.getElementById('fontSizeSlider');
        const fontSizeValue = document.getElementById('fontSizeValue');
        const contactUs = document.getElementById('contactUs');
        const contactModal = document.getElementById('contactModal');
        const contactModalClose = document.getElementById('contactModalClose');
        let currentIndex = 0;
        const totalCarousel = carouselItems.length;
        let menuHideTimer = null; // 设置菜单隐藏延迟定时器
        let currentLang = localStorage.getItem('appLang') || 'zh-CN'; // 默认中文
        let currentTheme = localStorage.getItem('appTheme') || 'default'; // 默认主题

        // ********** 1. 初始化语言和主题 **********
        updateLang(currentLang);
        applyTheme(currentTheme);

        // ********** 模式切换（护眼/夜晚）函数 **********
        function applyTheme(theme) {
            currentTheme = theme;
            localStorage.setItem('appTheme', theme);
            const body = document.body;
            body.classList.remove('eye-mode', 'night-mode');
            if (theme === 'eye') body.classList.add('eye-mode');
            if (theme === 'night') body.classList.add('night-mode');
        }

        // ********** 语言切换函数 **********
        function updateLang(lang) {
            currentLang = lang;
            localStorage.setItem('appLang', lang); // 保存到本地存储
            const texts = langTexts[lang];
            
            // 更新页面文本
            document.getElementById('logoText').textContent = texts.logoText;
            document.getElementById('navHome').textContent = texts.navHome;
            document.getElementById('navGame').textContent = texts.navGame;
            document.getElementById('navQuiz').textContent = texts.navQuiz;
            document.getElementById('langZh').textContent = texts.langZh;
            document.getElementById('langEn').textContent = texts.langEn;
            document.getElementById('menuEye').textContent = texts.menuEye;
            document.getElementById('menuNight').textContent = texts.menuNight;
            document.getElementById('menuDefault').textContent = texts.menuDefault;
            document.getElementById('fontSizeLabel').textContent = texts.fontSizeLabel;
            document.getElementById('fontSizeValue').textContent = texts.fontSizeValue.replace('{size}', fontSizeSlider.value);
            document.getElementById('contactUs').textContent = texts.contactUs;
            document.getElementById('menuHelp').textContent = texts.menuHelp;
            document.getElementById('adLink').textContent = texts.adLink;
            document.getElementById('searchTitle').textContent = texts.searchTitle;
            document.getElementById('searchPlaceholder').placeholder = texts.searchPlaceholder;
            document.getElementById('searchBtn').textContent = texts.searchBtn;
            document.getElementById('modalTitle').textContent = texts.modalTitle;
            document.getElementById('contactTitle').textContent = texts.contactTitle;
            document.getElementById('contactInfo').innerHTML = texts.contactInfo;
            
            // 更新html lang属性
            document.documentElement.lang = lang;
            
            // 更新语言按钮激活状态
            document.querySelectorAll('.lang-link').forEach(link => {
                link.classList.remove('active');
                if (link.dataset.lang === lang) {
                    link.classList.add('active');
                }
            });
        }

        // ********** 2. 轮播图：自动循环2秒，循环播放5张 **********
        function carouselPlay() {
            currentIndex = (currentIndex + 1) % totalCarousel;
            carouselList.style.transform = `translateX(-${currentIndex * 20}%)`;
        }
        // 页面加载后启动轮播
        window.onload = function() {
            setInterval(carouselPlay, 2000);
            // 初始化弹窗隐藏
            aiModal.style.display = 'none';
            contactModal.style.display = 'none';
        };

        // ********** 3. 设置下拉菜单：鼠标悬浮至少停留1秒 **********
        settingWrap.addEventListener('mouseenter', () => {
            // 清除延迟隐藏定时器
            clearTimeout(menuHideTimer);
            settingMenu.style.display = 'block';
        });

        settingWrap.addEventListener('mouseleave', () => {
            // 延迟1秒隐藏菜单
            menuHideTimer = setTimeout(() => {
                settingMenu.style.display = 'none';
            }, 1000);
        });

        // 鼠标进入菜单时清除隐藏定时器（防止误关）
        settingMenu.addEventListener('mouseenter', () => {
            clearTimeout(menuHideTimer);
        });

        // 鼠标离开菜单时延迟1秒隐藏
        settingMenu.addEventListener('mouseleave', () => {
            menuHideTimer = setTimeout(() => {
                settingMenu.style.display = 'none';
            }, 1000);
        });

        // ********** 4. 模式切换（护眼/夜晚） **********
        const menuItems = document.querySelectorAll('.menu-item[data-style]');
        menuItems.forEach(item => {
            item.addEventListener('click', () => {
                applyTheme(item.dataset.style);
            });
        });

        // ********** 5. 字体大小滑块控制：等比例缩放所有汉字 **********
        const root = document.documentElement;
        // 初始化字体大小
        const savedFontSize = localStorage.getItem('appFontSize') || '16';
        fontSizeSlider.value = savedFontSize;
        root.style.setProperty('--font-size', `${savedFontSize}px`);
        fontSizeValue.textContent = langTexts[currentLang].fontSizeValue.replace('{size}', savedFontSize);

        // 滑块事件
        fontSizeSlider.addEventListener('input', () => {
            const fontSize = fontSizeSlider.value;
            localStorage.setItem('appFontSize', fontSize); // 保存到本地存储
            root.style.setProperty('--font-size', `${fontSize}px`);
            fontSizeValue.textContent = langTexts[currentLang].fontSizeValue.replace('{size}', fontSize);
        });

        // ********** 6. 语言切换事件 **********
        const langLinks = document.querySelectorAll('.lang-link');
        langLinks.forEach(link => {
            link.addEventListener('click', () => {
                updateLang(link.dataset.lang);
            });
        });

        // ********** 7. AI弹窗：关闭功能 **********
        modalClose.addEventListener('click', () => {
            aiModal.style.display = 'none';
            // 清空输入框和弹窗内容
            searchInput.value = '';
            modalResult.innerHTML = '';
        });
        // 点击遮罩层关闭弹窗
        aiModal.addEventListener('click', (e) => {
            if (e.target === aiModal) {
                aiModal.style.display = 'none';
                searchInput.value = '';
                modalResult.innerHTML = '';
            }
        });

        // ********** 8. 联系我们弹窗控制 **********
        contactUs.addEventListener('click', () => {
            contactModal.style.display = 'flex';
        });

        contactModalClose.addEventListener('click', () => {
            contactModal.style.display = 'none';
        });

        // 点击遮罩层关闭联系弹窗
        contactModal.addEventListener('click', (e) => {
            if (e.target === contactModal) {
                contactModal.style.display = 'none';
            }
        });

// 火山方舟API Key（你的密钥）
const API_KEY = "67805b72-0e18-42da-921d-b6a86a0746da";
// 火山方舟API地址（替换原豆包地址）
const API_URL = "https://ark.cn-beijing.volces.com/api/v3/responses";

// 搜索按钮点击事件
searchBtn.addEventListener('click', () => {
    getAiAnswer();
});
// 回车触发搜索
searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
        getAiAnswer();
    }
});

// 调用火山方舟API获取答案
async function getAiAnswer() {
    const question = searchInput.value.trim();
    const texts = langTexts[currentLang];
    if (!question) {
        modalResult.innerHTML = `<p style="color: #ef4444;">${texts.errorEmpty}</p>`;
        aiModal.style.display = 'flex';
        return;
    }
    modalResult.innerHTML = `<p style="color: #2563eb; text-align: center;">${texts.loading}</p>`;
    aiModal.style.display = 'flex';

    // 新增：记录请求开始时间（统计耗时）
    const startTime = Date.now();

    try {
        // 1. 构造请求参数并打印（看参数是否正确）
        const requestData = {
            "model": "doubao-seed-2-0-pro-260215",
            "input": [
                {
                    "role": "user",
                    "content": [
                        {
                            "type": "input_text",
                            "text": question
                        }
                    ]
                }
            ]
        };
        console.log('🚀 发送请求参数：', JSON.stringify(requestData, null, 2));

        // 2. 发送请求
        const response = await fetch(API_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${API_KEY}`
            },
            body: JSON.stringify(requestData)
        });

        // 新增：打印响应基础信息（状态码、耗时、响应头）
        const endTime = Date.now();
        console.log(`📡 响应状态码：${response.status} (耗时：${endTime - startTime}ms)`);
        console.log('📨 响应头：', Object.fromEntries(response.headers.entries()));

        // 3. 解析响应全量数据（关键：看API到底返回了什么）
        const rawData = await response.text(); // 先以文本形式获取，避免JSON解析失败
        console.log('🔍 响应原始数据：', rawData);
        
        // 尝试转JSON
        let data;
        try {
            data = JSON.parse(rawData);
        } catch (jsonError) {
            throw new Error(`响应不是合法JSON：${rawData}`);
        }

        // 4. 检查HTTP状态码
        if (!response.ok) {
            throw new Error(`API返回错误（${response.status}）：${JSON.stringify(data, null, 2)}`);
        }

        // 5. 详细打印返回数据（看是否有隐藏的error或其他字段）
        console.log('✅ 解析后的响应数据：', JSON.stringify(data, null, 2));

        // 6. 适配响应逻辑（更宽松的判断）
        if (data.output && data.output.length > 0) {
            // 遍历所有output，找text类型的内容
            let answer = '';
            for (const outputItem of data.output) {
                if (outputItem.content && outputItem.content.length > 0) {
                    for (const contentItem of outputItem.content) {
                        if (contentItem.type === 'output_text' && contentItem.text) {
                            answer = contentItem.text;
                            break;
                        }
                    }
                    if (answer) break;
                }
            }
            if (answer) {
                modalResult.innerHTML = answer.replace(/\n/g, '<br>');
            } else {
                modalResult.innerHTML = `<p style="color: #ef4444;">${texts.errorNoAnswer}</p>`;
            }
        } else if (data.error) {
            modalResult.innerHTML = `<p style="color: #ef4444;">${texts.errorApi.replace('{code}', data.error.code || '未知错误').replace('{msg}', data.error.message)}</p>`;
        } else {
            modalResult.innerHTML = `<p style="color: #ef4444;">${texts.errorFormat.replace('{data}', JSON.stringify(data, null, 2))}</p>`;
        }

    } catch (error) {
        // 新增：打印完整错误栈
        console.error('❌ 调用过程完整错误：', error);
        const costTime = Date.now() - startTime;
        // 友好提示+详细错误
        let errorMsg = texts.errorNetwork.replace('{time}', costTime).replace('{msg}', error.message);
        if (error.message.includes('CORS')) {
            errorMsg = `<p style="color: #ef4444;">${texts.errorCORS}</p>`;
        } else if (error.message.includes('401')) {
            errorMsg = `<p style="color: #ef4444;">${texts.error401}</p>`;
        } else if (!error.message.includes('API返回错误')) {
            errorMsg = `<p style="color: #ef4444;">${texts.errorOther.replace('{msg}', error.message)}</p>`;
        }
        modalResult.innerHTML = `${errorMsg}<p style="font-size: 12px; color: #666; margin-top: 8px;">${texts.errorConsole}</p>`;
    }
}
