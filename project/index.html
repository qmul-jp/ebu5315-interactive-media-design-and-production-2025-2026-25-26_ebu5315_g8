<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>圆几何交互式学习平台</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- MathJax for rendering math formulas -->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
            }
        };
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&display=swap');

        /* 加载动画样式 */
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease-out;
        }

        #loading-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .logo-icon-final {
            width: 28px;
            height: 28px;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.8), rgba(37, 99, 235, 0.4) 60%, rgba(37, 99, 235, 0.2));
            border-radius: 50%;
            display: inline-block;
            vertical-align: middle;
            margin-right: 12px;
            box-shadow: 
                0 4px 10px rgba(37, 99, 235, 0.2),
                inset 0 2px 4px rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .logo-icon-final.visible {
            opacity: 1;
            transform: scale(1);
        }

    /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Trebuchet MS", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
        }

        :root {
            --primary: #2563eb;
            --primary-strong: #1d4ed8;
            --text: #1f2937;
            --muted: #64748b;
            --bg-color: #f8fafc;
            --surface: rgba(255, 255, 255, 0.85);
            --surface-strong: #ffffff;
            --border-color: #e2e8f0;
            --shadow-lg: 0 24px 60px rgba(31, 41, 55, 0.12);
            --shadow-md: 0 16px 32px rgba(31, 41, 55, 0.08);
            --radius-xl: 28px;
            --radius-lg: 22px;
            --radius-md: 16px;
            --font-size: 16px;
        }

        body {
            color: var(--text);
            font-size: var(--font-size);
            background:
                radial-gradient(circle at 12% 10%, rgba(37, 99, 235, 0.1), transparent 22%),
                radial-gradient(circle at 86% 14%, rgba(37, 99, 235, 0.1), transparent 20%),
                linear-gradient(rgba(180, 154, 109, 0.12) 1px, transparent 1px),
                linear-gradient(90deg, rgba(180, 154, 109, 0.12) 1px, transparent 1px),
                linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
            background-size: auto, auto, 46px 46px, 46px 46px, auto;
            background-attachment: fixed;
            min-height: 100vh;
            overflow-x: hidden;
            transition: all 0.3s ease-in-out;
            line-height: 1.6;
        }

        /* 模式切换：护眼/夜晚，修改CSS变量 */
        body.eye-mode {
            --bg-color: #f0f9eb;
            --surface: rgba(247, 251, 242, 0.88);
            --text: #166534;
            --border-color: #c7e3b4;
            --primary: #438a4c;
            --primary-strong: #3f6234;
        }
        body.night-mode {
            --text: #f1f5f9;
            --muted: #94a3b8;
            --primary: #60a5fa;
            --primary-strong: #3b82f6;
            --surface: rgba(15, 23, 42, 0.9);
            --surface-strong: #0f172a;
            --border-color: #334155;
            --bg-color: #020617;
            background:
                radial-gradient(circle at 12% 10%, rgba(56, 189, 248, 0.15), transparent 25%),
                radial-gradient(circle at 86% 14%, rgba(56, 189, 248, 0.15), transparent 22%),
                linear-gradient(rgba(56, 189, 248, 0.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56, 189, 248, 0.2) 1px, transparent 1px),
                linear-gradient(180deg, #020617 0%, #0f172a 100%);
            background-size: auto, auto, 46px 46px, 46px 46px, auto;
        }

        a {
            text-decoration: none;
            color: inherit;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 头部样式：现代化设计 */
        .header-container {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
            width: 100%;
            height: 80px;
            padding: 0 4vw;
            background: var(--surface);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-md);
        }

        .logo {
            font-size: clamp(1.2rem, 2.5vw, 1.65rem);
            font-weight: 800;
            font-family: "Orbitron", "Trebuchet MS", "Microsoft YaHei", "PingFang SC", sans-serif;
            letter-spacing: 1.2px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #2563eb 0%, #60a5fa 55%, #dbeafe 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 18px rgba(59, 130, 246, 0.35);
            position: relative;
        }
        .logo::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: -8px;
            height: 2px;
            background: linear-gradient(90deg, rgba(37, 99, 235, 0.85), rgba(96, 165, 250, 0));
            border-radius: 999px;
        }
        .logo i { font-size: 1.4rem; }

        .nav-main {
            display: flex;
            gap: 2.5vw;
            background: rgba(15, 23, 42, 0.04);
            padding: 6px;
            border-radius: 100px;
            position: relative;
            isolation: isolate;
        }
        .nav-droplet {
            position: absolute;
            top: 6px;
            left: 6px;
            width: 0;
            height: calc(100% - 12px);
            border-radius: 999px;
            pointer-events: none;
            opacity: 0;
            transform: translateX(0) scale(var(--nav-drop-sx, 0.92), var(--nav-drop-sy, 0.92));
            transition:
                transform 0.38s cubic-bezier(0.22, 1, 0.36, 1),
                width 0.38s cubic-bezier(0.22, 1, 0.36, 1),
                opacity 0.2s ease;
            background:
                radial-gradient(circle at 25% 30%, rgba(255, 255, 255, 0.75), rgba(255, 255, 255, 0) 45%),
                radial-gradient(circle at 70% 72%, rgba(37, 99, 235, 0.2), rgba(37, 99, 235, 0) 62%),
                linear-gradient(145deg, rgba(255, 255, 255, 0.36), rgba(255, 255, 255, 0.08));
            border: 1px solid rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(8px) saturate(150%) contrast(120%);
            -webkit-backdrop-filter: blur(8px) saturate(150%) contrast(120%);
            box-shadow:
                0 12px 26px rgba(15, 23, 42, 0.24),
                inset 0 2px 0 rgba(255, 255, 255, 0.82),
                inset 0 -10px 18px rgba(15, 23, 42, 0.15);
            z-index: 0;
        }
        .nav-main:hover .nav-droplet,
        .nav-main:focus-within .nav-droplet {
            opacity: 1;
            transform: translateX(var(--nav-drop-x, 0px)) scale(var(--nav-drop-sx, 1), var(--nav-drop-sy, 1));
            width: var(--nav-drop-w, 96px);
        }
        .nav-main.is-nav-droplet-moving .nav-droplet {
            border-radius: 999px 26px 999px 26px;
        }
        .nav-link {
            font-size: 0.95rem;
            color: var(--muted);
            font-weight: 600;
            padding: 8px 24px;
            border-radius: 100px;
            position: relative;
            z-index: 1;
            transform-origin: center center;
            transition: color 0.28s ease, text-shadow 0.28s ease, transform 0.34s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .nav-link:hover {
            color: #1d4ed8;
            text-shadow: 0 0 10px rgba(147, 197, 253, 0.65);
            background: transparent;
        }
        .nav-link.nav-hovered {
            color: #1d4ed8;
            text-shadow: 0 0 10px rgba(147, 197, 253, 0.65);
        }
        .nav-main:hover .nav-link.nav-side,
        .nav-main:focus-within .nav-link.nav-side {
            transform: scale(1.06);
        }
        .nav-main:hover .nav-link.nav-peak,
        .nav-main:focus-within .nav-link.nav-peak {
            transform: scale(1.14);
        }
        .nav-link.active {
            color: white;
            background: var(--primary);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 1.5vw;
        }

        .lang-switch {
            font-size: 0.85rem;
            color: var(--muted);
            background: var(--surface-strong);
            padding: 6px 16px;
            border-radius: 100px;
            border: 1px solid var(--border-color);
        }
        .lang-link { color: var(--muted); cursor: pointer; }
        .lang-link.active { color: var(--primary); font-weight: 700; }

        .setting-icon {
            font-size: 1.2rem;
            color: var(--muted);
            width: 42px;
            height: 42px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.34), rgba(255, 255, 255, 0.1));
            backdrop-filter: blur(8px) saturate(160%) contrast(120%);
            -webkit-backdrop-filter: blur(8px) saturate(160%) contrast(120%);
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.72);
            box-shadow:
                0 16px 32px rgba(15, 23, 42, 0.34),
                0 2px 0 rgba(255, 255, 255, 0.45) inset,
                0 -10px 18px rgba(15, 23, 42, 0.12) inset;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .setting-icon:hover {
            color: var(--primary);
            transform: rotate(45deg) translateY(-2px);
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.46), rgba(255, 255, 255, 0.16));
            border-color: rgba(255, 255, 255, 0.9);
            box-shadow:
                0 20px 40px rgba(15, 23, 42, 0.45),
                0 2px 0 rgba(255, 255, 255, 0.65) inset,
                0 -10px 18px rgba(15, 23, 42, 0.16) inset;
        }

        .setting-menu {
            display: none;
            position: absolute;
            top: 90px;
            right: 4vw;
            width: 240px;
            background: var(--surface-strong);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-lg);
            padding: 16px;
            z-index: 10000;
            animation: slideDown 0.3s ease-out;
            overflow: hidden;
            isolation: isolate;
        }
        .setting-droplet {
            position: absolute;
            left: 16px;
            top: 16px;
            width: calc(100% - 32px);
            height: 0;
            border-radius: var(--setting-drop-radius, 10px);
            opacity: 0;
            pointer-events: none;
            transform: translateY(var(--setting-drop-y, 0px)) scale(var(--setting-drop-sx, 0.96), var(--setting-drop-sy, 0.96));
            transition:
                transform 0.36s cubic-bezier(0.22, 1, 0.36, 1),
                height 0.36s cubic-bezier(0.22, 1, 0.36, 1),
                opacity 0.2s ease;
            background:
                radial-gradient(circle at 18% 22%, rgba(255, 255, 255, 0.78), rgba(255, 255, 255, 0) 42%),
                radial-gradient(circle at 82% 85%, rgba(37, 99, 235, 0.18), rgba(37, 99, 235, 0) 65%),
                linear-gradient(150deg, rgba(255, 255, 255, 0.36), rgba(255, 255, 255, 0.1));
            border: 1px solid rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(8px) saturate(155%) contrast(120%);
            -webkit-backdrop-filter: blur(8px) saturate(155%) contrast(120%);
            box-shadow:
                0 14px 30px rgba(15, 23, 42, 0.22),
                inset 0 2px 0 rgba(255, 255, 255, 0.82),
                inset 0 -10px 18px rgba(15, 23, 42, 0.12);
            z-index: 2;
        }
        .setting-menu:hover .setting-droplet,
        .setting-menu:focus-within .setting-droplet {
            opacity: 1;
            transform: translateY(var(--setting-drop-y, 0px)) scale(var(--setting-drop-sx, 1), var(--setting-drop-sy, 1));
            height: var(--setting-drop-h, 40px);
        }
        .setting-menu.hide-droplet .setting-droplet {
            opacity: 0 !important;
        }
        .setting-menu.is-droplet-moving .setting-droplet {
            border-radius: 16px 10px 16px 10px;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            font-size: 0.9rem;
            color: var(--text);
            border-radius: 10px;
            margin-bottom: 4px;
            cursor: pointer;
            position: relative;
            z-index: 3;
            transition: color 0.26s ease, text-shadow 0.26s ease;
        }
        .menu-item:hover {
            background: transparent;
            color: var(--primary);
        }
        .menu-item.setting-hovered,
        .font-size-slider-wrap.setting-hovered .font-size-label {
            color: var(--primary);
            text-shadow: 0 0 10px rgba(147, 197, 253, 0.6);
        }

        .font-size-slider-wrap {
            padding: 14px;
            background: var(--bg-color);
            border-radius: 12px;
            margin: 10px 0;
            position: relative;
            z-index: 1;
            transition: color 0.26s ease, text-shadow 0.26s ease;
        }
        .font-size-slider-wrap > * {
            position: relative;
            z-index: 3;
        }
        .slider-drag-droplet {
            position: absolute;
            left: 0;
            top: 0;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.85);
            transition: opacity 0.16s ease, transform 0.2s ease;
            background:
                radial-gradient(circle at 30% 28%, rgba(255, 255, 255, 0.86), rgba(255, 255, 255, 0) 44%),
                linear-gradient(150deg, rgba(255, 255, 255, 0.48), rgba(255, 255, 255, 0.16));
            border: 1px solid rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(7px) saturate(155%);
            -webkit-backdrop-filter: blur(7px) saturate(155%);
            box-shadow:
                0 10px 20px rgba(15, 23, 42, 0.18),
                inset 0 1px 0 rgba(255, 255, 255, 0.95);
            z-index: 4;
        }
        .slider-drag-droplet.active {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        /* 设置菜单专属：禁用旧扫光，避免与水滴层叠加导致重影 */
        .setting-menu .menu-item::before {
            display: none;
        }
        .setting-menu .menu-item:hover {
            transform: none;
            box-shadow: none;
            filter: none;
        }
        .font-size-label { font-size: 0.85rem; margin-bottom: 8px; font-weight: 600; }
        .font-size-slider { width: 100%; cursor: pointer; }
        .font-size-value { font-size: 0.75rem; text-align: center; margin-top: 6px; color: var(--muted); }

        .ad-tip {
            position: absolute;
            bottom: -25px;
            right: 0;
            font-size: 0.75rem;
            color: var(--muted);
        }

        /* 主体内容布局 */
        .main-container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 120px 4vw 60px;
            display: flex;
            flex-direction: column;
            gap: 60px;
            align-items: center;
        }

        .carousel-container {
            width: 100%;
            max-width: 1200px;
            border-radius: var(--radius-xl);
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
        }
        .carousel-wrap { position: relative; width: 100%; padding-bottom: 40%; }
        .carousel-list { position: absolute; top: 0; left: 0; width: 500%; height: 100%; display: flex; transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
        .carousel-item { width: 20%; height: 100%; }

        .ai-search-container {
            width: 100%;
            max-width: 900px;
            background:
                radial-gradient(circle at 18% 20%, rgba(255, 255, 255, 0.42), rgba(255, 255, 255, 0.08) 45%, rgba(255, 255, 255, 0.02) 70%),
                linear-gradient(150deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0.08));
            padding: 50px;
            border-radius: 58px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow:
                0 22px 45px rgba(15, 23, 42, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.72),
                inset 0 -18px 28px rgba(15, 23, 42, 0.08);
            backdrop-filter: blur(28px) saturate(150%);
            -webkit-backdrop-filter: blur(28px) saturate(150%);
            text-align: center;
            position: relative;
            overflow: visible;
            isolation: isolate;
        }
        .ai-search-container::before {
            content: "";
            position: absolute;
            inset: -2px;
            padding: 3px;
            border-radius: 62px;
            pointer-events: none;
            background:
                radial-gradient(circle at 10% 15%, rgba(255, 255, 255, 0.32), rgba(255, 255, 255, 0) 40%),
                radial-gradient(circle at 88% 84%, rgba(56, 189, 248, 0.1), rgba(56, 189, 248, 0) 48%),
                linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.04));
            backdrop-filter: blur(22px) saturate(220%) contrast(165%);
            -webkit-backdrop-filter: blur(22px) saturate(220%) contrast(165%);
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            z-index: 1;
        }
        .ai-search-container::after {
            content: "";
            position: absolute;
            inset: 10px;
            border-radius: 52px;
            pointer-events: none;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.24), rgba(255, 255, 255, 0));
            opacity: 0.6;
            z-index: 1;
        }

        /* 知识模块网格 */
        .knowledge-modules-grid {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            margin-top: 20px;
        }

        .knowledge-card {
            aspect-ratio: 1 / 1;
            background:
                radial-gradient(circle at 18% 20%, rgba(255, 255, 255, 0.42), rgba(255, 255, 255, 0.08) 45%, rgba(255, 255, 255, 0.02) 70%),
                linear-gradient(150deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0.08));
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow:
                0 15px 35px rgba(15, 23, 42, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.72),
                inset 0 -12px 20px rgba(15, 23, 42, 0.05);
            backdrop-filter: blur(20px) saturate(150%);
            -webkit-backdrop-filter: blur(20px) saturate(150%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            isolation: isolate;
            text-decoration: none; /* 确保作为链接时无下划线 */
        }

        .knowledge-card::before {
            content: "";
            position: absolute;
            inset: -2px;
            padding: 2px;
            border-radius: 42px;
            pointer-events: none;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0.05));
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            z-index: 1;
        }

        .knowledge-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 25px 50px rgba(37, 99, 235, 0.25);
            border-color: var(--primary);
        }

        .knowledge-card i {
            font-size: 3.5rem;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #2563eb 0%, #60a5fa 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            transition: transform 0.4s;
        }

        .knowledge-card:hover i {
            transform: scale(1.1) rotate(5deg);
        }

        .knowledge-card h4 {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 12px;
        }

        .knowledge-card p {
            font-size: 0.9rem;
            color: var(--muted);
            line-height: 1.5;
        }

        /* VIP模块样式 */
        .vip-banner-container {
            width: 100%;
            max-width: 1200px;
            margin-top: 40px;
        }

        .vip-banner {
            width: 100%;
            background: 
                radial-gradient(circle at 5% 50%, rgba(245, 158, 11, 0.15), transparent 40%),
                radial-gradient(circle at 95% 50%, rgba(245, 158, 11, 0.15), transparent 40%),
                var(--surface);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            border-radius: 30px;
            padding: 30px 50px;
            border: 1px solid rgba(245, 158, 11, 0.3);
            box-shadow: 
                0 10px 40px rgba(245, 158, 11, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);

                methodsContent: `
                    <div class="content-section">
                        <h5>Learning Chain</h5>

        };

        // ********** 全局变量 **********
        const carouselList = document.querySelector('.carousel-list');
        const carouselItems = document.querySelectorAll('.carousel-item');
        const aiModal = document.getElementById('aiModal');
        const modalClose = document.getElementById('modalClose');
        const searchBtn = document.querySelector('.search-btn');
        const searchInput = document.querySelector('.search-input');
        const modalResult = document.getElementById('modalResult');
        const navMain = document.querySelector('.nav-main');
        const navLinks = navMain ? navMain.querySelectorAll('.nav-link') : [];
        const settingWrap = document.querySelector('.setting-wrap');
        const settingMenu = document.querySelector('.setting-menu');
        const settingTrackItems = settingMenu
            ? settingMenu.querySelectorAll('.menu-item, .font-size-slider-wrap')
            : [];
        const fontSizeSlider = document.getElementById('fontSizeSlider');
        const fontSizeSliderWrap = document.querySelector('.font-size-slider-wrap');
        const sliderDragDroplet = document.getElementById('sliderDragDroplet');
        const fontSizeValue = document.getElementById('fontSizeValue');
        const contactUs = document.getElementById('contactUs');
        const contactModal = document.getElementById('contactModal');
        const contactModalClose = document.getElementById('contactModalClose');
        let currentIndex = 0;
        const totalCarousel = carouselItems.length;
        let menuHideTimer = null; // 设置菜单隐藏延迟定时器
        let currentLang = localStorage.getItem('appLang') || 'zh-CN'; // 默认中文
        let currentTheme = localStorage.getItem('appTheme') || 'default'; // 默认主题

        // ********** 1. 初始化语言和主题 **********
        updateLang(currentLang);
        applyTheme(currentTheme);
        initNavDroplet();
        initSettingMenuDroplet();
        initFontSliderDroplet();

        // ********** 导航栏：水滴凹透镜滑行效果 **********
        function initNavDroplet() {
            if (!navMain || !navLinks.length) return;
            let lastLeft = null;
            let lastWidth = null;
            let navDropletResetTimer = null;

            const moveDropletTo = (target) => {
                const navRect = navMain.getBoundingClientRect();
                const rect = target.getBoundingClientRect();
                const nextLeft = rect.left - navRect.left;
                const nextWidth = rect.width;
                const dx = lastLeft === null ? 0 : Math.abs(nextLeft - lastLeft);
                const dw = lastWidth === null ? 0 : Math.abs(nextWidth - lastWidth);
                const intensity = Math.min(1, (dx + dw * 0.45) / 72);
                const squeezeX = (1 + 0.22 * intensity).toFixed(3);
                const squeezeY = (1 - 0.14 * intensity).toFixed(3);

                navMain.style.setProperty('--nav-drop-x', `${nextLeft}px`);
                navMain.style.setProperty('--nav-drop-w', `${rect.width}px`);
                navMain.style.setProperty('--nav-drop-sx', squeezeX);
                navMain.style.setProperty('--nav-drop-sy', squeezeY);
                navMain.classList.add('is-nav-droplet-moving');
                const targetIndex = Array.from(navLinks).indexOf(target);
                navLinks.forEach((link, index) => {
                    const distance = Math.abs(index - targetIndex);
                    link.classList.toggle('nav-hovered', distance === 0);
                    link.classList.toggle('nav-peak', distance === 0);
                    link.classList.toggle('nav-side', distance === 1);
                });

                clearTimeout(navDropletResetTimer);
                navDropletResetTimer = setTimeout(() => {
                    navMain.style.setProperty('--nav-drop-sx', '1');
                    navMain.style.setProperty('--nav-drop-sy', '1');
                    navMain.classList.remove('is-nav-droplet-moving');
                }, 150);

                lastLeft = nextLeft;
                lastWidth = nextWidth;
            };

            navLinks.forEach(link => {
                link.addEventListener('mouseenter', () => moveDropletTo(link));
                link.addEventListener('focus', () => moveDropletTo(link));
            });

            navMain.addEventListener('mouseleave', () => {
                navLinks.forEach(link => {
                    link.classList.remove('nav-hovered', 'nav-peak', 'nav-side');
                });
                navMain.style.setProperty('--nav-drop-sx', '1');
                navMain.style.setProperty('--nav-drop-sy', '1');
                navMain.classList.remove('is-nav-droplet-moving');
            });

            moveDropletTo(navLinks[0]);
        }

        function initSettingMenuDroplet() {
            if (!settingMenu || !settingTrackItems.length) return;
            let lastTop = null;
            let lastHeight = null;
            let dropletResetTimer = null;

            const moveSettingDropletTo = (target) => {
                const menuRect = settingMenu.getBoundingClientRect();
                const rect = target.getBoundingClientRect();
                const isFontSizeWrap = target.classList.contains('font-size-slider-wrap');
                const dropOffsetY = isFontSizeWrap ? 0 : -6;
                const nextTop = rect.top - menuRect.top + dropOffsetY;
                const nextHeight = rect.height;
                const dy = lastTop === null ? 0 : Math.abs(nextTop - lastTop);
                const dh = lastHeight === null ? 0 : Math.abs(nextHeight - lastHeight);
                const intensity = Math.min(1, (dy + dh * 0.6) / 56);
                const squeezeX = (1 + 0.18 * intensity).toFixed(3);
                const squeezeY = (1 - 0.12 * intensity).toFixed(3);

                settingMenu.classList.toggle('hide-droplet', isFontSizeWrap);
                settingMenu.style.setProperty('--setting-drop-y', `${nextTop}px`);
                settingMenu.style.setProperty('--setting-drop-h', `${rect.height}px`);
                settingMenu.style.setProperty('--setting-drop-radius', isFontSizeWrap ? '12px' : '10px');
                settingMenu.style.setProperty('--setting-drop-sx', squeezeX);
                settingMenu.style.setProperty('--setting-drop-sy', squeezeY);
                settingMenu.classList.add('is-droplet-moving');
                settingTrackItems.forEach(item => item.classList.toggle('setting-hovered', item === target));

                clearTimeout(dropletResetTimer);
                dropletResetTimer = setTimeout(() => {
                    settingMenu.style.setProperty('--setting-drop-sx', '1');
                    settingMenu.style.setProperty('--setting-drop-sy', '1');
                    settingMenu.classList.remove('is-droplet-moving');
                }, 150);

                lastTop = nextTop;
                lastHeight = nextHeight;
            };

            settingTrackItems.forEach(item => {
                item.addEventListener('mouseenter', () => moveSettingDropletTo(item));
                item.addEventListener('focusin', () => moveSettingDropletTo(item));
            });

            settingMenu.addEventListener('mouseleave', () => {
                settingTrackItems.forEach(item => item.classList.remove('setting-hovered'));
                settingMenu.style.setProperty('--setting-drop-sx', '1');
                settingMenu.style.setProperty('--setting-drop-sy', '1');
                settingMenu.classList.remove('is-droplet-moving');
                settingMenu.classList.remove('hide-droplet');
            });

            settingWrap.addEventListener('mouseenter', () => {
                moveSettingDropletTo(settingTrackItems[0]);
            });
        }

        function initFontSliderDroplet() {
            if (!fontSizeSlider || !fontSizeSliderWrap || !sliderDragDroplet) return;
            let isDragging = false;

            const updateFontSliderDropletPosition = () => {
                const sliderRect = fontSizeSlider.getBoundingClientRect();
                const wrapRect = fontSizeSliderWrap.getBoundingClientRect();
                const min = Number(fontSizeSlider.min || 0);
                const max = Number(fontSizeSlider.max || 100);
                const value = Number(fontSizeSlider.value || min);
                const ratio = max === min ? 0 : (value - min) / (max - min);
                const x = sliderRect.left - wrapRect.left + ratio * sliderRect.width;
                const y = sliderRect.top - wrapRect.top + sliderRect.height / 2;
                sliderDragDroplet.style.left = `${x}px`;
                sliderDragDroplet.style.top = `${y}px`;
            };

            const showDroplet = () => {
                isDragging = true;
                updateFontSliderDropletPosition();
                sliderDragDroplet.classList.add('active');
            };

            const hideDroplet = () => {
                isDragging = false;
                sliderDragDroplet.classList.remove('active');
            };

            fontSizeSlider.addEventListener('mousedown', showDroplet);
            fontSizeSlider.addEventListener('touchstart', showDroplet, { passive: true });
            fontSizeSlider.addEventListener('input', () => {
                if (isDragging) updateFontSliderDropletPosition();
            });
            document.addEventListener('mousemove', () => {
                if (isDragging) updateFontSliderDropletPosition();
            });
            document.addEventListener('touchmove', () => {
                if (isDragging) updateFontSliderDropletPosition();
            }, { passive: true });
            document.addEventListener('mouseup', hideDroplet);
            document.addEventListener('touchend', hideDroplet);
            document.addEventListener('touchcancel', hideDroplet);
        }

        // ********** 模式切换（护眼/夜晚）函数 **********
        function applyTheme(theme) {
            currentTheme = theme;
            localStorage.setItem('appTheme', theme);
            const body = document.body;
            body.classList.remove('eye-mode', 'night-mode');
            if (theme === 'eye') body.classList.add('eye-mode');
            if (theme === 'night') body.classList.add('night-mode');
        }

        // ********** 语言切换函数 **********
        function updateLang(lang) {
            currentLang = lang;
            localStorage.setItem('appLang', lang); // 保存到本地存储
            const texts = langTexts[lang];
            
            // 更新页面文本
            document.getElementById('logoText').textContent = texts.logoText;

            document.getElementById('fontSizeLabel').textContent = texts.fontSizeLabel;

            document.getElementById('searchTitle').textContent = texts.searchTitle;
            document.getElementById('searchPlaceholder').placeholder = texts.searchPlaceholder;
            document.getElementById('searchBtn').textContent = texts.searchBtn;
            document.getElementById('modalTitle').textContent = texts.modalTitle;
            document.getElementById('contactTitle').textContent = texts.contactTitle;
            document.getElementById('contactInfo').innerHTML = texts.contactInfo;
            
            // 更新新增模块文本
            document.getElementById('moduleCultureTitle').textContent = texts.moduleCultureTitle;
            document.getElementById('moduleCultureDesc').textContent = texts.moduleCultureDesc;
            document.getElementById('moduleTheoremsTitle').textContent = texts.moduleTheoremsTitle;
            document.getElementById('moduleTheoremsDesc').textContent = texts.moduleTheoremsDesc;
            document.getElementById('moduleMethodsTitle').textContent = texts.moduleMethodsTitle;
            document.getElementById('moduleMethodsDesc').textContent = texts.moduleMethodsDesc;
            document.getElementById('vipTitle').textContent = texts.vipTitle;
            document.getElementById('vipDesc').textContent = texts.vipDesc;
            document.getElementById('vipPriceTag').textContent = texts.vipPriceTag;
            document.getElementById('drawingEntrance').style.setProperty('--tooltip', `"${texts.drawingEntrance}"`);

            // 更新html lang属性
            document.documentElement.lang = lang;
            
            // 更新语言按钮激活状态
            document.querySelectorAll('.lang-link').forEach(link => {
                link.classList.remove('active');

                    link.classList.add('active');

            });

            // 重新渲染页面中的数学公式
            if (window.MathJax && window.MathJax.typeset) {
                window.MathJax.typeset();
            }
        }

        // ********** 2. 轮播图：自动循环2秒，循环播放5张 **********
        function carouselPlay() {
            currentIndex = (currentIndex + 1) % totalCarousel;
            carouselList.style.transform = `translateX(-${currentIndex * 20}%)`;
        }
        // 页面加载后启动轮播
        window.onload = function() {
            setInterval(carouselPlay, 2000);
            // 初始化弹窗隐藏
            aiModal.style.display = 'none';
            contactModal.style.display = 'none';
        };

        // ********** 3. 设置下拉菜单：鼠标悬浮至少停留1秒 **********
        settingWrap.addEventListener('mouseenter', () => {
            // 清除延迟隐藏定时器
            clearTimeout(menuHideTimer);
            settingMenu.style.display = 'block';
        });

        settingWrap.addEventListener('mouseleave', () => {
            // 延迟1秒隐藏菜单
            menuHideTimer = setTimeout(() => {
                settingMenu.style.display = 'none';
            }, 1000);
        });

            clearTimeout(menuHideTimer);
        });

        // 鼠标离开菜单时延迟1秒隐藏
        settingMenu.addEventListener('mouseleave', () => {

                settingMenu.style.display = 'none';

        const menuItems = document.querySelectorAll('.menu-item[data-style]');
        menuItems.forEach(item => {
            item.addEventListener('click', () => {
                applyTheme(item.dataset.style);

        // ********** 5. 字体大小滑块控制：等比例缩放所有汉字 **********
        const root = document.documentElement;

        fontSizeSlider.value = savedFontSize;
        root.style.setProperty('--font-size', `${savedFontSize}px`);
        root.style.fontSize = `${savedFontSize}px`;
        fontSizeValue.textContent = langTexts[currentLang].fontSizeValue.replace('{size}', savedFontSize);

        fontSizeSlider.addEventListener('input', () => {
            const fontSize = fontSizeSlider.value;
            localStorage.setItem('appFontSize', fontSize); // 保存到本地存储

            root.style.fontSize = `${fontSize}px`;
            fontSizeValue.textContent = langTexts[currentLang].fontSizeValue.replace('{size}', fontSize);

        window.addEventListener('storage', (e) => {

            root.style.setProperty('--font-size', `${fontSize}px`);
            root.style.fontSize = `${fontSize}px`;
            fontSizeValue.textContent = langTexts[currentLang].fontSizeValue.replace('{size}', fontSize);
        });

        // ********** 6. 语言切换事件 **********
        const langLinks = document.querySelectorAll('.lang-link');
        langLinks.forEach(link => {
            link.addEventListener('click', () => {
                updateLang(link.dataset.lang);
            });
        });

        // ********** 7. AI弹窗：关闭功能 **********
        modalClose.addEventListener('click', () => {
            aiModal.style.display = 'none';
            // 清空输入框和弹窗内容
            searchInput.value = '';
            modalResult.innerHTML = '';
        });
        // 点击遮罩层关闭弹窗
        aiModal.addEventListener('click', (e) => {
            if (e.target === aiModal) {
                aiModal.style.display = 'none';
                searchInput.value = '';
                modalResult.innerHTML = '';
            }
        });

        // ********** 8. 联系我们弹窗控制 **********
        contactUs.addEventListener('click', () => {
            contactModal.style.display = 'flex';
        });

        contactModalClose.addEventListener('click', () => {
            contactModal.style.display = 'none';
        });

        // 点击遮罩层关闭联系弹窗
        contactModal.addEventListener('click', (e) => {
            if (e.target === contactModal) {
                contactModal.style.display = 'none';
            }
        });

        // ********** 11. 知识模块弹窗逻辑 **********
        const knowledgeCards = document.querySelectorAll('.knowledge-card');

        // 页面跳转逻辑：点击卡片时，确保语言和主题已保存到 localStorage
        knowledgeCards.forEach(card => {
            card.addEventListener('click', (e) => {
                // 默认行为是跳转，这里只需要确保 localStorage 已更新（实际上已经在各自的设置函数里更新了）
            });
        });

       // ********** 11. 绘图工具气泡循环动画 **********
        (function() {
            const bubble = document.getElementById('drawingBubble');
            const particleCanvas = document.getElementById('bubble-particle-canvas');
            const pctx = particleCanvas.getContext('2d');
            let particles = [];
            let particleAnimation;

            class Particle {
                constructor(x, y) {
                    this.x = x;
                    this.y = y;
                    this.vx = (Math.random() - 0.5) * 4;
                    this.vy = (Math.random() - 0.5) * 4;
                    this.radius = Math.random() * 3 + 1;
                    this.alpha = 1;
                    this.color = getComputedStyle(document.documentElement).getPropertyValue('--primary');
                }
                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.alpha -= 0.02;
                }
                draw() {
                    pctx.save();
                    pctx.globalAlpha = this.alpha;
                    pctx.beginPath();
                    pctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    pctx.fillStyle = this.color;
                    pctx.fill();
                    pctx.restore();
                }
            }

            function startParticles() {
                const rect = bubble.getBoundingClientRect();
                const containerRect = document.querySelector('.bubble-container').getBoundingClientRect();
                const centerX = rect.left - containerRect.left + rect.width / 2;
                const centerY = rect.top - containerRect.top + rect.height / 2;
                
                particles = [];
                for (let i = 0; i < 30; i++) {
                    particles.push(new Particle(centerX, centerY));
                }

                function animateParticles() {
                    pctx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
                    particles.forEach((p, i) => {
                        p.update();
                        p.draw();
                        if (p.alpha <= 0) particles.splice(i, 1);
                    });
                    if (particles.length > 0) {
                        particleAnimation = requestAnimationFrame(animateParticles);
                    }
                }
                animateParticles();
            }

            function runCycle() {
                // 1. 缓缓冒出 (emerge)
                bubble.classList.add('emerge');
                
                setTimeout(() => {
                    // 2. 快速拉伸 (stretch)
                    bubble.classList.add('stretch');
                }, 500);

                setTimeout(() => {
                    // 3. 停留2秒后粒子态消失
                    bubble.style.opacity = '0';
                    bubble.style.transform += ' scale(1.1)';
                    startParticles();
                    
                    setTimeout(() => {
                        // 重置状态
                        bubble.classList.remove('emerge', 'stretch');
                        bubble.style.opacity = '';
                        bubble.style.transform = '';
                    }, 500);
                }, 3000); // 0.5s emerge + 0.5s stretch + 2s stay
            }

            // 每隔 4 秒运行一次完整周期
            setInterval(runCycle, 4500);
            setTimeout(runCycle, 1000); // 初始延迟 1 秒启动
        })();

        // ********** 9. AI接口调用：真实问答，返回有效结果 **********
// 火山方舟API Key（你的密钥）
const API_KEY = "67805b72-0e18-42da-921d-b6a86a0746da";
// 火山方舟API地址（替换原豆包地址）
const API_URL = "https://ark.cn-beijing.volces.com/api/v3/responses";

// 搜索按钮点击事件
searchBtn.addEventListener('click', () => {
    getAiAnswer();
});
// 回车触发搜索
searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
        getAiAnswer();
    }
});

// 调用火山方舟API获取答案
async function getAiAnswer() {
    const question = searchInput.value.trim();
    const texts = langTexts[currentLang];
    if (!question) {
        modalResult.innerHTML = `<p style="color: #ef4444;">${texts.errorEmpty}</p>`;
        aiModal.style.display = 'flex';
        return;
    }
    modalResult.innerHTML = `<p style="color: #2563eb; text-align: center;">${texts.loading}</p>`;
    aiModal.style.display = 'flex';

    // 新增：记录请求开始时间（统计耗时）
    const startTime = Date.now();

    try {
        // 1. 构造请求参数并打印（看参数是否正确）
        const requestData = {
            "model": "doubao-seed-2-0-pro-260215",
            "input": [
                {
                    "role": "user",
                    "content": [
                        {
                            "type": "input_text",
                            "text": question
                        }
                    ]
                }
            ]
        };
        console.log('🚀 发送请求参数：', JSON.stringify(requestData, null, 2));

        // 2. 发送请求
        const response = await fetch(API_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${API_KEY}`
            },
            body: JSON.stringify(requestData)
        });

        // 新增：打印响应基础信息（状态码、耗时、响应头）
        const endTime = Date.now();
        console.log(`📡 响应状态码：${response.status} (耗时：${endTime - startTime}ms)`);
        console.log('📨 响应头：', Object.fromEntries(response.headers.entries()));

        // 3. 解析响应全量数据（关键：看API到底返回了什么）
        const rawData = await response.text(); // 先以文本形式获取，避免JSON解析失败
        console.log('🔍 响应原始数据：', rawData);
        
        // 尝试转JSON
        let data;
        try {
            data = JSON.parse(rawData);
        } catch (jsonError) {
            throw new Error(`响应不是合法JSON：${rawData}`);
        }

        // 4. 检查HTTP状态码
        if (!response.ok) {
            throw new Error(`API返回错误（${response.status}）：${JSON.stringify(data, null, 2)}`);
        }

        // 5. 详细打印返回数据（看是否有隐藏的error或其他字段）
        console.log('✅ 解析后的响应数据：', JSON.stringify(data, null, 2));

        // 6. 适配响应逻辑（更宽松的判断）
        if (data.output && data.output.length > 0) {
            // 遍历所有output，找text类型的内容
            let answer = '';
            for (const outputItem of data.output) {
                if (outputItem.content && outputItem.content.length > 0) {
                    for (const contentItem of outputItem.content) {
                        if (contentItem.type === 'output_text' && contentItem.text) {
                            answer = contentItem.text;
                            break;
                        }
                    }
                    if (answer) break;
                }
            }
            if (answer) {
                modalResult.innerHTML = answer.replace(/\n/g, '<br>');
            } else {
                modalResult.innerHTML = `<p style="color: #ef4444;">${texts.errorNoAnswer}</p>`;
            }
        } else if (data.error) {
            modalResult.innerHTML = `<p style="color: #ef4444;">${texts.errorApi.replace('{code}', data.error.code || '未知错误').replace('{msg}', data.error.message)}</p>`;
        } else {
            modalResult.innerHTML = `<p style="color: #ef4444;">${texts.errorFormat.replace('{data}', JSON.stringify(data, null, 2))}</p>`;
        }

    } catch (error) {
        // 新增：打印完整错误栈
        console.error('❌ 调用过程完整错误：', error);
        const costTime = Date.now() - startTime;
        // 友好提示+详细错误
        let errorMsg = texts.errorNetwork.replace('{time}', costTime).replace('{msg}', error.message);
        if (error.message.includes('CORS')) {
            errorMsg = `<p style="color: #ef4444;">${texts.errorCORS}</p>`;
        } else if (error.message.includes('401')) {
            errorMsg = `<p style="color: #ef4444;">${texts.error401}</p>`;
        } else if (!error.message.includes('API返回错误')) {
            errorMsg = `<p style="color: #ef4444;">${texts.errorOther.replace('{msg}', error.message)}</p>`;
        }
        modalResult.innerHTML = `${errorMsg}<p style="font-size: 12px; color: #666; margin-top: 8px;">${texts.errorConsole}</p>`;
    }
}

// ********** 10. 启动加载动画逻辑 **********
(function() {
    const canvas = document.getElementById('loading-canvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('loading-overlay');
    const finalLogoIcon = document.getElementById('finalLogoIcon');

    let width, height;
    let particles = [];
    let animationFrame;
    let phase = 'pi'; // pi, explode, circle, move
    let startTime = Date.now();

    // 强行兜底：如果10秒后还没加载完，强制关闭加载层
    const failSafeTimeout = setTimeout(() => {
        if (overlay && overlay.style.display !== 'none') {
            console.warn('Loading animation timed out, forcing hide.');
            hideOverlay();
        }
    }, 10000);

    function hideOverlay() {
        if (animationFrame) cancelAnimationFrame(animationFrame);
        if (overlay) {
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
                if (finalLogoIcon) finalLogoIcon.classList.add('visible');
            }, 800);
        }
        clearTimeout(failSafeTimeout);
    }

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }

    window.addEventListener('resize', resize);
    resize();

    class Particle {
        constructor(x, y, targetX, targetY) {
            this.x = x;
            this.y = y;
            this.targetX = targetX;
            this.targetY = targetY;
            this.vx = (Math.random() - 0.5) * 2;
            this.vy = (Math.random() - 0.5) * 2;
            this.radius = Math.random() * 2 + 1;
            this.color = 'rgba(37, 99, 235, 0.6)';
            this.friction = 0.95;
            this.ease = 0.1;
        }

        update() {
            if (phase === 'pi') {
                this.x += (this.targetX - this.x) * this.ease;
                this.y += (this.targetY - this.y) * this.ease;
            } else if (phase === 'explode') {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.vy += 0.05;
            } else if (phase === 'circle' || phase === 'move') {
                this.x += (this.targetX - this.x) * this.ease;
                this.y += (this.targetY - this.y) * this.ease;
                if (phase === 'move') {
                    this.radius *= 0.95;
                }
            }
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, Math.max(0, this.radius), 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.fill();
        }
    }

    function initPiParticles() {
        try {
            ctx.fillStyle = 'blue';
            ctx.font = 'bold 200px serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('π', width / 2, height / 2);

            const imageData = ctx.getImageData(0, 0, width, height).data;
            ctx.clearRect(0, 0, width, height);

            for (let y = 0; y < height; y += 8) { // 稍微增加步长减少粒子数量，提升性能
                for (let x = 0; x < width; x += 8) {
                    const index = (y * width + x) * 4;
                    if (imageData[index + 3] > 128) {
                        particles.push(new Particle(
                            width / 2 + (Math.random() - 0.5) * 100,
                            height / 2 + (Math.random() - 0.5) * 100,
                            x, y
                        ));
                    }
                }
            }
        } catch (e) {
            console.error('Failed to init particles:', e);
            hideOverlay();
        }
    }

    function updateTargetsToCircle() {
        const centerX = width / 2;
        const centerY = height / 2;
        const radius = Math.min(width, height) * 0.15;
        particles.forEach((p, i) => {
            const angle = (i / particles.length) * Math.PI * 2;
            p.targetX = centerX + Math.cos(angle) * radius * (0.8 + Math.random() * 0.4);
            p.targetY = centerY + Math.sin(angle) * radius * (0.8 + Math.random() * 0.4);
            p.ease = 0.05 + Math.random() * 0.05;
        });
    }

    function updateTargetsToLogo() {
        if (!finalLogoIcon) {
            hideOverlay();
            return;
        }
        const rect = finalLogoIcon.getBoundingClientRect();
        const targetX = rect.left + rect.width / 2;
        const targetY = rect.top + rect.height / 2;
        particles.forEach(p => {
            p.targetX = targetX;
            p.targetY = targetY;
            p.ease = 0.15;
        });
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        const elapsed = Date.now() - startTime;

        if (phase === 'pi' && elapsed > 1500) {
            phase = 'explode';
            particles.forEach(p => {
                p.vx = (Math.random() - 0.5) * 15;
                p.vy = (Math.random() - 0.5) * 15;
            });
            startTime = Date.now();
        } else if (phase === 'explode' && elapsed > 1000) {
            phase = 'circle';
            updateTargetsToCircle();
            startTime = Date.now();
        } else if (phase === 'circle' && elapsed > 1200) {
            phase = 'move';
            updateTargetsToLogo();
            startTime = Date.now();
        } else if (phase === 'move' && elapsed > 800) {
            hideOverlay();
            return;
        }

        particles.forEach(p => {
            p.update();
            p.draw();
        });

        animationFrame = requestAnimationFrame(animate);
    }

    if (particles.length === 0) initPiParticles();
    animate();
})();
    </script>
