<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>圆几何交互式学习平台</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
    /* 全局样式重置：消除所有默认边距，统一盒模型，基础排版 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", Arial, Helvetica, sans-serif;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden; /* 禁止横向滚动，适配小屏 */
            background-image: url("image/bg.jpg");
      /* 图片不重复平铺 */
      background-repeat: no-repeat;
      /* 铺满整个屏幕 */
      background-size: cover;
      /* 固定背景，不随滚动条滚动 */
      background-attachment: fixed;
      /* 背景居中 */
      background-position: center;
        }
        a {
            text-decoration: none;
            color: #333;
            transition: all 0.3s ease;
        }
        ul, li {
            list-style: none;
        }
        img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover; /* 图片自适应，不变形 */
        }
        button {
            border: none;
            outline: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        input {
            border: none;
            outline: none;
            background: none;
        }

        /* 基础变量：便于统一修改 */
        :root {
            --main-color: #2563eb;
            --hover-color: #1d4ed8;
            --bg-color: #ffffff;
            --text-color: #333333;
            --light-bg: #f8fafc;
            --border-color: #e2e8f0;
            --shadow: 0 2px 10px rgba(0,0,0,0.08);
            --font-size: 16px; /* 基础字体大小，用于等比例缩放 */
        }

        /* 页面主体样式：默认主题，平滑过渡 */
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: var(--font-size);
            line-height: 1.5;
            transition: all 0.3s ease-in-out;
        }

        /* 头部容器：通栏，flex布局，适配所有屏幕，固定顶部 */
        .header-container {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
            width: 100%;
            height: 80px;
            padding: 0 2vw; /* 用vw适配不同屏幕边距 */
            background-color: var(--light-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        /* 左上角logo：适配大小屏 */
        .logo {
            font-size: clamp(calc(18px / 16 * var(--font-size)), 2vw, calc(22px / 16 * var(--font-size))); /* 按基础字体等比例缩放 */
            font-weight: 700;
            color: var(--main-color);
        }
        /* 中间导航：向下偏移5px，原需求 */
        .nav-main {
            position: relative;
            top: 5px;
            display: flex;
            gap: clamp(15px, 3vw, 30px); /* 间距自适应 */
        }
        .nav-link {
            font-size: clamp(calc(16px / 16 * var(--font-size)), 1.8vw, calc(18px / 16 * var(--font-size)));
            color: var(--text-color);
            font-weight: 500;
        }
        .nav-link:hover, .nav-link:active {
            color: var(--main-color);
        }
        /* 右侧容器：语言+设置+广告，flex对齐 */
        .header-right {
            display: flex;
            align-items: center;
            gap: clamp(10px, 2vw, 20px);
            position: relative;
        }
        /* 语言切换：小字，适配 */
        .lang-switch {
            font-size: clamp(calc(12px / 16 * var(--font-size)), 1.2vw, calc(14px / 16 * var(--font-size)));
            color: #64748b;
        }
        .lang-link {
            color: #64748b;
        }
        .lang-link.active {
            color: var(--main-color);
            font-weight: 700;
        }
        /* 设置图标：大小自适应 */
        .setting-icon {
            font-size: clamp(calc(18px / 16 * var(--font-size)), 1.8vw, calc(20px / 16 * var(--font-size)));
            color: #64748b;
            cursor: pointer;
        }
        .setting-icon:hover {
            color: var(--main-color);
        }
        /* 设置下拉菜单：绝对定位，自适应宽度，默认隐藏 */
        .setting-menu {
            display: none;
            position: absolute;
            top: calc(100% + 10px);
            right: 0;
            width: clamp(180px, 15vw, 220px); /* 加宽适配滑块 */
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-shadow: var(--shadow);
            padding: 10px 12px;
            z-index: 9999;
        }
        .setting-menu .menu-item {
            display: block;
            padding: 8px 10px;
            font-size: clamp(calc(12px / 16 * var(--font-size)), 1.2vw, calc(14px / 16 * var(--font-size)));
            color: var(--text-color);
            border-radius: 4px;
            margin-bottom: 5px;
        }
        .setting-menu .menu-item:hover {
            background-color: #f1f5f9;
            color: var(--main-color);
        }
        /* 字体大小滑块样式 */
        .font-size-slider-wrap {
            padding: 8px 10px;
            margin: 5px 0;
        }
        .font-size-label {
            font-size: clamp(calc(12px / 16 * var(--font-size)), 1.2vw, calc(14px / 16 * var(--font-size)));
            color: var(--text-color);
            margin-bottom: 6px;
            display: block;
        }
        .font-size-slider {
            width: 100%;
            height: 6px;
            accent-color: var(--main-color);
            cursor: pointer;
        }
        .font-size-value {
            font-size: clamp(calc(11px / 16 * var(--font-size)), 1vw, calc(13px / 16 * var(--font-size)));
            color: #64748b;
            text-align: center;
            margin-top: 6px;
        }
        /* 关于广告：设置下方，绝对定位，小字 */
        .ad-tip {
            position: absolute;
            top: calc(100% + 5px);
            right: 0;
            font-size: clamp(calc(10px / 16 * var(--font-size)), 1vw, calc(12px / 16 * var(--font-size)));
            color: #94a3b8;
        }
        .ad-link {
            color: #94a3b8;
        }
        .ad-link:hover {
            color: var(--main-color);
            text-decoration: underline;
        }

        /* 主体容器：适配顶部固定导航，padding-top预留空间，通栏 */
        .main-container {
            width: 100%;
            padding: calc(80px + 30px) 2vw 50px; /* 适配固定头部 */
            display: flex;
            flex-direction: column;
            gap: 40px;
            align-items: center;
        }

        /* 轮播图容器：适配所有屏幕，固定宽高比，最大宽度1200px */
        .carousel-container {
            width: 100%;
            max-width: 1200px;
            height: 0;
            padding-bottom: 33.33%; /* 宽高比3:1，适配所有屏幕，不变形 */
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            box-shadow: var(--shadow);
        }
        .carousel-wrap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        /* 轮播图列表：flex，5张图占500%宽度 */
        .carousel-list {
            width: 500%;
            height: 100%;
            display: flex;
            transition: transform 0.5s ease-in-out;
        }
        .carousel-item {
            width: 20%; /* 5张图，每张占20% */
            height: 100%;
        }

        /* AI搜索栏容器：最大宽度800px，适配小屏占满，大屏居中 */
        .ai-search-container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }
        .search-title {
            font-size: clamp(calc(18px / 16 * var(--font-size)), 2vw, calc(24px / 16 * var(--font-size)));
            color: var(--main-color);
            font-weight: 600;
        }
        /* 搜索框：flex，输入框占满，按钮固定宽度 */
        .search-box {
            width: 100%;
            display: flex;
            gap: 10px;
            height: clamp(40px, 5vw, 50px);
        }
        .search-input {
            flex: 1;
            padding: 0 20px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: var(--light-bg);
            font-size: clamp(calc(14px / 16 * var(--font-size)), 1.5vw, calc(16px / 16 * var(--font-size)));
            color: var(--text-color);
        }
        .search-input:focus {
            border-color: var(--main-color);
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1);
        }
        .search-btn {
            padding: 0 clamp(15px, 3vw, 30px);
            background-color: var(--main-color);
            color: #fff;
            border-radius: 6px;
            font-size: clamp(calc(14px / 16 * var(--font-size)), 1.5vw, calc(16px / 16 * var(--font-size)));
        }
        .search-btn:hover {
            background-color: var(--hover-color);
        }

        /* AI回复弹窗：遮罩层，全屏，默认隐藏，居中显示 */
        .ai-modal {
            display: none; /* 默认隐藏 */
            position: fixed;
            top: 0;
            left: 0;
            z-index: 99999;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5); /* 半透明遮罩 */
            backdrop-filter: blur(3px); /* 模糊背景，提升体验 */
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2vw;
        }
        /* 弹窗内容：自适应宽度，最大宽度600px，圆角，阴影 */
        .ai-modal-content {
            position: relative;
            width: 100%;
            max-width: 600px;
            background-color: var(--bg-color);
            border-radius: 8px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            padding: clamp(20px, 3vw, 30px);
        }
        /* 弹窗关闭按钮：右上角，圆形，悬浮效果 */
        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: calc(24px / 16 * var(--font-size));
            color: #94a3b8;
            cursor: pointer;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .modal-close:hover {
            background-color: #f1f5f9;
            color: #ef4444;
        }
        /* 弹窗标题 */
        .modal-title {
            font-size: clamp(calc(16px / 16 * var(--font-size)), 2vw, calc(20px / 16 * var(--font-size)));
            color: var(--main-color);
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }
        /* 弹窗回复内容：自适应，换行，最大高度60vh，滚动 */
        .modal-result {
            font-size: clamp(calc(14px / 16 * var(--font-size)), 1.5vw, calc(16px / 16 * var(--font-size)));
            line-height: 1.8;
            color: var(--text-color);
            max-height: 60vh;
            overflow-y: auto;
            padding-right: 10px;
        }
        /* 滚动条美化：适配弹窗 */
        .modal-result::-webkit-scrollbar {
            width: 6px;
        }
        .modal-result::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 3px;
        }

        /* 联系我们弹窗样式 */
        .contact-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 999999;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            backdrop-filter: blur(3px);
            justify-content: center;
            align-items: center;
            padding: 2vw;
        }
        .contact-modal-content {
            width: 100%;
            max-width: 400px;
            background-color: var(--bg-color);
            border-radius: 8px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            padding: clamp(20px, 3vw, 30px);
            text-align: center;
        }
        .contact-title {
            font-size: clamp(calc(16px / 16 * var(--font-size)), 2vw, calc(20px / 16 * var(--font-size)));
            color: var(--main-color);
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }
        .contact-info {
            font-size: clamp(calc(14px / 16 * var(--font-size)), 1.5vw, calc(16px / 16 * var(--font-size)));
            color: var(--text-color);
            line-height: 1.8;
        }

        /* 模式切换：护眼/夜晚，修改CSS变量 */
        body.eye-mode {
            --bg-color: #f0f9eb;
            --light-bg: #f7fbf2;
            --text-color: #166534;
            --border-color: #c7e3b4;
        }
        body.night-mode {
            --bg-color: #1e293b;
            --light-bg: #2d3748;
            --text-color: #f1f5f9;
            --border-color: #475569;
            --main-color: #60a5fa;
            --hover-color: #3b82f6;
        }

        /* 跳转页面（game/quiz）通用样式 */
        .page-container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 2vw;
        }
        .page-title {
            font-size: clamp(calc(24px / 16 * var(--font-size)), 4vw, calc(36px / 16 * var(--font-size)));
            color: var(--main-color);
            margin-bottom: 20px;
        }
        .page-desc {
            font-size: clamp(calc(16px / 16 * var(--font-size)), 2vw, calc(18px / 16 * var(--font-size)));
            margin-bottom: 30px;
            color: #64748b;
        }
        .page-back {
            padding: 10px 30px;
            background-color: var(--main-color);
            color: #fff;
            border-radius: 6px;
            font-size: calc(16px / 16 * var(--font-size));
        }
        .page-back:hover {
            background-color: var(--hover-color);
        }

        /* 媒体查询：针对超小屏（手机竖屏）优化 */
        @media (max-width: 480px) {
            .header-container {
                height: 70px;
            }
            .main-container {
                padding-top: calc(70px + 20px);
                gap: 20px;
            }
            .search-box {
                height: 40px;
            }
            .ai-modal-content, .contact-modal-content {
                padding: 20px 15px;
            }
            .setting-menu {
                width: 160px;
            }
        }
    </style>
</head>

                contactInfo: 'If you encounter problems, please contact our email:<br><strong>3058168199@qq.com</strong>',
                errorEmpty: 'Please enter a query related to circle geometry!',
                loading: 'AI is querying for you, please wait...',
                errorNoAnswer: 'AI query failed: No text answer in response!',
                errorFormat: 'AI query failed: Abnormal response format! Response data:<br>{data}',
                errorApi: 'AI query failed: {code} - {msg}!',
                errorNetwork: 'Call failed (Total time: {time}ms): {msg}',
                errorConsole: 'Open F12 console to view complete logs',
                errorCORS: 'Network error: CORS restriction! Please set up a backend proxy or disable browser CORS temporarily for testing.',
                error401: 'API_KEY is invalid/expired! Please check your API_KEY.',
                errorOther: 'Network error: {msg}, please check network or API configuration!'
            }
        };

        // ********** 全局变量 **********
        const carouselList = document.querySelector('.carousel-list');
        const carouselItems = document.querySelectorAll('.carousel-item');
        const aiModal = document.getElementById('aiModal');
        const modalClose = document.getElementById('modalClose');
        const searchBtn = document.querySelector('.search-btn');
        const searchInput = document.querySelector('.search-input');
        const modalResult = document.getElementById('modalResult');
        const settingWrap = document.querySelector('.setting-wrap');
        const settingMenu = document.querySelector('.setting-menu');
        const fontSizeSlider = document.getElementById('fontSizeSlider');
        const fontSizeValue = document.getElementById('fontSizeValue');
        const contactUs = document.getElementById('contactUs');
        const contactModal = document.getElementById('contactModal');
        const contactModalClose = document.getElementById('contactModalClose');
        let currentIndex = 0;
        const totalCarousel = carouselItems.length;
        let menuHideTimer = null; // 设置菜单隐藏延迟定时器
        let currentLang = localStorage.getItem('appLang') || 'zh-CN'; // 默认中文

        // ********** 语言切换函数 **********
        function updateLang(lang) {
            currentLang = lang;
            localStorage.setItem('appLang', lang); // 保存到本地存储
            const texts = langTexts[lang];
            
            // 更新页面文本
            document.getElementById('logoText').textContent = texts.logoText;
            document.getElementById('navHome').textContent = texts.navHome;
            document.getElementById('navGame').textContent = texts.navGame;
            document.getElementById('navQuiz').textContent = texts.navQuiz;
            document.getElementById('langZh').textContent = texts.langZh;
            document.getElementById('langEn').textContent = texts.langEn;
            document.getElementById('menuEye').textContent = texts.menuEye;
            document.getElementById('menuNight').textContent = texts.menuNight;
            document.getElementById('fontSizeLabel').textContent = texts.fontSizeLabel;
            document.getElementById('fontSizeValue').textContent = texts.fontSizeValue.replace('{size}', fontSizeSlider.value);
            document.getElementById('contactUs').textContent = texts.contactUs;
            document.getElementById('menuHelp').textContent = texts.menuHelp;
            document.getElementById('adLink').textContent = texts.adLink;
            document.getElementById('searchTitle').textContent = texts.searchTitle;
            document.getElementById('searchPlaceholder').placeholder = texts.searchPlaceholder;
            document.getElementById('searchBtn').textContent = texts.searchBtn;
            document.getElementById('modalTitle').textContent = texts.modalTitle;
            document.getElementById('contactTitle').textContent = texts.contactTitle;
            document.getElementById('contactInfo').innerHTML = texts.contactInfo;
            
            // 更新html lang属性
            document.documentElement.lang = lang;
            
            // 更新语言按钮激活状态
            document.querySelectorAll('.lang-link').forEach(link => {
                link.classList.remove('active');
                if (link.dataset.lang === lang) {
                    link.classList.add('active');
                }
            });
        }

        // ********** 1. 初始化语言 **********
        updateLang(currentLang);

        // ********** 2. 轮播图：自动循环2秒，循环播放5张 **********
        function carouselPlay() {
            currentIndex = (currentIndex + 1) % totalCarousel;
            carouselList.style.transform = `translateX(-${currentIndex * 20}%)`;
        }
        // 页面加载后启动轮播
        window.onload = function() {
            setInterval(carouselPlay, 2000);
            // 初始化弹窗隐藏
            aiModal.style.display = 'none';
            contactModal.style.display = 'none';
        };

        // ********** 3. 设置下拉菜单：鼠标悬浮至少停留1秒 **********
        settingWrap.addEventListener('mouseenter', () => {
            // 清除延迟隐藏定时器
            clearTimeout(menuHideTimer);
            settingMenu.style.display = 'block';
        });

        settingWrap.addEventListener('mouseleave', () => {
            // 延迟1秒隐藏菜单
            menuHideTimer = setTimeout(() => {
                settingMenu.style.display = 'none';
            }, 1000);
        });

        // 鼠标进入菜单时清除隐藏定时器（防止误关）
        settingMenu.addEventListener('mouseenter', () => {
            clearTimeout(menuHideTimer);
        });

        // 鼠标离开菜单时延迟1秒隐藏
        settingMenu.addEventListener('mouseleave', () => {
            menuHideTimer = setTimeout(() => {
                settingMenu.style.display = 'none';
            }, 1000);
        });

        // ********** 4. 模式切换（护眼/夜晚） **********
        const menuItems = document.querySelectorAll('.menu-item[data-style]');
        const body = document.body;
        menuItems.forEach(item => {
            item.addEventListener('click', () => {
                // 移除所有模式，避免冲突
                body.classList.remove('eye-mode', 'night-mode');
                // 护眼模式
                if (item.dataset.style === 'eye') body.classList.add('eye-mode');
                // 夜晚模式
                if (item.dataset.style === 'night') body.classList.add('night-mode');
            });
        });

        // ********** 5. 字体大小滑块控制：等比例缩放所有汉字 **********
        const root = document.documentElement;
        // 初始化字体大小
        root.style.setProperty('--font-size', `${fontSizeSlider.value}px`);
        fontSizeValue.textContent = langTexts[currentLang].fontSizeValue.replace('{size}', fontSizeSlider.value);

        // 滑块事件
        fontSizeSlider.addEventListener('input', () => {
            const fontSize = fontSizeSlider.value;
            root.style.setProperty('--font-size', `${fontSize}px`);
            fontSizeValue.textContent = langTexts[currentLang].fontSizeValue.replace('{size}', fontSize);
        });

        // ********** 6. 语言切换事件 **********
        const langLinks = document.querySelectorAll('.lang-link');
        langLinks.forEach(link => {
            link.addEventListener('click', () => {
                updateLang(link.dataset.lang);
            });
        });

        // ********** 7. AI弹窗：关闭功能 **********
        modalClose.addEventListener('click', () => {
            aiModal.style.display = 'none';
            // 清空输入框和弹窗内容
            searchInput.value = '';
            modalResult.innerHTML = '';
        });
        // 点击遮罩层关闭弹窗
        aiModal.addEventListener('click', (e) => {
            if (e.target === aiModal) {
                aiModal.style.display = 'none';
                searchInput.value = '';
                modalResult.innerHTML = '';
            }
        });

        // ********** 8. 联系我们弹窗控制 **********
        contactUs.addEventListener('click', () => {
            contactModal.style.display = 'flex';
        });

        contactModalClose.addEventListener('click', () => {
            contactModal.style.display = 'none';
        });

        // 点击遮罩层关闭联系弹窗
        contactModal.addEventListener('click', (e) => {
            if (e.target === contactModal) {
                contactModal.style.display = 'none';
            }
        });

       // ********** 9. AI接口调用：真实问答，返回有效结果 **********
// 火山方舟API Key（你的密钥）
const API_KEY = "67805b72-0e18-42da-921d-b6a86a0746da";
// 火山方舟API地址（替换原豆包地址）
const API_URL = "https://ark.cn-beijing.volces.com/api/v3/responses";

// 搜索按钮点击事件
searchBtn.addEventListener('click', () => {
    getAiAnswer();
});
// 回车触发搜索
searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
        getAiAnswer();
    }
});

// 调用火山方舟API获取答案
async function getAiAnswer() {
    const question = searchInput.value.trim();
    const texts = langTexts[currentLang];
    if (!question) {
        modalResult.innerHTML = `<p style="color: #ef4444;">${texts.errorEmpty}</p>`;
        aiModal.style.display = 'flex';
        return;
    }
    modalResult.innerHTML = `<p style="color: #2563eb; text-align: center;">${texts.loading}</p>`;
    aiModal.style.display = 'flex';

    // 新增：记录请求开始时间（统计耗时）
    const startTime = Date.now();

    try {
        // 1. 构造请求参数并打印（看参数是否正确）
        const requestData = {
            "model": "doubao-seed-2-0-pro-260215",
            "input": [
                {
                    "role": "user",
                    "content": [
                        {
                            "type": "input_text",
                            "text": question
                        }
                    ]
                }
            ]
        };
        console.log('🚀 发送请求参数：', JSON.stringify(requestData, null, 2));

        // 2. 发送请求
        const response = await fetch(API_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${API_KEY}`
            },
            body: JSON.stringify(requestData)
        });

        // 新增：打印响应基础信息（状态码、耗时、响应头）
        const endTime = Date.now();
        console.log(`📡 响应状态码：${response.status} (耗时：${endTime - startTime}ms)`);
        console.log('📨 响应头：', Object.fromEntries(response.headers.entries()));

        // 3. 解析响应全量数据（关键：看API到底返回了什么）
        const rawData = await response.text(); // 先以文本形式获取，避免JSON解析失败
        console.log('🔍 响应原始数据：', rawData);
        
        // 尝试转JSON
        let data;
        try {
            data = JSON.parse(rawData);
        } catch (jsonError) {
            throw new Error(`响应不是合法JSON：${rawData}`);
        }

        // 4. 检查HTTP状态码
        if (!response.ok) {
            throw new Error(`API返回错误（${response.status}）：${JSON.stringify(data, null, 2)}`);
        }

        // 5. 详细打印返回数据（看是否有隐藏的error或其他字段）
        console.log('✅ 解析后的响应数据：', JSON.stringify(data, null, 2));

        // 6. 适配响应逻辑（更宽松的判断）
        if (data.output && data.output.length > 0) {
            // 遍历所有output，找text类型的内容
            let answer = '';
            for (const outputItem of data.output) {
                if (outputItem.content && outputItem.content.length > 0) {
                    for (const contentItem of outputItem.content) {
                        if (contentItem.type === 'output_text' && contentItem.text) {
                            answer = contentItem.text;
                            break;
                        }
                    }
                    if (answer) break;
                }
            }
            if (answer) {
                modalResult.innerHTML = answer.replace(/\n/g, '<br>');
            } else {
                modalResult.innerHTML = `<p style="color: #ef4444;">${texts.errorNoAnswer}</p>`;
            }
        } else if (data.error) {
            modalResult.innerHTML = `<p style="color: #ef4444;">${texts.errorApi.replace('{code}', data.error.code || '未知错误').replace('{msg}', data.error.message)}</p>`;
        } else {
            modalResult.innerHTML = `<p style="color: #ef4444;">${texts.errorFormat.replace('{data}', JSON.stringify(data, null, 2))}</p>`;
        }

    } catch (error) {
        // 新增：打印完整错误栈
        console.error('❌ 调用过程完整错误：', error);
        const costTime = Date.now() - startTime;
        // 友好提示+详细错误
        let errorMsg = texts.errorNetwork.replace('{time}', costTime).replace('{msg}', error.message);
        if (error.message.includes('CORS')) {
            errorMsg = `<p style="color: #ef4444;">${texts.errorCORS}</p>`;
        } else if (error.message.includes('401')) {
            errorMsg = `<p style="color: #ef4444;">${texts.error401}</p>`;
        } else if (!error.message.includes('API返回错误')) {
            errorMsg = `<p style="color: #ef4444;">${texts.errorOther.replace('{msg}', error.message)}</p>`;
        }
        modalResult.innerHTML = `${errorMsg}<p style="font-size: 12px; color: #666; margin-top: 8px;">${texts.errorConsole}</p>`;
    }
}
