<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>圆几何66题交互式学习平台</title>
<link rel="stylesheet" href="../css/style.css"/>
<style>
        body {
            padding: 0;
        }

        .circle66-home-btn {
            position: fixed;
            top: 18px;
            left: 18px;
            z-index: 10000;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 44px;
            padding: 0 18px;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 900;
            color: var(--text);
            background: var(--surface);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
            backdrop-filter: blur(14px) saturate(155%);
            -webkit-backdrop-filter: blur(14px) saturate(155%);
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease, filter 0.25s ease;
        }

        .circle66-home-btn:hover {
            transform: translateY(-2px);
            border-color: rgba(37, 99, 235, 0.35);
            box-shadow: 0 14px 30px rgba(37, 99, 235, 0.18);
            filter: brightness(1.03);
        }

        @media (max-width: 560px) {
            .circle66-home-btn {
                top: 12px;
                left: 12px;
                height: 42px;
                padding: 0 14px;
            }
        }

        .circle66-shell {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 120px 4vw 70px;
            display: flex;
            flex-direction: column;
            gap: 26px;
            align-items: stretch;
        }

        .circle66-hero {
            text-align: center;
            padding: 34px 24px;
            border-radius: 34px;
            background:
                radial-gradient(circle at 18% 22%, rgba(255, 255, 255, 0.48), rgba(255, 255, 255, 0.08) 52%, rgba(255, 255, 255, 0.02) 78%),
                linear-gradient(150deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0.08));
            border: 1px solid rgba(255, 255, 255, 0.55);
            box-shadow:
                0 18px 46px rgba(15, 23, 42, 0.12),
                inset 0 1px 0 rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(24px) saturate(150%);
            -webkit-backdrop-filter: blur(24px) saturate(150%);
        }

        .circle66-title {
            font-size: clamp(1.5rem, 3vw, 2.1rem);
            font-weight: 900;
            color: var(--primary-strong);
            margin-bottom: 10px;
            letter-spacing: 0.4px;
        }

        .circle66-subtitle {
            font-size: 1rem;
            color: var(--muted);
            font-weight: 600;
        }

        .topic-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 18px;
        }

        .topic-card {
            border: 1px solid rgba(255, 255, 255, 0.6);
            background:
                radial-gradient(circle at 18% 20%, rgba(255, 255, 255, 0.42), rgba(255, 255, 255, 0.08) 55%, rgba(255, 255, 255, 0.02) 78%),
                linear-gradient(150deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.06));
            border-radius: 28px;
            padding: 18px 18px;
            cursor: pointer;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.35s ease, border-color 0.35s ease, filter 0.35s ease;
            backdrop-filter: blur(18px) saturate(150%);
            -webkit-backdrop-filter: blur(18px) saturate(150%);
            box-shadow: 0 10px 22px rgba(15, 23, 42, 0.08);
            position: relative;
            overflow: hidden;
        }

        .topic-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 44px rgba(37, 99, 235, 0.18);
            border-color: rgba(37, 99, 235, 0.35);
            filter: brightness(1.03);
        }

        .topic-card.active {
            border-color: rgba(37, 99, 235, 0.55);
            box-shadow: 0 22px 54px rgba(37, 99, 235, 0.22);
        }

        .topic-card-title {
            font-size: 1.05rem;
            font-weight: 900;
            color: var(--text);
            line-height: 1.25;
        }

        .topic-card-meta {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 10px;
            color: var(--muted);
            font-weight: 700;
            font-size: 0.92rem;
        }

        .circle66-panel {
            background:
                radial-gradient(circle at 18% 20%, rgba(255, 255, 255, 0.42), rgba(255, 255, 255, 0.08) 55%, rgba(255, 255, 255, 0.02) 78%),
                linear-gradient(150deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0.08));
            border-radius: 38px;
            border: 1px solid rgba(255, 255, 255, 0.55);
            box-shadow:
                0 22px 50px rgba(15, 23, 42, 0.14),
                inset 0 1px 0 rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(26px) saturate(155%);
            -webkit-backdrop-filter: blur(26px) saturate(155%);
            padding: 34px 34px;
            position: relative;
            overflow: hidden;
            isolation: isolate;
        }

        .circle66-meta {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 18px;
        }

        .circle66-topic {
            font-weight: 900;
            color: var(--primary-strong);
            font-size: 1.05rem;
        }

        .circle66-qnum {
            color: var(--muted);
            font-weight: 700;
            font-size: 0.95rem;
        }

        .circle66-qtext {
            font-size: 1.05rem;
            line-height: 1.9;
            color: var(--text);
            margin-bottom: 20px;
        }

        .circle66-svgbox {
            display: flex;
            justify-content: center;
            margin: 12px 0 18px;
        }

        svg {
            width: min(440px, 92vw);
            height: auto;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .circle66-answer {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.35);
            color: var(--text);
            padding: 16px 18px;
            border-radius: 18px;
            font-size: 1rem;
            font-weight: 700;
            display: none;
            margin: 14px 0 0;
        }

        .circle66-btns {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 22px;
        }

        .circle66-btn {
            padding: 12px 26px;
            border: 1px solid rgba(255, 255, 255, 0.55);
            border-radius: 999px;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease, filter 0.25s ease;
            background: var(--surface);
            color: var(--text);
            font-weight: 900;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .circle66-btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-strong) 100%);
            color: white;
            border-color: rgba(37, 99, 235, 0.35);
            box-shadow: 0 10px 22px rgba(37, 99, 235, 0.18);
        }

        .circle66-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .circle66-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            border-color: rgba(37, 99, 235, 0.38);
            box-shadow: 0 12px 26px rgba(15, 23, 42, 0.14);
            filter: brightness(1.03);
        }

        @media (max-width: 900px) {
            .topic-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
            .circle66-panel {
                padding: 26px 22px;
            }
        }

        @media (max-width: 560px) {
            .topic-grid {
                grid-template-columns: 1fr;
            }
            .circle66-shell {
                padding: 100px 16px 60px;
            }
        }
</style>
</head>
<body>
<a class="circle66-home-btn" id="homeBtn" href="index.html"></a>
<main class="circle66-shell">
    <section class="circle66-hero">
        <h1 class="circle66-title" id="pageTitle">圆中考题速递</h1>
        <div class="circle66-subtitle" id="pageSubtitle">按专题刷 66 道中考经典题</div>
    </section>

    <section class="topic-grid" id="topicGrid"></section>

    <section class="circle66-panel">
        <div class="circle66-meta">
            <div class="circle66-topic" id="topic"></div>
            <div class="circle66-qnum" id="qNum"></div>
        </div>
        <div class="circle66-qtext" id="qText"></div>
        <div class="circle66-svgbox">
            <svg id="svg" viewBox="0 0 340 320"></svg>
        </div>
        <div class="circle66-answer" id="ans">
            <span id="answerPrefix">答案解析：</span><span id="ansTxt"></span>
        </div>
        <div class="circle66-btns">
            <button class="circle66-btn" id="prev"></button>
            <button class="circle66-btn circle66-btn-primary" id="showAns"></button>
            <button class="circle66-btn" id="next"></button>
        </div>
    </section>
</main>

<script>
const questions = [

        if (!list || !list.length) return;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'topic-card';
        btn.dataset.topic = tp;
        const title = getDisplayTopic(tp);
        const countText = texts.topicCount.replace('{count}', String(list.length));
        btn.innerHTML = `<div class="topic-card-title">${title}</div><div class="topic-card-meta"><span>${countText}</span><span>${list[0] + 1}-${list[list.length - 1] + 1}</span></div>`;
        btn.addEventListener('click', () => setTopic(tp));
        topicGrid.appendChild(btn);
    });
    updateTopicActive();
}

function updateTopicActive() {
    document.querySelectorAll('.topic-card').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.topic === currentTopic);
    });
}

function setTopic(tp) {
    if (!topicIndexMap.has(tp)) return;
    currentTopic = tp;
    topicPos = 0;
    updateTopicActive();
    render();
}

function render() {
    const list = topicIndexMap.get(currentTopic) || [];
    if (!list.length) return;
    const globalIndex = list[Math.max(0, Math.min(topicPos, list.length - 1))];
    const q = questions[globalIndex];
    const texts = langTexts[currentLang] || langTexts['zh-CN'];

    t.textContent = getDisplayTopic(q.topic);
    n.textContent = texts.qNum
        .replace('{allIndex}', String(globalIndex + 1))
        .replace('{topicIndex}', String(topicPos + 1))
        .replace('{topicTotal}', String(list.length));
    tx.innerHTML = q.q;
    s.innerHTML = q.svg;
    a.style.display = "none";
    at.textContent = '';
    p.disabled = topicPos === 0;
    ne.disabled = topicPos === list.length - 1;
}

function updateLang(lang) {
    currentLang = lang;
    const texts = langTexts[currentLang] || langTexts['zh-CN'];
    pageTitle.textContent = texts.pageTitle;
    pageSubtitle.textContent = texts.pageSubtitle;
    if (homeBtn) {
        homeBtn.textContent = texts.home;
        homeBtn.setAttribute('aria-label', texts.home);
        homeBtn.title = texts.home;
    }
    p.textContent = texts.prev;
    ne.textContent = texts.next;
    sh.textContent = texts.showAns;
    answerPrefix.textContent = texts.answerPrefix;
    document.documentElement.lang = currentLang;
    buildTopicGrid();
    render();
}

sh.addEventListener('click', () => {
    const list = topicIndexMap.get(currentTopic) || [];
    if (!list.length) return;
    const globalIndex = list[topicPos];
    a.style.display = "block";
    at.textContent = questions[globalIndex].ans;
});

p.addEventListener('click', () => {
    topicPos = Math.max(0, topicPos - 1);
    render();
});

ne.addEventListener('click', () => {
    const list = topicIndexMap.get(currentTopic) || [];
    topicPos = Math.min(list.length - 1, topicPos + 1);
    render();
});

applyTheme(currentTheme);
updateLang(currentLang);

function syncFromStorage() {
    const nextLang = localStorage.getItem('appLang') || 'zh-CN';
    const nextTheme = localStorage.getItem('appTheme') || 'default';
    const nextFontSize = localStorage.getItem('appFontSize') || '16';
    document.documentElement.style.setProperty('--font-size', `${Number(nextFontSize) || 16}px`);
    if (nextTheme !== currentTheme) {
        currentTheme = nextTheme;
        applyTheme(currentTheme);
    }
    if (nextLang !== currentLang) {
        updateLang(nextLang);
    }
}

window.addEventListener('storage', (e) => {
    if (e.key === 'appLang' || e.key === 'appTheme' || e.key === 'appFontSize') {
        syncFromStorage();
    }
});
window.addEventListener('pageshow', syncFromStorage);
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') syncFromStorage();
});
</script>
</body>
</html>
