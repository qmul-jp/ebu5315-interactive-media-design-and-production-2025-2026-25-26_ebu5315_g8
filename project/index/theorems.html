<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>圆经典定理 - 圆几何交互式学习平台</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script>
        window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] } };
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Trebuchet MS", "Microsoft YaHei", sans-serif; }

        :root {
            --primary: #2563eb;
            --primary-strong: #1d4ed8;
            --text: #1f2937;
            --muted: #64748b;
            --bg-color: #f8fafc;
            --surface: rgba(255, 255, 255, 0.85);
            --surface-strong: #ffffff;
            --border-color: #e2e8f0;
            --shadow-lg: 0 24px 60px rgba(31, 41, 55, 0.12);
            --radius-xl: 28px;
            --font-size: 16px;
        }

        body {
            color: var(--text); font-size: var(--font-size);
            background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
            min-height: 100vh; line-height: 1.6; transition: all 0.3s ease;
        }

        body.eye-mode { --bg-color: #f0f9eb; --surface: rgba(247, 251, 242, 0.88); --text: #166534; --border-color: #c7e3b4; --primary: #438a4c; }
        body.night-mode {
            --text: #f1f5f9;
            --muted: #94a3b8;
            --primary: #60a5fa;
            --surface: rgba(15, 23, 42, 0.9);
            --surface-strong: #0f172a;
            --border-color: #334155;
            --bg-color: #020617;
            background:
                radial-gradient(circle at 12% 10%, rgba(56, 189, 248, 0.15), transparent 25%),
                radial-gradient(circle at 86% 14%, rgba(56, 189, 248, 0.15), transparent 22%),
                linear-gradient(rgba(56, 189, 248, 0.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56, 189, 248, 0.2) 1px, transparent 1px),
                linear-gradient(180deg, #020617 0%, #0f172a 100%);
            background-size: auto, auto, 46px 46px, 46px 46px, auto;
        }

        .header-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 80px; padding: 0 4vw;
            background: var(--surface); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center; z-index: 1000;
        }

        .logo {
            font-size: 1.5rem; font-weight: 800; font-family: "Orbitron", sans-serif;
            background: linear-gradient(135deg, #2563eb 0%, #60a5fa 100%);
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }

        .back-btn {
            padding: 8px 20px; border-radius: 100px; background: var(--primary); color: white;
            font-weight: 600; text-decoration: none; transition: all 0.3s;
        }
        .back-btn:hover { transform: translateX(-5px); background: var(--primary-strong); }

        .content-container {
            max-width: 1000px; margin: 0 auto; padding: 120px 4vw 60px;
        }

        .glass-panel {
            background: var(--surface); backdrop-filter: blur(20px); border-radius: 40px;
            padding: 50px; border: 1px solid var(--border-color); box-shadow: var(--shadow-lg);
        }

        h1 { font-size: 2.5rem; color: var(--primary); margin-bottom: 40px; text-align: center; font-weight: 800; }
        
        .level-section { margin-bottom: 60px; }
        .level-title { 
            font-size: 1.8rem; color: white; background: var(--primary); 
            padding: 10px 30px; border-radius: 100px; display: inline-block; margin-bottom: 30px;
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.2);
        }

        .theorem-card {
            background: rgba(255, 255, 255, 0.5); border: 1px solid var(--border-color);
            border-radius: 20px; padding: 30px; margin-bottom: 30px; transition: all 0.3s;
        }
        .theorem-card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.05); border-color: var(--primary); }
        .theorem-card h3 { color: var(--primary-strong); margin-bottom: 15px; font-size: 1.3rem; }
        .theorem-card p { font-size: 1.05rem; color: var(--text); margin-bottom: 20px; }

        .diagram-box {
            background: var(--bg-color); border-radius: 15px; padding: 20px;
            display: flex; flex-direction: column; align-items: center; border: 1px dashed var(--border-color);
        }
        .diagram-box svg { width: 180px; height: 180px; }

        @media (max-width: 768px) {
            .glass-panel { padding: 30px 20px; }
            h1 { font-size: 1.8rem; }
            .level-title { font-size: 1.3rem; padding: 8px 20px; }
        }
    </style>
</head>
<body>
    <header class="header-container">
        <a href="index.html" class="logo">CIRCLE GEOMETRY</a>
        <a href="index.html" class="back-btn" id="backBtn">返回首页</a>
    </header>

    <main class="content-container">
        <div class="glass-panel">
            <h1 id="pageTitle">圆经典定理</h1>
            <div id="theoremContent"></div>
        </div>
    </main>

    <script>
        const langTexts = {
            'zh-CN': {
                backBtn: '返回首页',
                pageTitle: '圆经典定理（由易到难·三层体系）',
                levels: [
                    { title: '第一层：基础入门定理', theorems: [
                        { t: '1. 圆的基本性质定理', d: '圆上任意一点到圆心的距离相等，均为半径；圆是轴对称与中心对称图形。', svg: '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--primary)" stroke-width="1.5"/><circle cx="50" cy="50" r="2" fill="var(--primary-strong)"/><line x1="50" y1="50" x2="84.64" y2="30" stroke="var(--primary-strong)" stroke-width="1.2"/><line x1="50" y1="50" x2="15.36" y2="30" stroke="var(--primary-strong)" stroke-width="1.2"/><text x="52" y="48" font-size="6" fill="var(--text)">O</text><text x="86" y="28" font-size="6" fill="var(--text)">A</text><text x="10" y="28" font-size="6" fill="var(--text)">B</text><text x="65" y="38" font-size="5" fill="var(--primary-strong)" transform="rotate(-30 65 38)">r</text></svg>' },
                        { t: '2. 直径性质定理', d: '直径是圆内最长的弦；直径将圆分为两个完全相等的半圆。', svg: '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--primary)" stroke-width="1.5"/><line x1="10" y1="50" x2="90" y2="50" stroke="var(--primary-strong)" stroke-width="1.5"/><line x1="20" y1="20" x2="80" y2="25" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2,2"/><text x="48" y="58" font-size="6" fill="var(--text)">O</text><text x="5" y="52" font-size="6" fill="var(--text)">A</text><text x="92" y="52" font-size="6" fill="var(--text)">B</text><text x="45" y="48" font-size="5" fill="var(--primary-strong)">直径 d</text></svg>' },
                        { t: '3. 圆心角定理', d: '同圆或等圆中，相等的圆心角所对的弧相等、弦相等。', svg: '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--primary)" stroke-width="1.5"/><path d="M 50 50 L 84.64 30 M 50 50 L 84.64 70" stroke="var(--primary-strong)" stroke-width="1.2"/><path d="M 50 50 L 15.36 30 M 50 50 L 15.36 70" stroke="var(--primary-strong)" stroke-width="1.2"/><path d="M 60 44.2 A 11.5 11.5 0 0 1 60 55.8" fill="none" stroke="var(--primary-strong)" stroke-width="1"/><path d="M 40 44.2 A 11.5 11.5 0 0 0 40 55.8" fill="none" stroke="var(--primary-strong)" stroke-width="1"/><text x="48" y="55" font-size="6" fill="var(--text)">O</text></svg>' },
                        { t: '4. 垂径定理', d: '垂直于弦的直径平分这条弦，且平分弦所对的弧。', svg: '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--primary)" stroke-width="1.5"/><line x1="20" y1="30" x2="80" y2="30" stroke="var(--text)" stroke-width="1.2"/><line x1="50" y1="10" x2="50" y2="90" stroke="var(--primary-strong)" stroke-width="1.5"/><rect x="50" y="30" width="5" height="5" fill="none" stroke="var(--primary-strong)" stroke-width="0.8"/><text x="52" y="28" font-size="6" fill="var(--text)">M</text><text x="14" y="32" font-size="6" fill="var(--text)">A</text><text x="82" y="32" font-size="6" fill="var(--text)">B</text><text x="48" y="8" font-size="6" fill="var(--text)">C</text><text x="48" y="98" font-size="6" fill="var(--text)">D</text></svg>' },
                        { t: '5. 半圆圆周角定理', d: '半圆（或直径）所对的圆周角恒为直角（90°）。', svg: '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--primary)" stroke-width="1.5"/><line x1="10" y1="50" x2="90" y2="50" stroke="var(--text)" stroke-width="1.2"/><path d="M 10 50 L 50 10 L 90 50" fill="none" stroke="var(--primary-strong)" stroke-width="1.2"/><rect x="48" y="12" width="4" height="4" transform="rotate(45 50 10)" fill="none" stroke="var(--primary-strong)" stroke-width="0.8"/><text x="5" y="52" font-size="6" fill="var(--text)">A</text><text x="92" y="52" font-size="6" fill="var(--text)">B</text><text x="48" y="8" font-size="6" fill="var(--text)">C</text></svg>' }
                    ]},
                    { title: '第二层：核心进阶定理', theorems: [
                        { t: '6. 圆周角定理', d: '同弧所对的圆周角相等；等于它所对圆心角的一半。', svg: '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--primary)" stroke-width="1.5"/><path d="M 15.36 70 L 50 10 L 84.64 70" fill="none" stroke="var(--primary-strong)" stroke-width="1.2"/><path d="M 15.36 70 L 21.72 21.72 L 84.64 70" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2,2"/><path d="M 15.36 70 L 50 50 L 84.64 70" fill="none" stroke="var(--primary-strong)" stroke-width="1.2"/><text x="48" y="8" font-size="6" fill="var(--text)">C</text><text x="18" y="20" font-size="6" fill="var(--text)">D</text><text x="10" y="75" font-size="6" fill="var(--text)">A</text><text x="86" y="75" font-size="6" fill="var(--text)">B</text><text x="48" y="58" font-size="6" fill="var(--text)">O</text></svg>' },
                        { t: '7. 圆内接四边形性质', d: '圆内接四边形的对角互补；任意一个外角等于它的内对角。', svg: '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--primary)" stroke-width="1.5"/><polygon points="50,10 90,50 50,90 10,50" fill="none" stroke="var(--primary-strong)" stroke-width="1.2"/><text x="48" y="8" font-size="6" fill="var(--text)">A</text><text x="92" y="52" font-size="6" fill="var(--text)">B</text><text x="48" y="98" font-size="6" fill="var(--text)">C</text><text x="4" y="52" font-size="6" fill="var(--text)">D</text></svg>' },
                        { t: '8. 切线性质定理', d: '圆的切线垂直于过切点的半径。', svg: '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--primary)" stroke-width="1.5"/><line x1="50" y1="50" x2="50" y2="90" stroke="var(--primary-strong)" stroke-width="1.5"/><line x1="10" y1="90" x2="90" y2="90" stroke="var(--text)" stroke-width="1.5"/><rect x="50" y="85" width="5" height="5" fill="none" stroke="var(--primary-strong)" stroke-width="0.8"/><text x="48" y="48" font-size="6" fill="var(--text)">O</text><text x="48" y="98" font-size="6" fill="var(--text)">A</text><text x="92" y="95" font-size="6" fill="var(--text)">l</text></svg>' },
                        { t: '9. 切线判定定理', d: '经过半径外端且垂直于该半径的直线是切线。', svg: '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--primary)" stroke-width="1.5"/><line x1="50" y1="50" x2="90" y2="50" stroke="var(--primary-strong)" stroke-width="1.5"/><line x1="90" y1="10" x2="90" y2="90" stroke="var(--text)" stroke-width="1.5"/><rect x="85" y="45" width="5" height="5" fill="none" stroke="var(--primary-strong)" stroke-width="0.8"/><text x="48" y="48" font-size="6" fill="var(--text)">O</text><text x="92" y="55" font-size="6" fill="var(--text)">A</text></svg>' },
                        { t: '10. 切线长定理', d: '从圆外一点引圆的两条切线，它们的切线长相等。', svg: '<svg viewBox="0 0 100 100"><circle cx="40" cy="50" r="30" fill="none" stroke="var(--primary)" stroke-width="1.5"/><circle cx="90" cy="50" r="2" fill="var(--primary-strong)"/><path d="M 90 50 L 58 26 M 90 50 L 58 74" stroke="var(--primary-strong)" stroke-width="1.2"/><line x1="40" y1="50" x2="58" y2="26" stroke="var(--muted)" stroke-width="0.8" stroke-dasharray="2,2"/><line x1="40" y1="50" x2="58" y2="74" stroke="var(--muted)" stroke-width="0.8" stroke-dasharray="2,2"/><text x="38" y="48" font-size="6" fill="var(--text)">O</text><text x="92" y="52" font-size="6" fill="var(--text)">P</text><text x="58" y="24" font-size="6" fill="var(--text)">A</text><text x="58" y="80" font-size="6" fill="var(--text)">B</text></svg>' },
                        { t: '11. 弦心距与弦的关系', d: '同圆中，弦心距相等则弦相等；弦越长，弦心距越短。', svg: '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--primary)" stroke-width="1.5"/><line x1="20" y1="20" x2="80" y2="20" stroke="var(--text)" stroke-width="1.2"/><line x1="50" y1="50" x2="50" y2="20" stroke="var(--primary-strong)" stroke-width="1.2"/><rect x="50" y="20" width="4" height="4" fill="none" stroke="var(--primary-strong)" stroke-width="0.5"/><text x="48" y="58" font-size="6" fill="var(--text)">O</text><text x="52" y="35" font-size="5" fill="var(--primary-strong)">d</text></svg>' }
                    ]},
                    { title: '第三层：拓展拔高定理', theorems: [
                        { t: '12. 弦切角定理', d: '弦切角等于它所夹弧所对的圆周角。', svg: '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--primary)" stroke-width="1.5"/><line x1="10" y1="90" x2="90" y2="90" stroke="var(--text)" stroke-width="1.5"/><path d="M 50 90 L 84.64 70 L 15.36 30 L 50 90" fill="none" stroke="var(--primary-strong)" stroke-width="1.2"/><text x="48" y="98" font-size="6" fill="var(--text)">A</text><text x="86" y="75" font-size="6" fill="var(--text)">B</text><text x="10" y="28" font-size="6" fill="var(--text)">C</text><text x="12" y="88" font-size="6" fill="var(--text)">l</text></svg>' },
                        { t: '13. 相交弦定理', d: '圆内两条相交弦，被交点分成的两条线段长度的积相等。', svg: '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--primary)" stroke-width="1.5"/><line x1="10" y1="50" x2="90" y2="50" stroke="var(--text)" stroke-width="1.2"/><line x1="50" y1="10" x2="50" y2="90" stroke="var(--text)" stroke-width="1.2"/><circle cx="50" cy="50" r="2" fill="var(--primary-strong)"/><text x="52" y="58" font-size="6" fill="var(--text)">P</text><text x="5" y="52" font-size="6" fill="var(--text)">A</text><text x="92" y="52" font-size="6" fill="var(--text)">B</text><text x="48" y="8" font-size="6" fill="var(--text)">C</text><text x="48" y="98" font-size="6" fill="var(--text)">D</text></svg>' },
                        { t: '14. 切割线定理', d: '切线长是割线全长与它外段长度的比例中项。', svg: '<svg viewBox="0 0 100 100"><circle cx="40" cy="50" r="30" fill="none" stroke="var(--primary)" stroke-width="1.5"/><line x1="90" y1="50" x2="58" y2="26" stroke="var(--primary-strong)" stroke-width="1.2"/><line x1="90" y1="50" x2="10" y2="50" stroke="var(--muted)" stroke-width="1.2"/><text x="92" y="52" font-size="6" fill="var(--text)">P</text><text x="58" y="24" font-size="6" fill="var(--text)">A</text><text x="70" y="58" font-size="6" fill="var(--text)">B</text><text x="10" y="58" font-size="6" fill="var(--text)">C</text></svg>' },
                        { t: '15. 割线定理', d: '圆外一点引两条割线，外段与全长乘积相等。', svg: '<svg viewBox="0 0 100 100"><circle cx="40" cy="50" r="30" fill="none" stroke="var(--primary)" stroke-width="1.5"/><line x1="90" y1="50" x2="11.72" y2="40" stroke="var(--text)" stroke-width="1.2"/><line x1="90" y1="50" x2="11.72" y2="60" stroke="var(--text)" stroke-width="1.2"/><text x="92" y="52" font-size="6" fill="var(--text)">P</text></svg>' },
                        { t: '16. 圆心角与弧度数', d: '圆心角的度数等于它所对弧的度数。', svg: '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--primary)" stroke-width="1.5"/><path d="M 50 50 L 84.64 30 M 50 50 L 84.64 70" stroke="var(--primary-strong)" stroke-width="1.5"/><path d="M 84.64 30 A 40 40 0 0 1 84.64 70" fill="none" stroke="var(--primary)" stroke-width="3" opacity="0.3"/><text x="48" y="58" font-size="6" fill="var(--text)">O</text><text x="86" y="28" font-size="6" fill="var(--text)">A</text><text x="86" y="75" font-size="6" fill="var(--text)">B</text></svg>' },

                        { t: '18. 西姆松定理（Simson line）', d: '一点在三角形外接圆上 $\\Leftrightarrow$ 该点到三边的垂足共线（西姆松线）。', svg: '<svg viewBox="0 0 100 100" shape-rendering="geometricPrecision"><circle cx="50" cy="42.5" r="37.5" fill="none" stroke="var(--primary)" stroke-width="1.2" opacity="0.45"/><polygon points="20,20 80,20 50,80" fill="none" stroke="var(--text)" stroke-width="1.2"/><line x1="87.5" y1="42.5" x2="87.5" y2="20" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2 2"/><line x1="87.5" y1="42.5" x2="72.5" y2="35" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2 2"/><line x1="87.5" y1="42.5" x2="42.5" y2="65" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2 2"/><line x1="20" y1="87.5" x2="97.5" y2="10" stroke="var(--primary-strong)" stroke-width="1.4"/><circle cx="87.5" cy="42.5" r="1.6" fill="var(--primary-strong)"/><circle cx="87.5" cy="20" r="1.4" fill="var(--primary-strong)"/><circle cx="72.5" cy="35" r="1.4" fill="var(--primary-strong)"/><circle cx="42.5" cy="65" r="1.4" fill="var(--primary-strong)"/><text x="17" y="18" font-size="6" fill="var(--text)">A</text><text x="82" y="18" font-size="6" fill="var(--text)">B</text><text x="48" y="88" font-size="6" fill="var(--text)">C</text><text x="89" y="44.5" font-size="6" fill="var(--text)">P</text><text x="89" y="19" font-size="6" fill="var(--text)">D</text><text x="74" y="34" font-size="6" fill="var(--text)">E</text><text x="41" y="71" font-size="6" fill="var(--text)">F</text></svg>' },
                        { t: '19. 托勒密定理（Ptolemy）', d: '圆内接四边形：$AB\\cdot CD+BC\\cdot DA=AC\\cdot BD$。<br>逆定理也成立。', svg: '<svg viewBox="0 0 100 100" shape-rendering="geometricPrecision"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--primary)" stroke-width="1.3"/><polygon points="50,10 86,36 70,85 18,70" fill="none" stroke="var(--text)" stroke-width="1.2"/><line x1="50" y1="10" x2="70" y2="85" stroke="var(--primary-strong)" stroke-width="1.1"/><line x1="86" y1="36" x2="18" y2="70" stroke="var(--primary-strong)" stroke-width="1.1"/><circle cx="50" cy="10" r="1.5" fill="var(--text)"/><circle cx="86" cy="36" r="1.5" fill="var(--text)"/><circle cx="70" cy="85" r="1.5" fill="var(--text)"/><circle cx="18" cy="70" r="1.5" fill="var(--text)"/><text x="48" y="8" font-size="6" fill="var(--text)">A</text><text x="88" y="38" font-size="6" fill="var(--text)">B</text><text x="71" y="93" font-size="6" fill="var(--text)">C</text><text x="10" y="72" font-size="6" fill="var(--text)">D</text></svg>' },
                        { t: '20. 婆罗摩笈多公式', d: '圆内接四边形面积：$S=\\sqrt{(p-a)(p-b)(p-c)(p-d)}$，其中 $p=\\frac{a+b+c+d}{2}$。', svg: '<svg viewBox="0 0 100 100" shape-rendering="geometricPrecision"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--primary)" stroke-width="1.3"/><polygon points="50,10 86,36 70,85 18,70" fill="none" stroke="var(--text)" stroke-width="1.2"/><text x="64" y="20" font-size="6" fill="var(--muted)">a</text><text x="82" y="64" font-size="6" fill="var(--muted)">b</text><text x="42" y="88" font-size="6" fill="var(--muted)">c</text><text x="18" y="48" font-size="6" fill="var(--muted)">d</text><circle cx="50" cy="10" r="1.4" fill="var(--text)"/><circle cx="86" cy="36" r="1.4" fill="var(--text)"/><circle cx="70" cy="85" r="1.4" fill="var(--text)"/><circle cx="18" cy="70" r="1.4" fill="var(--text)"/></svg>' },
                        { t: '21. 蝴蝶定理（Butterfly theorem）', d: '圆内弦 $AB$ 的中点为 $M$，任意两弦 $CD,EF$ 过 $M$。连结 $CE,DF$ 分别交 $AB$ 于 $P,Q$，则 $MP=MQ$。', svg: '<svg viewBox="0 0 100 100" shape-rendering="geometricPrecision"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--primary)" stroke-width="1.3"/><line x1="11.27" y1="60" x2="88.73" y2="60" stroke="var(--text)" stroke-width="1.2"/><line x1="17.16" y1="27.16" x2="72.84" y2="82.84" stroke="var(--muted)" stroke-width="1.1"/><line x1="19.13" y1="75.44" x2="88.87" y2="40.56" stroke="var(--muted)" stroke-width="1.1"/><line x1="72.84" y1="82.84" x2="88.87" y2="40.56" stroke="var(--primary-strong)" stroke-width="1.1"/><line x1="17.16" y1="27.16" x2="19.13" y2="75.44" stroke="var(--primary-strong)" stroke-width="1.1"/><circle cx="11.27" cy="60" r="1.4" fill="var(--text)"/><circle cx="88.73" cy="60" r="1.4" fill="var(--text)"/><circle cx="50" cy="60" r="1.6" fill="var(--primary-strong)"/><circle cx="72.84" cy="82.84" r="1.3" fill="var(--text)"/><circle cx="17.16" cy="27.16" r="1.3" fill="var(--text)"/><circle cx="88.87" cy="40.56" r="1.3" fill="var(--text)"/><circle cx="19.13" cy="75.44" r="1.3" fill="var(--text)"/><circle cx="81.5" cy="60" r="1.3" fill="var(--primary-strong)"/><circle cx="18.5" cy="60" r="1.3" fill="var(--primary-strong)"/><line x1="65.75" y1="58" x2="65.75" y2="62" stroke="var(--primary-strong)" stroke-width="1.2"/><line x1="34.25" y1="58" x2="34.25" y2="62" stroke="var(--primary-strong)" stroke-width="1.2"/><text x="8" y="58" font-size="6" fill="var(--text)">A</text><text x="90" y="58" font-size="6" fill="var(--text)">B</text><text x="52" y="58" font-size="6" fill="var(--text)">M</text><text x="74" y="85" font-size="6" fill="var(--text)">C</text><text x="10" y="27" font-size="6" fill="var(--text)">D</text><text x="90" y="40" font-size="6" fill="var(--text)">E</text><text x="14" y="80" font-size="6" fill="var(--text)">F</text><text x="83.5" y="58" font-size="6" fill="var(--text)">P</text><text x="15.5" y="5                         { t: '22. 欧拉公式（点与圆幂形式）', d: '设 $O$ 为外心，$I$ 为内心，$R,r$ 为外接、内切圆半径：$OI^2=R^2-2Rr$。', svg: '<svg viewBox="0 0 100 100" shape-rendering="geometricPrecision"><circle cx="50" cy="42.5" r="37.5" fill="none" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="3 2"/><circle cx="50" cy="38.54" r="18.54" fill="none" stroke="var(--primary)" stroke-width="1.4"/><polygon points="20,20 80,20 50,80" fill="none" stroke="var(--text)" stroke-width="1.2"/><line x1="50" y1="42.5" x2="50" y2="38.54" stroke="var(--primary-strong)" stroke-width="1.2"/><line x1="50" y1="42.5" x2="20" y2="20" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2 2"/><line x1="50" y1="38.54" x2="50" y2="20" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2 2"/><circle cx="50" cy="42.5" r="1.5" fill="var(--text)"/><circle cx="50" cy="38.54" r="1.5" fill="var(--text)"/><text x="52" y="44.5" font-size="6" fill="var(--text)">O</text><text x="52" y="38" font-size="6" fill="var(--text)">I</text><text x="30" y="30" font-size="6" fill="var(--muted)">R</text><text x="52" y="31" font-size="6" fill="var(--muted)">r</text></svg>' },

                        { t: '24. 卡诺定理（Carnot）', d: '对 $\\triangle ABC$ 外一点 $P$，向三边（或其延长线）作垂线，垂足为 $D,E,F$，则当 $P$ 在 $\\triangle ABC$ 外接圆上时：$BD^2+CE^2+AF^2=DC^2+EA^2+FB^2$。', svg: '<svg viewBox="0 0 100 100" shape-rendering="geometricPrecision"><circle cx="50" cy="42.5" r="37.5" fill="none" stroke="var(--muted)" stroke-width="1.1" stroke-dasharray="3 2"/><polygon points="20,20 80,20 50,80" fill="none" stroke="var(--text)" stroke-width="1.2" stroke-linejoin="miter"/><circle cx="80.35" cy="64.6" r="1.7" fill="var(--primary-strong)"/><text x="82" y="67" font-size="6" fill="var(--text)">P</text><line x1="80.35" y1="64.6" x2="80.35" y2="20" stroke="var(--primary-strong)" stroke-width="1" stroke-dasharray="2 2"/><circle cx="80.35" cy="20" r="1.3" fill="var(--primary-strong)"/><text x="82" y="24" font-size="6" fill="var(--text)">F</text><line x1="80.35" y1="64.6" x2="86.2" y2="18.2" stroke="var(--primary-strong)" stroke-width="1" stroke-dasharray="2 2"/><circle cx="86.2" cy="18.2" r="1.3" fill="var(--primary-strong)"/><text x="88" y="20" font-size="6" fill="var(--text)">D</text><line x1="80.35" y1="64.6" x2="50.16" y2="80.32" stroke="var(--primary-strong)" stroke-width="1" stroke-dasharray="2 2"/><circle cx="50.16" cy="80.32" r="1.3" fill="var(--primary-strong)"/><text x="52" y="84" font-size="6" fill="var(--text)">E</text><circle cx="20" cy="20" r="1.6" fill="var(--text)"/><circle cx="80" cy="20" r="1.6" fill="var(--text)"/><circle cx="50" cy="80" r="1.6" fill="var(--text)"/><text x="17" y="18" font-size="6" fill="var(--text)">A</text><text x="82" y="18" font-size="6" fill="var(--text)">B</text><text x="48" y="88" font-size="6" fill="var(--text)">C</text></svg>' },

                        { t: '26. 泰博定理（Tarry）', d: '三角形的第一、第二泰博点（Tarry points）与外接圆、内切圆、旁切圆存在一系列相切、共线等高阶性质。', svg: '<svg viewBox="0 0 100 100" shape-rendering="geometricPrecision"><circle cx="50" cy="42.5" r="37.5" fill="none" stroke="var(--primary)" stroke-width="1.2"/><polygon points="20,20 80,20 50,80" fill="none" stroke="var(--text)" stroke-width="1.2"/><circle cx="50" cy="52" r="10" fill="none" stroke="var(--primary-strong)" stroke-width="1.1" opacity="0.75"/><circle cx="78" cy="62" r="9" fill="none" stroke="var(--muted)" stroke-width="1.1" opacity="0.6"/><circle cx="76.5" cy="69" r="1.6" fill="var(--primary-strong)"/><circle cx="23.5" cy="69" r="1.6" fill="var(--primary-strong)"/><text x="78" y="72" font-size="6" fill="var(--text)">T₁</text><text x="15" y="72" font-size="6" fill="var(--text)">T₂</text><text x="52" y="52" font-size="6" fill="var(--text)">I</text><circle cx="50" cy="52" r="1.4" fill="var(--text)"/><circle cx="20" cy="20" r="1.6" fill="var(--text)"/><circle cx="80" cy="20" r="1.6" fill="var(--text)"/><circle cx="50" cy="80" r="1.6" fill="var(--text)"/><text x="17" y="18" font-size="6" fill="var(--text)">A</text><text x="82" y="18" font-size="6" fill="var(--text)">B</text><text x="48" y="88" font-size="6" fill="var(--text)">C</text></svg>' },

                        { t: '29. 布罗卡尔定理（Brocard）', d: '存在唯一布罗卡尔点 $\\Omega$，满足 $\\angle \\Omega AB=\\angle \\Omega BC=\\angle \\Omega CA=\\omega$。并且布罗卡尔角满足：$\\cot\\omega=\\cot A+\\cot B+\\cot C$。', svg: '<svg viewBox="0 0 100 100" shape-rendering="geometricPrecision"><polygon points="20,20 80,20 50,80" fill="none" stroke="var(--text)" stroke-width="1.2"/><circle cx="52" cy="45" r="1.7" fill="var(--primary-strong)"/><text x="54" y="47.5" font-size="6" fill="var(--text)">Ω</text><line x1="52" y1="45" x2="20" y2="20" stroke="var(--primary-strong)" stroke-width="1.1"/><line x1="52" y1="45" x2="80" y2="20" stroke="var(--primary-strong)" stroke-width="1.1"/><line x1="52" y1="45" x2="50" y2="80" stroke="var(--primary-strong)" stroke-width="1.1"/><path d="M 26 20 A 6 6 0 0 1 23 25" fill="none" stroke="var(--muted)" stroke-width="1.1"/><text x="26" y="29" font-size="6" fill="var(--muted)">ω</text><circle cx="20" cy="20" r="1.6" fill="var(--text)"/><circle cx="80" cy="20" r="1.6" fill="var(--text)"/><circle cx="50" cy="80" r="1.6" fill="var(--text)"/><text x="17" y="18" font-size="6" fill="var(--text)">A</text><text x="82" y="18" font-size="6" fill="var(--text)">B</text><text x="48" y="88" font-size="6" fill="var(--text)">C</text></svg>' },

                        { t: '1. Basic Properties of Circles', d: 'All points on a circle are equidistant from the center (the radius). Circles are axially and centrally symmetric.', svg: '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--primary)" stroke-width="1.5"/><circle cx="50" cy="50" r="2" fill="var(--primary-strong)"/><line x1="50" y1="50" x2="84.64" y2="30" stroke="var(--primary-strong)" stroke-width="1.2"/><line x1="50" y1="50" x2="15.36" y2="30" stroke="var(--primary-strong)" stroke-width="1.2"/><text x="52" y="48" font-size="6" fill="var(--text)">O</text><text x="86" y="28" font-size="6" fill="var(--text)">A</text><text x="10" y="28" font-size="6" fill="var(--text)">B</text><text x="65" y="38" font-size="5" fill="var(--primary-strong)" transform="rotate(-30 65 38)">r</text></svg>' },
                        { t: '2. Diameter Property Theorem', d: 'The diameter is the longest chord in a circle and divides it into two equal semicircles.', svg: '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--primary)" stroke-width="1.5"/><line x1="10" y1="50" x2="90" y2="50" stroke="var(--primary-strong)" stroke-width="1.5"/><line x1="20" y1="20" x2="80" y2="25" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2,2"/><text x="48" y="58" font-size="6" fill="var(--text)">O</text><text x="5" y="52" font-size="6" fill="var(--text)">A</text><text x="92" y="52" font-size="6" fill="var(--text)">B</text><text x="45" y="48" font-size="5" fill="var(--primary-strong)">Diameter d</text></svg>' },
                        { t: '3. Central Angle Theorem', d: 'In the same or equal circles, equal central angles subtend equal arcs and equal chords.', svg: '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--primary)" stroke-width="1.5"/><path d="M 50 50 L 84.64 30 M 50 50 L 84.64 70" stroke="var(--primary-strong)" stroke-width="1.2"/><path d="M 50 50 L 15.36 30 M 50 50 L 15.36 70" stroke="var(--primary-strong)" stroke-width="1.2"/><path d="M 60 44.2 A 11.5 11.5 0 0 1 60 55.8" fill="none" stroke="var(--primary-strong)" stroke-width="1"/><path d="M 40 44.2 A 11.5 11.5 0 0 0 40 55.8" fill="none" stroke="var(--primary-strong)" stroke-width="1"/><text x="48" y="55" font-size="6" fill="var(--text)">O</text></svg>' },

                    ]},
                    { title: 'Level 2: Core Intermediate Theorems', theorems: [

                        { t: '9. Tangent Determination Theorem', d: 'A line passing through the end of a radius and perpendicular to it is a tangent.', svg: '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--primary)" stroke-width="1.5"/><line x1="50" y1="50" x2="90" y2="50" stroke="var(--primary-strong)" stroke-width="1.5"/><line x1="90" y1="10" x2="90" y2="90" stroke="var(--text)" stroke-width="1.5"/><rect x="85" y="45" width="5" height="5" fill="none" stroke="var(--primary-strong)" stroke-width="0.8"/><text x="48" y="48" font-size="6" fill="var(--text)">O</text><text x="92" y="55" font-size="6" fill="var(--text)">A</text></svg>' },

                    ]},
                    { title: 'Level 3: Advanced Extension Theorems', theorems: [

                        { t: '13. Intersecting Chords Theorem', d: 'The product of the segments of two intersecting chords are equal.', svg: '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--primary)" stroke-width="1.5"/><line x1="10" y1="50" x2="90" y2="50" stroke="var(--text)" stroke-width="1.2"/><line x1="50" y1="10" x2="50" y2="90" stroke="var(--text)" stroke-width="1.2"/><circle cx="50" cy="50" r="2" fill="var(--primary-strong)"/><text x="52" y="58" font-size="6" fill="var(--text)">P</text><text x="5" y="52" font-size="6" fill="var(--text)">A</text><text x="92" y="52" font-size="6" fill="var(--text)">B</text><text x="48" y="8" font-size="6" fill="var(--text)">C</text><text x="48" y="98" font-size="6" fill="var(--text)">D</text></svg>' },

                        { t: '17. Nine-Point Circle (Feuerbach Circle)', d: 'In any triangle, the three feet of the altitudes, the three side midpoints, and the three midpoints of the segments from each vertex to the orthocenter lie on one circle (the nine-point circle). Its radius is half the circumradius and its center lies on the Euler line.', svg: '<svg viewBox="0 0 100 100" shape-rendering="geometricPrecision"><circle cx="50" cy="42.5" r="37.5" fill="none" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="3 2"/><circle cx="50" cy="38.75" r="18.75" fill="none" stroke="var(--primary)" stroke-width="1.6"/><polygon points="20,20 80,20 50,80" fill="none" stroke="var(--text)" stroke-width="1.2"/><line x1="50" y1="80" x2="50" y2="20" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2 2"/><line x1="20" y1="20" x2="68" y2="44" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2 2"/><line x1="80" y1="20" x2="32" y2="44" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2 2"/><circle cx="20" cy="20" r="1.6" fill="var(--text)"/><circle cx="80" cy="20" r="1.6" fill="var(--text)"/><circle cx="50" cy="80" r="1.6" fill="var(--text)"/><circle cx="50" cy="42.5" r="1.5" fill="var(--text)"/><circle cx="50" cy="35" r="1.5" fill="var(--text)"/><circle cx="50" cy="20" r="1.5" fill="var(--primary-strong)"/><circle cx="68" cy="44" r="1.5" fill="var(--primary-strong)"/><circle cx="32" cy="44" r="1.5" fill="var(--primary-strong)"/><circle cx="65" cy="50" r="1.5" fill="var(--primary-strong)"/><circle cx="35" cy="50" r="1.5" fill="var(--primary-strong)"/><circle cx="35" cy="27.5" r="1.5" fill="var(--primary-strong)"/><circle cx="65" cy="27.5" r="1.5" fill="var(--primary-strong)"/><circle cx="50" cy="57.5" r="1.5" fill="var(--primary-strong)"/><text x="17" y="18" font-size="6" fill="var(--text)">A</text><text x="82" y="18" font-size="6" fill="var(--text)">B</text><text x="48" y="88" font-size="6" fill="var(--text)">C</text><text x="52" y="44.5" font-size="6" fill="var(--text)">O</text><text x="52" y="34" font-size="6" fill="var(--text)">H</text></svg>' },
                        { t: '18. Simson Line Theorem', d: 'A point lies on the circumcircle of a triangle $\\Leftrightarrow$ the feet of the perpendiculars from that point to the three sides are collinear (the Simson line).', svg: '<svg viewBox="0 0 100 100" shape-rendering="geometricPrecision"><circle cx="50" cy="42.5" r="37.5" fill="none" stroke="var(--primary)" stroke-width="1.2" opacity="0.45"/><polygon points="20,20 80,20 50,80" fill="none" stroke="var(--text)" stroke-width="1.2"/><line x1="87.5" y1="42.5" x2="87.5" y2="20" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2 2"/><line x1="87.5" y1="42.5" x2="72.5" y2="35" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2 2"/><line x1="87.5" y1="42.5" x2="42.5" y2="65" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2 2"/><line x1="20" y1="87.5" x2="97.5" y2="10" stroke="var(--primary-strong)" stroke-width="1.4"/><circle cx="87.5" cy="42.5" r="1.6" fill="var(--primary-strong)"/><circle cx="87.5" cy="20" r="1.4" fill="var(--primary-strong)"/><circle cx="72.5" cy="35" r="1.4" fill="var(--primary-strong)"/><circle cx="42.5" cy="65" r="1.4" fill="var(--primary-strong)"/><text x="17" y="18" font-size="6" fill="var(--text)">A</text><text x="82" y="18" font-size="6" fill="var(--text)">B</text><text x="48" y="88" font-size="6" fill="var(--text)">C</text><text x="89" y="44.5" font-size="6" fill="var(--text)">P</text><text x="89" y="19" font-size="6" fill="var(--text)">D</text><text x="74" y="34" font-size="6" fill="var(--text)">E</text><text x="41" y="71" font-size="6" fill="var(--text)">F</text></svg>' },
                        { t: '19. Ptolemy’s Theorem', d: 'For a cyclic quadrilateral: $AB\\cdot CD+BC\\cdot DA=AC\\cdot BD$.<br>The converse is also true.', svg: '<svg viewBox="0 0 100 100" shape-rendering="geometricPrecision"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--primary)" stroke-width="1.3"/><polygon points="50,10 86,36 70,85 18,70" fill="none" stroke="var(--text)" stroke-width="1.2"/><line x1="50" y1="10" x2="70" y2="85" stroke="var(--primary-strong)" stroke-width="1.1"/><line x1="86" y1="36" x2="18" y2="70" stroke="var(--primary-strong)" stroke-width="1.1"/><circle cx="50" cy="10" r="1.5" fill="var(--text)"/><circle cx="86" cy="36" r="1.5" fill="var(--text)"/><circle cx="70" cy="85" r="1.5" fill="var(--text)"/><circle cx="18" cy="70" r="1.5" fill="var(--text)"/><text x="48" y="8" font-size="6" fill="var(--text)">A</text><text x="88" y="38" font-size="6" fill="var(--text)">B</text><text x="71" y="93" font-size="6" fill="var(--text)">C</text><text x="10" y="72" font-size="6" fill="var(--text)">D</text></svg>' },
                        { t: '20. Brahmagupta’s Formula', d: 'Area of a cyclic quadrilateral: $S=\\sqrt{(p-a)(p-b)(p-c)(p-d)}$, where $p=\\frac{a+b+c+d}{2}$.', svg: '<svg viewBox="0 0 100 100" shape-rendering="geometricPrecision"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--primary)" stroke-width="1.3"/><polygon points="50,10 86,36 70,85 18,70" fill="none" stroke="var(--text)" stroke-width="1.2"/><text x="64" y="20" font-size="6" fill="var(--muted)">a</text><text x="82" y="64" font-size="6" fill="var(--muted)">b</text><text x="42" y="88" font-size="6" fill="var(--muted)">c</text><text x="18" y="48" font-size="6" fill="var(--muted)">d</text><circle cx="50" cy="10" r="1.4" fill="var(--text)"/><circle cx="86" cy="36" r="1.4" fill="var(--text)"/><circle cx="70" cy="85" r="1.4" fill="var(--text)"/><circle cx="18" cy="70" r="1.4" fill="var(--text)"/></svg>' },
                        { t: '21. Butterfly Theorem', d: 'Let chord $AB$ have midpoint $M$. Two chords $CD$ and $EF$ pass through $M$. If lines $CE$ and $DF$ meet $AB$ at $P$ and $Q$, then $MP=MQ$.', svg: '<svg viewBox="0 0 100 100" shape-rendering="geometricPrecision"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--primary)" stroke-width="1.3"/><line x1="11.27" y1="60" x2="88.73" y2="60" stroke="var(--text)" stroke-width="1.2"/><line x1="17.16" y1="27.16" x2="72.84" y2="82.84" stroke="var(--muted)" stroke-width="1.1"/><line x1="19.13" y1="75.44" x2="88.87" y2="40.56" stroke="var(--muted)" stroke-width="1.1"/><line x1="72.84" y1="82.84" x2="88.87" y2="40.56" stroke="var(--primary-strong)" stroke-width="1.1"/><line x1="17.16" y1="27.16" x2="19.13" y2="75.44" stroke="var(--primary-strong)" stroke-width="1.1"/><circle cx="11.27" cy="60" r="1.4" fill="var(--text)"/><circle cx="88.73" cy="60" r="1.4" fill="var(--text)"/><circle cx="50" cy="60" r="1.6" fill="var(--primary-strong)"/><circle cx="72.84" cy="82.84" r="1.3" fill="var(--text)"/><circle cx="17.16" cy="27.16" r="1.3" fill="var(--text)"/><circle cx="88.87" cy="40.56" r="1.3" fill="var(--text)"/><circle cx="19.13" cy="75.44" r="1.3" fill="var(--text)"/><circle cx="81.5" cy="60" r="1.3" fill="var(--primary-strong)"/><circle cx="18.5" cy="60" r="1.3" fill="var(--primary-strong)"/><line x1="65.75" y1="58" x2="65.75" y2="62" stroke="var(--primary-strong)" stroke-width="1.2"/><line x1="34.25" y1="58" x2="34.25" y2="62" stroke="var(--primary-strong)" stroke-width="1.2"/><text x="8" y="58" font-size="6" fill="var(--text)">A</text><text x="90" y="58" font-size="6" fill="var(--text)">B</text><text x="52" y="58" font-size="6" fill="var(--text)">M</text><text x="83.5" y="58" font-size="6" fill="var(--text)">P</text><text x="15.5" y="58" font-size="6" fill="var(--text)">Q</text></svg>' },
                        { t: '22. Euler’s Formula (Power Form)', d: 'Let $O$ be the circumcenter, $I$ the incenter, and $R,r$ the circumradius and inradius. Then $OI^2=R^2-2Rr$.', svg: '<svg viewBox="0 0 100 100" shape-rendering="geometricPrecision"><circle cx="50" cy="42.5" r="37.5" fill="none" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="3 2"/><circle cx="50" cy="38.54" r="18.54" fill="none" stroke="var(--primary)" stroke-width="1.4"/><polygon points="20,20 80,20 50,80" fill="none" stroke="var(--text)" stroke-width="1.2"/><line x1="50" y1="42.5" x2="50" y2="38.54" stroke="var(--primary-strong)" stroke-width="1.2"/><circle cx="50" cy="42.5" r="1.5" fill="var(--text)"/><circle cx="50" cy="38.54" r="1.5" fill="var(--text)"/><text x="52" y="44.5" font-size="6" fill="var(--text)">O</text><text x="52" y="38" font-size="6" fill="var(--text)">I</text></svg>' },
                        { t: '23. Miquel Theorem', d: 'Four lines form four triangles. The circumcircles of these triangles pass through a common point (the Miquel point). The Miquel point of a complete quadrilateral exists and is unique.', svg: '<svg viewBox="0 0 100 100" shape-rendering="geometricPrecision"><line x1="5" y1="20" x2="98" y2="20" stroke="var(--text)" stroke-width="1"/><line x1="20" y1="5" x2="20" y2="98" stroke="var(--text)" stroke-width="1"/><line x1="0" y1="5" x2="100" y2="55" stroke="var(--text)" stroke-width="1"/><line x1="10" y1="100" x2="100" y2="10" stroke="var(--text)" stroke-width="1"/><circle cx="25" cy="17.5" r="5.59" fill="none" stroke="var(--primary)" stroke-width="1.1" opacity="0.65"/><circle cx="60" cy="10" r="31.62" fill="none" stroke="var(--primary-strong)" stroke-width="1.1" opacity="0.55"/><circle cx="32.5" cy="52.5" r="39.53" fill="none" stroke="var(--primary)" stroke-width="1.1" opacity="0.4"/><circle cx="28.54" cy="13.17" r="1.6" fill="var(--primary-strong)"/><text x="30.5" y="12" font-size="6" fill="var(--text)">M</text></svg>' },
                        { t: '24. Carnot’s Theorem', d: 'For a point $P$ outside $\\triangle ABC$, drop perpendiculars to the three sides (or their extensions) with feet $D,E,F$. If $P$ lies on the circumcircle of $\\triangle ABC$, then $BD^2+CE^2+AF^2=DC^2+EA^2+FB^2$.', svg: '<svg viewBox="0 0 100 100" shape-rendering="geometricPrecision"><circle cx="50" cy="42.5" r="37.5" fill="none" stroke="var(--muted)" stroke-width="1.1" stroke-dasharray="3 2"/><polygon points="20,20 80,20 50,80" fill="none" stroke="var(--text)" stroke-width="1.2" stroke-linejoin="miter"/><circle cx="80.35" cy="64.6" r="1.7" fill="var(--primary-strong)"/><text x="82" y="67" font-size="6" fill="var(--text)">P</text><line x1="80.35" y1="64.6" x2="80.35" y2="20" stroke="var(--primary-strong)" stroke-width="1" stroke-dasharray="2 2"/><circle cx="80.35" cy="20" r="1.3" fill="var(--primary-strong)"/><text x="82" y="24" font-size="6" fill="var(--text)">F</text><line x1="80.35" y1="64.6" x2="86.2" y2="18.2" stroke="var(--primary-strong)" stroke-width="1" stroke-dasharray="2 2"/><circle cx="86.2" cy="18.2" r="1.3" fill="var(--primary-strong)"/><text x="88" y="20" font-size="6" fill="var(--text)">D</text><line x1="80.35" y1="64.6" x2="50.16" y2="80.32" stroke="var(--primary-strong)" stroke-width="1" stroke-dasharray="2 2"/><circle cx="50.16" cy="80.32" r="1.3" fill="var(--primary-strong)"/><text x="52" y="84" font-size="6" fill="var(--text)">E</text><circle cx="20" cy="20" r="1.6" fill="var(--text)"/><circle cx="80" cy="20" r="1.6" fill="var(--text)"/><circle cx="50" cy="80" r="1.6" fill="var(--text)"/><text x="17" y="18" font-size="6" fill="var(--text)">A</text><text x="82" y="18" font-size="6" fill="var(--text)">B</text><text x="48" y="88" font-size="6" fill="var(--text)">C</text></svg>' },
                        { t: '25. Qinggong Theorem (Kiyomiya Hisao)', d: 'Let $P,Q$ lie on the circumcircle of $\\triangle ABC$. The angle between the Simson lines of $P$ and $Q$ equals half of the inscribed angle subtending arc $PQ$.', svg: '<svg viewBox="0 0 100 100" shape-rendering="geometricPrecision"><circle cx="50" cy="42.5" r="37.5" fill="none" stroke="var(--primary)" stroke-width="1.2"/><polygon points="20,20 80,20 50,80" fill="none" stroke="var(--text)" stroke-width="1.2"/><circle cx="76.5" cy="16" r="1.6" fill="var(--primary-strong)"/><circle cx="23.5" cy="16" r="1.6" fill="var(--primary-strong)"/><text x="78" y="18" font-size="6" fill="var(--text)">P</text><text x="15" y="18" font-size="6" fill="var(--text)">Q</text><line x1="10" y1="70" x2="92" y2="30" stroke="var(--primary-strong)" stroke-width="1.2"/><line x1="10" y1="30" x2="92" y2="70" stroke="var(--primary-strong)" stroke-width="1.2"/><path d="M 50 42.5 A 10 10 0 0 1 55 45" fill="none" stroke="var(--muted)" stroke-width="1.2"/><text x="57" y="48" font-size="6" fill="var(--muted)">θ</text><path d="M 23.5 16 A 37.5 37.5 0 0 0 76.5 16" fill="none" stroke="var(--muted)" stroke-width="2.2" opacity="0.35"/><text x="17" y="18" font-size="6" fill="var(--text)">A</text><text x="82" y="18" font-size="6" fill="var(--text)">B</text><text x="48" y="88" font-size="6" fill="var(--text)">C</text></svg>' },
                        { t: '26. Tarry Theorem', d: 'A triangle has the first and second Tarry points. They are linked to deep tangency and collinearity relations involving the circumcircle, incircle, and excircles (advanced topic).', svg: '<svg viewBox="0 0 100 100" shape-rendering="geometricPrecision"><circle cx="50" cy="42.5" r="37.5" fill="none" stroke="var(--primary)" stroke-width="1.2"/><polygon points="20,20 80,20 50,80" fill="none" stroke="var(--text)" stroke-width="1.2"/><circle cx="50" cy="52" r="10" fill="none" stroke="var(--primary-strong)" stroke-width="1.1" opacity="0.75"/><circle cx="78" cy="62" r="9" fill="none" stroke="var(--muted)" stroke-width="1.1" opacity="0.6"/><circle cx="76.5" cy="69" r="1.6" fill="var(--primary-strong)"/><circle cx="23.5" cy="69" r="1.6" fill="var(--primary-strong)"/><text x="78" y="72" font-size="6" fill="var(--text)">T₁</text><text x="15" y="72" font-size="6" fill="var(--text)">T₂</text><text x="52" y="52" font-size="6" fill="var(--text)">I</text><circle cx="50" cy="52" r="1.4" fill="var(--text)"/><circle cx="20" cy="20" r="1.6" fill="var(--text)"/><circle cx="80" cy="20" r="1.6" fill="var(--text)"/><circle cx="50" cy="80" r="1.6" fill="var(--text)"/><text x="17" y="18" font-size="6" fill="var(--text)">A</text><text x="82" y="18" font-size="6" fill="var(--text)">B</text><text x="48" y="88" font-size="6" fill="var(--text)">C</text></svg>' },
                        { t: '27. Mannheim Theorem', d: 'If a circle is tangent to sides $AB$ and $AC$ of $\\triangle ABC$ at $P$ and $Q$, and is internally tangent to the circumcircle, then line $PQ$ passes through the incenter of $\\triangle ABC$.', svg: '<svg viewBox="0 0 100 100" shape-rendering="geometricPrecision"><circle cx="50" cy="42.5" r="37.5" fill="none" stroke="var(--muted)" stroke-width="1.1" stroke-dasharray="3 2"/><polygon points="20,20 80,20 50,80" fill="none" stroke="var(--text)" stroke-width="1.2"/><circle cx="50" cy="45" r="12" fill="none" stroke="var(--primary)" stroke-width="1.3"/><circle cx="41" cy="31" r="1.4" fill="var(--primary-strong)"/><circle cx="59" cy="31" r="1.4" fill="var(--primary-strong)"/><text x="34" y="30" font-size="6" fill="var(--text)">P</text><text x="61" y="30" font-size="6" fill="var(--text)">Q</text><line x1="41" y1="31" x2="59" y2="31" stroke="var(--primary-strong)" stroke-width="1.2"/><circle cx="50" cy="49" r="1.6" fill="var(--primary-strong)"/><text x="52" y="52" font-size="6" fill="var(--text)">I</text><circle cx="20" cy="20" r="1.6" fill="var(--text)"/><circle cx="80" cy="20" r="1.6" fill="var(--text)"/><circle cx="50" cy="80" r="1.6" fill="var(--text)"/><text x="17" y="18" font-size="6" fill="var(--text)">A</text><text x="82" y="18" font-size="6" fill="var(--text)">B</text><text x="48" y="88" font-size="6" fill="var(--text)">C</text></svg>' },
                        { t: '28. Spieker Circle', d: 'The incircle of the medial triangle is called the Spieker circle. Its center is the Spieker center (the incenter of the medial triangle).', svg: '<svg viewBox="0 0 100 100" shape-rendering="geometricPrecision"><polygon points="20,20 80,20 50,80" fill="none" stroke="var(--text)" stroke-width="1.2"/><circle cx="65" cy="50" r="1.4" fill="var(--primary-strong)"/><circle cx="35" cy="50" r="1.4" fill="var(--primary-strong)"/><circle cx="50" cy="20" r="1.4" fill="var(--primary-strong)"/><polygon points="50,20 65,50 35,50" fill="none" stroke="var(--muted)" stroke-width="1.2"/><circle cx="50" cy="40" r="7.2" fill="none" stroke="var(--primary)" stroke-width="1.3"/><circle cx="50" cy="40" r="1.5" fill="var(--primary-strong)"/><text x="52" y="42.5" font-size="6" fill="var(--text)">S</text><text x="67" y="53" font-size="6" fill="var(--text)">D</text><text x="29" y="53" font-size="6" fill="var(--text)">E</text><text x="52" y="18.5" font-size="6" fill="var(--text)">F</text><circle cx="20" cy="20" r="1.6" fill="var(--text)"/><circle cx="80" cy="20" r="1.6" fill="var(--text)"/><circle cx="50" cy="80" r="1.6" fill="var(--text)"/><text x="17" y="18" font-size="6" fill="var(--text)">A</text><text x="82" y="18" font-size="6" fill="var(--text)">B</text><text x="48" y="88" font-size="6" fill="var(--text)">C</text></svg>' },
                        { t: '29. Brocard Theorem', d: 'There is a unique Brocard point $\\Omega$ such that $\\angle \\Omega AB=\\angle \\Omega BC=\\angle \\Omega CA=\\omega$. The Brocard angle satisfies $\\cot\\omega=\\cot A+\\cot B+\\cot C$.', svg: '<svg viewBox="0 0 100 100" shape-rendering="geometricPrecision"><polygon points="20,20 80,20 50,80" fill="none" stroke="var(--text)" stroke-width="1.2"/><circle cx="52" cy="45" r="1.7" fill="var(--primary-strong)"/><text x="54" y="47.5" font-size="6" fill="var(--text)">Ω</text><line x1="52" y1="45" x2="20" y2="20" stroke="var(--primary-strong)" stroke-width="1.1"/><line x1="52" y1="45" x2="80" y2="20" stroke="var(--primary-strong)" stroke-width="1.1"/><line x1="52" y1="45" x2="50" y2="80" stroke="var(--primary-strong)" stroke-width="1.1"/><path d="M 26 20 A 6 6 0 0 1 23 25" fill="none" stroke="var(--muted)" stroke-width="1.1"/><text x="26" y="29" font-size="6" fill="var(--muted)">ω</text><circle cx="20" cy="20" r="1.6" fill="var(--text)"/><circle cx="80" cy="20" r="1.6" fill="var(--text)"/><circle cx="50" cy="80" r="1.6" fill="var(--text)"/><text x="17" y="18" font-size="6" fill="var(--text)">A</text><text x="82" y="18" font-size="6" fill="var(--text)">B</text><text x="48" y="88" font-size="6" fill="var(--text)">C</text></svg>' },
                        { t: '30. Pole–Polar Theory (Advanced)', d: 'Polar of a point $P$: the chords of contact corresponding to secants through $P$ are collinear. Duality: point on a line $\\Leftrightarrow$ the line passes through the pole. Concurrent polars $\\Leftrightarrow$ collinear poles.', svg: '<svg viewBox="0 0 100 100" shape-rendering="geometricPrecision"><circle cx="45" cy="50" r="28" fill="none" stroke="var(--primary)" stroke-width="1.3"/><circle cx="85" cy="50" r="1.7" fill="var(--primary-strong)"/><text x="87" y="53" font-size="6" fill="var(--text)">P</text><line x1="85" y1="50" x2="62" y2="29" stroke="var(--primary-strong)" stroke-width="1.1"/><line x1="85" y1="50" x2="62" y2="71" stroke="var(--primary-strong)" stroke-width="1.1"/><circle cx="62" cy="29" r="1.4" fill="var(--primary-strong)"/><circle cx="62" cy="71" r="1.4" fill="var(--primary-strong)"/><text x="64" y="28" font-size="6" fill="var(--text)">A</text><text x="64" y="75" font-size="6" fill="var(--text)">B</text><line x1="62" y1="29" x2="62" y2="71" stroke="var(--muted)" stroke-width="1.4"/><text x="64" y="52" font-size="6" fill="var(--muted)">l</text></svg>' }
                    ]}
                ]
            }
        };

        function initPage() {
            const lang = localStorage.getItem('appLang') || 'zh-CN';
            const theme = localStorage.getItem('appTheme') || 'default';
            const texts = langTexts[lang] || langTexts['zh-CN'];

            document.body.className = theme === 'default' ? '' : theme + '-mode';
            document.getElementById('backBtn').textContent = texts.backBtn;
            document.getElementById('pageTitle').textContent = texts.pageTitle;

            let html = '';
            texts.levels.forEach(level => {
                html += '<section class="level-section"><h2 class="level-title">' + level.title + '</h2>';
                level.theorems.forEach(th => {
                    html += `<div class="theorem-card">
                        <h3>${th.t}</h3>
                        <p>${th.d}</p>
                        <div class="diagram-box">${th.svg}</div>
                    </div>`;
                });
                html += '</section>';
            });
            document.getElementById('theoremContent').innerHTML = html;
            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise();
            }
        }

        window.onload = initPage;
    </script>
</body>
</html>
