<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VIP 会员中心 - 圆几何交互式学习平台</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Trebuchet MS", "Microsoft YaHei", sans-serif; }

        :root {
            --primary: #2563eb;
            --primary-strong: #1d4ed8;
            --text: #1f2937;
            --muted: #64748b;
            --bg-color: #f8fafc;
            --surface: rgba(255, 255, 255, 0.85);
            --surface-strong: #ffffff;
            --border-color: #e2e8f0;
            --shadow-lg: 0 24px 60px rgba(31, 41, 55, 0.12);
            --radius-xl: 28px;
            --font-size: 16px;
            --vip-gold: #f59e0b;
            --vip-gold-strong: #b45309;
        }

        body {
            color: var(--text); font-size: var(--font-size);
            background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
            min-height: 100vh; line-height: 1.6; transition: all 0.3s ease;
            padding-top: 100px;
        }

        body.eye-mode { --bg-color: #f0f9eb; --surface: rgba(247, 251, 242, 0.88); --text: #166534; --border-color: #c7e3b4; --primary: #438a4c; }
        body.night-mode {
            --text: #f1f5f9;
            --muted: #94a3b8;
            --primary: #60a5fa;
            --surface: rgba(15, 23, 42, 0.9);
            --surface-strong: #0f172a;
            --border-color: #334155;
            --bg-color: #020617;
            background:
                radial-gradient(circle at 12% 10%, rgba(56, 189, 248, 0.15), transparent 25%),
                radial-gradient(circle at 86% 14%, rgba(56, 189, 248, 0.15), transparent 22%),
                linear-gradient(rgba(56, 189, 248, 0.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56, 189, 248, 0.2) 1px, transparent 1px),
                linear-gradient(180deg, #020617 0%, #0f172a 100%);
            background-size: auto, auto, 46px 46px, 46px 46px, auto;
        }

        .header-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 80px; padding: 0 4vw;
            background: var(--surface); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center; z-index: 1000;
        }

        .logo {
            font-size: 1.5rem; font-weight: 800; font-family: "Orbitron", sans-serif;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }

        .back-btn {
            padding: 8px 20px; border-radius: 100px; background: var(--primary); color: white;
            font-weight: 600; text-decoration: none; transition: all 0.3s;
        }
        .back-btn:hover { transform: translateX(-5px); background: var(--primary-strong); }

        .content-container {
            max-width: 1100px; margin: 0 auto; padding: 0 4vw 60px;
        }

        .glass-panel {
            background: var(--surface); backdrop-filter: blur(20px); border-radius: 40px;
            padding: 50px; border: 1px solid var(--border-color); box-shadow: var(--shadow-lg);
            text-align: center;
        }

        .vip-title { font-size: 2.8rem; font-weight: 800; color: var(--vip-gold-strong); margin-bottom: 15px; }
        body.night-mode .vip-title { color: var(--vip-gold); }
        .vip-subtitle { color: var(--muted); font-size: 1.2rem; margin-bottom: 40px; }

        /* 权益展示 */
        .benefits-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; margin-bottom: 50px;
        }
        .benefit-card {
            padding: 30px; background: rgba(245, 158, 11, 0.05); border: 1px solid rgba(245, 158, 11, 0.1);
            border-radius: 25px; transition: all 0.3s;
        }
        .benefit-card:hover { transform: translateY(-10px); background: rgba(245, 158, 11, 0.1); }
        .benefit-card i { font-size: 2.5rem; color: var(--vip-gold); margin-bottom: 15px; }
        .benefit-card h3 { font-size: 1.3rem; margin-bottom: 10px; color: var(--text); }
        .benefit-card p { font-size: 0.95rem; color: var(--muted); }

        /* 价格卡片 */
        .pricing-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 50px;
        }
        .price-card {
            padding: 40px 20px; border-radius: 30px; border: 2px solid var(--border-color);
            background: var(--surface-strong); cursor: pointer; transition: all 0.3s;
            display: flex; flex-direction: column; align-items: center;
        }
        .price-card.recommended { border-color: var(--vip-gold); position: relative; transform: scale(1.05); }
        .price-card.recommended::after {
            content: "HOT"; position: absolute; top: -15px; background: var(--vip-gold);
            color: white; padding: 4px 15px; border-radius: 100px; font-weight: 800; font-size: 0.8rem;
        }
        .price-card:hover { border-color: var(--vip-gold); }
        .price-card.active { border-color: var(--vip-gold); background: rgba(245, 158, 11, 0.05); }
        
        .plan-name { font-size: 1.2rem; font-weight: 700; margin-bottom: 15px; }
        .plan-price { font-size: 2.2rem; font-weight: 800; color: var(--vip-gold-strong); }
        body.night-mode .plan-price { color: var(--vip-gold); }
        .plan-price span { font-size: 1rem; color: var(--muted); font-weight: 400; }

        /* 二维码区域 */
        .checkout-section {
            margin-top: 40px; padding-top: 40px; border-top: 1px solid var(--border-color);
            display: flex; flex-direction: column; align-items: center;
        }
        .qr-container {
            width: 200px; height: 200px; background: white; padding: 15px; border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin-bottom: 20px;
            display: flex; justify-content: center; align-items: center; position: relative;
        }
        .qr-placeholder {
            width: 100%; height: 100%; background: linear-gradient(45deg, #eee 25%, #fff 25%, #fff 50%, #eee 50%, #eee 75%, #fff 75%, #fff 100%);
            background-size: 20px 20px; opacity: 0.8;
        }
        .qr-icon { position: absolute; font-size: 3rem; color: #333; }
        
        .payment-tips { font-size: 0.9rem; color: var(--muted); margin-bottom: 20px; }
        .pay-methods { display: flex; gap: 20px; font-size: 1.5rem; color: var(--muted); }
        .pay-methods i:hover { color: var(--primary); }

        @media (max-width: 850px) {
            .benefits-grid, .pricing-grid { grid-template-columns: 1fr; }
            .price-card.recommended { transform: scale(1); }
        }
    </style>
</head>
<body>
    <header class="header-container">
        <a href="index.html" class="logo">VIP CENTER</a>
        <a href="index.html" class="back-btn" id="backBtn">返回首页</a>
    </header>

    <main class="content-container">
        <div class="glass-panel">
            <h1 class="vip-title" id="vipPageTitle">升级 VIP 会员</h1>
            <p class="vip-subtitle" id="vipPageSubtitle">解锁全站核心资源，开启圆几何探索之旅</p>

            <div class="benefits-grid">
                <div class="benefit-card">
                    <i class="fas fa-file-signature"></i>
                    <h3 id="benefit1Title">解锁最新题目</h3>
                    <p id="benefit1Desc">每日更新中考、竞赛真题，由 AI 深度解析解题思路。</p>
                </div>
                <div class="benefit-card">
                    <i class="fas fa-gamepad"></i>
                    <h3 id="benefit2Title">抢先玩新游戏</h3>
                    <p id="benefit2Desc">获得实验室最新几何游戏的内测资格，寓教于乐。</p>
                </div>
                <div class="benefit-card">
                    <i class="fas fa-bolt"></i>
                    <h3 id="benefit3Title">极速 AI 响应</h3>
                    <p id="benefit3Desc">尊享专属加速通道，AI 问答无需排队，秒速回传结果。</p>
                </div>
            </div>

            <div class="pricing-grid">
                <div class="price-card" onclick="selectPlan(this, '0.20')">
                    <div class="plan-name" id="planDaily">体验会员</div>
                    <div class="plan-price">￥0.2<span> / 天</span></div>
                </div>
                <div class="price-card recommended active" onclick="selectPlan(this, '2.99')">
                    <div class="plan-name" id="planMonthly">包月会员</div>
                    <div class="plan-price">￥2.99<span> / 月</span></div>
                </div>
                <div class="price-card" onclick="selectPlan(this, '29.99')">
                    <div class="plan-name" id="planYearly">包年会员</div>
                    <div class="plan-price">￥29.99<span> / 年</span></div>
                </div>
            </div>

            <div class="checkout-section">
                <div class="qr-container">
                    <div class="qr-placeholder"></div>
                    <i class="fas fa-qrcode qr-icon"></i>
                </div>
                <p class="payment-tips" id="paymentTips">请使用微信或支付宝扫码支付（测试环境）</p>
                <div class="pay-methods">
                    <i class="fab fa-weixin"></i>
                    <i class="fab fa-alipay"></i>
                </div>
            </div>
        </div>
    </main>

    <script>
        const langTexts = {
            'zh-CN': {
                backBtn: '返回首页',
                vipPageTitle: '升级 VIP 会员',
                vipPageSubtitle: '解锁全站核心资源，开启圆几何探索之旅',
                benefit1Title: '解锁最新题目',
                benefit1Desc: '每日更新中考、竞赛真题，由 AI 深度解析解题思路。',
                benefit2Title: '抢先玩新游戏',
                benefit2Desc: '获得实验室最新几何游戏的内测资格，寓教于乐。',
                benefit3Title: '极速 AI 响应',
                benefit3Desc: '尊享专属加速通道，AI 问答无需排队，秒速回传结果。',
                planDaily: '体验会员',
                planMonthly: '包月会员',
                planYearly: '包年会员',
                paymentTips: '请使用微信或支付宝扫码支付（虚构测试环境）'
            },
            'en': {
                backBtn: 'Back Home',
                vipPageTitle: 'Upgrade to VIP',
                vipPageSubtitle: 'Unlock core resources and start your journey',
                benefit1Title: 'Unlock Questions',
                benefit1Desc: 'Daily updates of exam and competition questions with AI analysis.',
                benefit2Title: 'Early Access',
                benefit2Desc: 'Be the first to play our latest geometry games.',
                benefit3Title: 'Fast AI Response',
                benefit3Desc: 'Enjoy priority AI channels with zero waiting time.',
                planDaily: 'Daily Plan',
                planMonthly: 'Monthly Plan',
                planYearly: 'Annual Plan',
                paymentTips: 'Scan with WeChat or Alipay (Mock Environment)'
            }
        };

        function selectPlan(el, price) {
            document.querySelectorAll('.price-card').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            // 可以在这里更新支付提示或二维码金额
        }

        function initPage() {
            const lang = localStorage.getItem('appLang') || 'zh-CN';
            const theme = localStorage.getItem('appTheme') || 'default';
            const texts = langTexts[lang] || langTexts['zh-CN'];

            document.body.className = theme === 'default' ? '' : theme + '-mode';
            document.getElementById('backBtn').textContent = texts.backBtn;
            
            // 更新所有翻译文本
            for (const key in texts) {
                const el = document.getElementById(key);
                if (el) el.textContent = texts[key];
            }
        }

        window.onload = initPage;
    </script>
</body>
</html>
